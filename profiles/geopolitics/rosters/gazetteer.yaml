# polity_offices: the three polity offices the officeholder guard reconciles
# (was _OFFICEHOLDER_ROLE_PREDICATES / _OFFICEHOLDER_FAMILY_PREDICATES /
# _LEADER_OF_PREDICATE; canonical predicates, vocabulary.PREDICATE_CANONICAL).
polity_offices:
  role_predicates:
    "president": ["head of state", "head of government"]
    "prime minister": ["head of government"]
    "chancellor": ["head of government"]
    "premier": ["head of government"]
  family_predicates: ["head of state", "head of government"]
  leader_of: "leader of"

