# K-1 cyber desk (2026-11-14) — draft SourceDescriptor. Ships DRAFT (operator activates).
#
# The UK National Cyber Security Centre's "All" feed (news, reports, guidance,
# blog posts). The NCSC publishes no separate machine-readable advisory feed;
# its alerts and advisories appear here as news/report items. Probed
# 2026-11-13 (one GET, generic client identity): HTTP 200,
# application/rss+xml, 20 items spanning ~3 months, short descriptions
# (median ~130 characters) — a summary feed; the evidence archiver fetches
# the page.
#
# Geography: declared GB. The NCSC's news is about the UK's own posture
# (warnings to UK organisations, schemes, the agency's own assessments); the
# declared code is the publisher-origin FALLBACK only, applied when the
# in-body geocoder resolves no country (data/sources/baseline.py).
#
# robots.txt returned 404
# (no rules). Credibility: ncsc.gov.uk 0.90 / gov.
# Low volume: no keyword gate. First poll: the last three days (usually 0-3
# items). Every three hours.
#
# Desk routing: scope.classifications `geopolitics.topic:cyber` is stamped on
# every signal (W10 TAX-2) — the cyber desk's tag arm (target_cyber.yaml).

identity:
  id: source.ncsc.uk_all
  name: UK NCSC — news, reports, guidance and blogs
  kind: rss
  schema_uri: legba/source/1.0.0
  version: "0000000000000000"        # placeholder — registry stamps content hash
  abstraction_level: L1
  state: draft
  owner: cyber_desk_k1
  created: "2026-11-14T00:00:00Z"

scope:
  owner_tenant: shared
  geo: [GB]
  languages: [en]
  tags: [cyber, advisory, gov, gb, cyber_desk]
  classifications: ["geopolitics.topic:cyber"]
  source_class: official
  license_class: open_gov_attribution
  attribution: "Contains public sector information licensed under the Open Government Licence v3.0 (NCSC, ncsc.gov.uk)"
  access_class: public          # free no-auth feed, no separate reuse agreement

acquisition: poll

cadence:
  schedule:
    factory_kind: cron
    raw: "27 */3 * * *"
  cooldown_seconds: 60
  jitter_seconds: 30

config:
  url:
    factory_kind: text
    raw: "https://www.ncsc.gov.uk/api/1/services/v1/all-rss-feed.xml"

pipeline:
  ingestion_filters:
    - kind: dedupe_tier_1            # URL-canonical hash
      config: {}
    - kind: dedupe_tier_2            # SHA-256 content hash
      config: {}
  enrichment:
    # language_detect FIRST so ner_multilingual uses the detected language.
    # No fact_extractor (the conservative default of the official-feed drafts).
    - kind: language_detect
      config: {}
    - kind: ner_multilingual
      config: {}
    - kind: geocode
      config: {}
  media: reference

deps: {}

output:
  retention: interest
  max_age_seconds: 604800
  delivery: lossy

subscription_policy: open
