# New-model optimizer analyst: country_optimizer.
#
# kind: optimizer.  method.kind: dspy_compile (exempt from prompt_module).
# Reads analyst_traces ⋈ analyst_critiques on run_id over a window and emits a
# PromptModuleCandidate for the country_assessor's prompt module.  Promotion is
# human_gated.  Runs as a Temporal workflow (the one actor kind that does).
#
# An optimizer analyst MUST declare an eval block (schema constraint).
#
# ── OPTIMIZER MOTHBALLED ───────────────────────────────────────────────
# state flipped active -> paused: the GEPA optimizer plane is mothballed
# (docs/SEAMS.md #53). This
# monolith was already frozen by the earlier SEQUENCED FREEZE (SEAMS #30,
# cadence.fallback_schedule: null below) and has zero lifetime runs; `paused`
# makes the mothball explicit rather than relying only on the null cadence.
# `paused` is the schema's built-in, RESUMABLE halt (LifecycleState, ACTIVE
# <-> PAUSED both ways) — not `retired` (terminal). TREE ONLY: this edit has
# NOT been PUT to the live registry (BUILD-ONLY); the
# live head stays `active` until an operator deploys + PUTs this. The code
# path also refuses loud regardless (src/legba/data/analysts/optimizer.py
# ::run_method, OptimizerMothballedError) so a stray trigger before this
# descriptor is live still fails LOUD, never silently. To restore: flip
# back to `active` (registry PUT) and see docs/SEAMS.md #53 "To restore".

identity:
  id: country_optimizer
  name: G20 Country Optimizer (DSPy + GEPA)
  schema_uri: legba/analyst/1.0.0
  version: "0000000000000000"
  kind: optimizer
  type_signature:
    input_type: legba.runtime.TraceCritiqueJoin
    output_type: legba.runtime.PromptModuleCandidate
  state: paused
  owner: owner@local

subscription:
  # Walks analyst_traces ⋈ analyst_critiques — not the signal slice.
  substrate:
    direct_queries: true

mapping:
  fields: []
  schema_drift_policy: warn_and_continue

method:
  kind: dspy_compile
  budget_tokens_per_day: 0

cadence:
  # ── SEQUENCED FREEZE (SUBTRACT) ──────────────────────────
  # fallback_schedule is NULLED to freeze the GEPA self-optimizer's cadence:
  # the dapr_actors on-activate gate (`if schedule:`,
  # src/legba/runtime/dapr_actors.py ~L1198) registers NO `run_cadence`
  # reminder for a null schedule, so this analyst fires on no tick. This is a
  # FREEZE, NOT a deletion — the optimizer (kind/eval/outputs all intact)
  # RETURNS later as a MEASURED experiment (a GEPA promotion gated on a real
  # before/after delta), not an unverified always-on monolith. Declared in
  # docs/SEAMS.md as a sequenced freeze. To restore: set fallback_schedule
  # back to "0 3 * * *" (the prior daily-at-03:00-UTC compile cadence).
  fallback_schedule: null
  # Retained but inert without a schedule (no reminder to cool down). Kept so a
  # later re-trigger inherits the same 6h floor between compiles.
  cooldown_seconds: 21600

outputs:
  - kind: nats_stream
    config:
      channel: prompt_module_candidates

eval:
  optimizer:
    analyzed_analyst_id: country_assessor
    # Per-analyst prompt module (#37): the REAL country_assessor baseline
    # (legba/prompts/country_assessor/v1.py — instructions = the live
    # country-assessor system prompt), NOT the generic inline_target module.
    # GEPA evolves THIS; the promoted champion becomes country_assessor's
    # live system prompt. (Also the convention fallback for analyzed
    # analyst country_assessor → legba.prompts.country_assessor.v1.)
    parent_prompt_module_path: legba.prompts.country_assessor.v1
    min_traces_required: 10
    min_critiques_required: 1
    promotion_policy: human_gated
