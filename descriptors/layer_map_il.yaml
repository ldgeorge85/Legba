apertures:
- layer: official
  declared: absent
  reason: "Absent from our sources, not structurally absent — Israel publishes extensively through its own channels (MFA, IDF Spokesperson's Unit, Government Press Office, Knesset), but none of those is a dedicated official-class SourceDescriptor in this catalog (no gov.il feed, no IDF spokesperson feed). The one Israeli government voice we do ingest, the IsraelMFA Telegram channel, rides inside source.telegram.org_channels — a generic social_digest-classed monitor whose per-channel default is 'reporting', not the 'state_media'/official override the way Almasirah_En/ansarollah1 got (config.classes) — so it does not populate an official-layer entry in this table. This is a real curation gap, not a claim that Israel has no official voice to read."
- layer: domestic_press
  declared: present
  reason: "Two English-language Israeli mastheads are catalogued: The Jerusalem Post (source.jpost.frontpage) and The Times of Israel (source.timesofisrael.news), both geo:[IL], reporting source_class, neither wire-owned nor state-owned per wire_map.yaml and their own descriptors. Both are currently identity.state: draft (catalogued, not yet activated live) — present at the curated layer-table level; the operator still has to flip them active to realize the coverage in production. No Hebrew-language domestic outlet is ingested — an English-only domestic layer for IL, worth flagging as a real gap even though the layer itself is present."
- layer: foreign_press
  declared: present
  reason: "Dozens of international outlets and one wire's own feed cover Israel from outside: global broadcasters (BBC, DW, Al Jazeera, Euronews, France24, Guardian), AP's own feed folded via wire_map.yaml same_publisher['ap'] (source.rsshub.apnews.world), and Middle-East-adjacent independents (Middle East Eye, explicitly scoped 'Gulf + Israel/Iran adjacency' in its own descriptor). Several are already identity.state: active (e.g. source.aljazeera.world)."
- layer: social_digest
  declared: present
  reason: "source.telegram.org_channels (already live per the descriptor's own noted production drift) monitors two Israel-relevant channels by name: IsraelMFA and TheTimesOfIsrael2022, among ~20 other state/media/IGO/independent channels. source.discord.default is also catalogued but is KEYED/state:draft with a placeholder application_id and no channels configured, so it contributes no known Israel-specific coverage today (see the doubt below) — the telegram channel alone is enough to declare this layer present."
- layer: public_data
  declared: present
  reason: "Global IGO/structured feeds carry direct Israel/Palestine coverage within a wider scope: UN News — Middle East and UN News — Peace and Security regularly cover Israel/Gaza/Lebanon; UN Meetings Coverage carries UN Security Council sessions on the same; ReliefWeb (OCHA) carries oPt/Gaza humanitarian reporting; OpenSanctions (API + bulk) carries Israel-related sanctions/PEP listings; ACLED codes Israel/Gaza/Lebanon/West Bank conflict events; ISW's assessments explicitly cover the Israel-Hamas/Hezbollah conflict. None of these is single-country-scoped, which is exactly why they read as public_data rather than domestic/foreign press."
- layer: physical
  declared: present
  reason: "source.usgs.earthquakes (GeoJSON, globally scoped, kind=geojson) is a model-free structured hazard feed whose catalog includes the seismically active Dead Sea Transform — real IL-relevant physical-layer coverage, not merely a theoretical global inclusion. It is the layer's only source, by design (the layer vocabulary's one no-editorial-voice bucket)."

