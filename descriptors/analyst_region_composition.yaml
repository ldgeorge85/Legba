# S2-T2 — per-REGION composition over the verified per-COUNTRY reads.
#
# The 4th composition floor of the tower, BETWEEN the per-country reads and the
# world read:
#
#     unit sub-claim  →  country read  →  REGION read  →  world read
#
# A second-order finding per REGION FRAME (mena / europe / … — the five S2-T1
# region frames) that reads the verified country_composition HEADS for THAT
# region's member country desks and synthesizes ONE per-region read. It reuses
# the EXISTING meta_findings_synthesizer kind (Approach A: CONFIGURE, no new
# Python kind); the region behavior is descriptor + the S2-T2 READ_SLICE region
# branch.
#
# ── why this is per-region (a `subscription.targets` block) ─────────────────
# The runtime's `_cadence_targets` (dapr_actors.py) keys the per-target-vs-global
# split PURELY on whether `subscription.targets` is present. Present ⇒ it fans out
# ONE worker per MATCHED target with `target_filter=<matched target id>`. This
# descriptor's selector is `has_tag("region")`, which matches the FIVE region
# frames (each carries the common `region` tag) — so it fires one worker per
# frame with `target_filter='region_<slug>'` (e.g. `region_mena`).
#
# ── why a region run is a NEW 4th READ_SLICE mode (NOT a per-country filter) ──
# A region frame (`region_mena`) is a FRAME target — it has NO country_composition
# finding of its OWN. The per-COUNTRY branch would scope `f.target_id='region_mena'`
# and match nothing. So the kind's READ_SLICE detects the `region_` prefix and
# instead: (a) resolves the frame → its MEMBER country desks (the targets whose
# `scope.tags` carry the SAME `region_<slug>` tag — Saudi Arabia / Turkey / Israel
# / Iran for `region_mena`); (b) reads THEIR country_composition heads as a SET
# (`target_ids = ANY(...)`), verify-floored + `include_meta=True` (a
# country_composition finding is `meta=True`) + one HEAD per member country; and
# (c) the run selects the WORLD-shaped `_WORLD_COMPOSITION_SYSTEM` prompt (a region
# read is MULTI-country → the cross-country hedge + disagreement shape, NOT the
# single-country prompt).
#
# HONESTY: a region whose member desks produced no verify-passed country read
# yields an EMPTY slice ⇒ the kind's empty-slice path emits a confidence=0.0
# "No source findings to synthesize" finding (stamped `target_id=region_<slug>`,
# tags `empty_slice`+`meta`) — the region is NAMED as a gap, not silently missing.
#
# derived_from is stamped by the kind from the contributing country_composition
# finding ids, so the per-region lineage back-walks one hop to the country reads,
# two hops to the P2 units, three to their cited signals.
#
# ── supersession (per S8-T3) ────────────────────────────────────────────────
# Each region run WRITES its finding with `target_id=region_<slug>` (the actor
# stamps it from `target_filter`), so the shared composition-supersession machinery
# keys per-(analyst_id, target_id): a fresh `region_mena` head supersedes the prior
# `region_mena` head, independent of the other four regions. The read-side head-fold
# (`superseded_by IS NULL` + one-head-per-(analyst,target) DISTINCT ON) is the belt.
#
# ── verify OPT-IN ───────────────────────────────────────────────────────────
# `method.llm.verify` PRESENCE is the discriminator the whole verify dispatch keys
# on: the actor fires the faithfulness verify for THIS meta_findings_synthesizer
# finding (the generalized pass recognizes the composition's [[ref:N]] → country-read
# bridge and hands the judge each cited country read's text as the evidence for each
# composed clause). The region compose is target-scoped, but the verify dispatch is
# gated on the verify block, NOT on target_filter — so the region read IS verified.

identity:
  id: region_composition
  name: Per-Region Composition (country reads → one region read)
  schema_uri: legba/analyst/1.0.0
  version: "0000000000000000"        # registry stamps the content hash
  kind: meta_findings_synthesizer
  type_signature:
    input_type: legba.runtime.SignalList
    output_type: legba.runtime.Finding
    deps_type: legba.runtime.deps.StandardDeps
  state: active
  owner: s2_t2

subscription:
  # PRESENT `targets` block ⇒ per-REGION analyst. `_cadence_targets` matches the
  # `region` tag (the five S2-T1 region frames) and fires ONE worker per frame
  # with `target_filter=region_<slug>`. has_tag is valid on the analyst.subscription
  # surface. The member country desks carry the SPECIFIC `region_<slug>` tag (not
  # the common `region` tag), so this selector matches ONLY the frames, never a
  # member desk.
  targets:
    predicate: 'has_tag("region")'
    data_types: [finding]
    time_window: 24h
  # The synth reads the OUTPUTS of country_composition, not raw signals. READ_SLICE
  # resolves this set from other_analysts[].id and — because the run is a REGION
  # frame — restricts to the region's MEMBER-country country_composition heads,
  # verify-floored. 24h window: country_composition composes 2x/day, so a 24h
  # look-back holds the freshest head per member country.
  other_analysts:
    - id: country_composition
      data_types: [finding]
      time_window: 24h
  substrate:
    direct_queries: false        # reads via the kind's READ_SLICE, not ad-hoc SQL

mapping:
  fields: []
  schema_drift_policy: warn_and_continue

method:
  # Runtime dispatch is on identity.kind (meta_findings_synthesizer); method.kind
  # only needs to be a valid enum. llm_planner matches the single-turn
  # chat_complete shape the kind uses (same as analyst_country_composition.yaml).
  kind: llm_planner
  prompt_module: "legba.prompts.meta_findings_synthesizer.v1"
  llm:
    # MODEL POLICY (operator): synthesis on the CORE plane gpt-oss-120B via a
    # stack_ref ($0). NEVER hardcode a model — keeping it a stack_ref makes
    # switching to Opus later a one-line descriptor PUT.
    primary:
      factory_kind: stack_ref
      raw: llm.primary.openai_compat
      expected_family: llm_provider
    # S2-T2: faithfulness VERIFY judge over the REGION composition itself.
    # Currently the SAME core reasoning model (llm.primary.openai_compat,
    # gpt-oss-120B) that writes the units + the per-country + world compositions —
    # NOT a cross-family judge (same TEMPORARY limitation the country/world
    # compositions carry; a dedicated reasoning judge is planned). This verify
    # block's PRESENCE (not target_id) is the OPT-IN the dispatch keys on. The
    # generalized verify pass recognizes the composition's [[ref:N]] → country-read
    # bridge and hands the judge each cited country read's text as the evidence for
    # each composed clause. Gated by LEGBA_VERIFY_LLM_JUDGE; soft-fails to the
    # deterministic floor (which still enforces the T7 anti-double-counting +
    # hedge-laundering cap). Model stays a switchable stack_ref.
    verify:
      factory_kind: stack_ref
      raw: llm.primary.openai_compat
      expected_family: llm_provider
    max_tokens: 768            # the kind's DEFAULT_MAX_TOKENS (narrower context)
  budget_tokens_per_day: 1000000
  retry:
    budget:
      strategy: pause_until_next_window

cadence:
  # STAGGERED BETWEEN the country reads and the world compose. country_composition
  # composes at :30 past 11 / 23 UTC; the world compose (world_assessor) runs at
  # 00:00 / 12:00 UTC. The region compose fires at :45 past 11 / 23 UTC — AFTER the
  # freshest per-country heads have landed (15m margin) and BEFORE the world compose
  # (15m margin), so the world read (which reads country_composition, not region)
  # is never blocked and the region read sees the freshest country heads.
  fallback_schedule: "45 11,23 * * *"
  # 11h — below the 12h interval, stamped per-(analyst,target) at completion. A
  # cooldown == the 12h interval would land past the next fire and silently halve
  # each region's cadence (12h→24h). 11h keeps a 1h margin (matches the units +
  # country_composition + world_assessor).
  cooldown_seconds: 39600

outputs: []
