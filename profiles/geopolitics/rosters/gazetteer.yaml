# polities: the polity UNIVERSE is DERIVED, never copied — `universe: pycountry`
# reads every ISO-3166-1 record's name / common_name / official_name (249 rows;
# the registry's slim image, which has no pycountry, reads `curated` alone).
# `curated` are the forms pycountry stores under another head or not at all
# (was the inline set in _entity_canon._country_name_set). The CANON polities
# (_polity_match._SURFACES / _geo_routing.CANON_POLITIES) are derived too: the
# canonical names alias_map and demonym_map resolve to. A set.
polities:
  universe: pycountry
  curated: ["russia", "south korea", "north korea", "united states", "united kingdom", "united arab emirates", "democratic republic of the congo", "czechia", "iran", "syria", "vietnam", "laos", "moldova", "tanzania", "bolivia", "venezuela", "turkey", "turkiye", "kosovo", "palestine"]

