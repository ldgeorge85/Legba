# cross_analyst_correlator — the sibling analysis-of-analysis kind (Piece 3, Task C).
#
# Where meta_synthesizer reads ONLY country_assessor + world_assessor FINDINGS and
# emits a convergent/contradictory second-order narrative, the correlator reads a
# WIDER set across ALL output kinds (findings + predictions) and reports explicit
# convergences / contradictions / blind-spots with data.referenced_analyst_ids.
#
# Differentiated from meta_synthesizer per the plan's "do not register both
# pointing at an identical input set with identical cadence":
#   * INPUT BREADTH — adds country_predictor; data_types include prediction.
#   * SCHEDULE       — staggered to ":45" so it does not co-fire with the synth.
#
# META analyst: no subscription.targets => single global run per tick. Source set
# resolved by the kind's READ_SLICE from other_analysts[].id (Piece 3, Task A2 —
# the same id_list->other_analysts[].id fix applied to the synth). Without Task A2
# the correlator silently degraded to a whole-pool scan ignoring this set.

identity:
  id: cross_correlator
  name: Cross-Analyst Correlator (G20 + World + Predictor)
  schema_uri: legba/analyst/1.0.0
  version: "0000000000000000"        # registry stamps the content hash
  kind: cross_analyst_correlator
  type_signature:
    input_type: legba.runtime.SignalList
    output_type: legba.runtime.Finding
    deps_type: legba.runtime.deps.StandardDeps
  state: active
  owner: release_meta_activation

subscription:
  # No `targets` block => META analyst (single global run; target_filter=None).
  # M19 (2026-07-06) — REPOINTED to the LIVE composition + unit layer. The prior
  # set (country_assessor / country_predictor / world_assessor) pointed at the
  # RETIRED per-country layer (country_assessor last fired 2026-07-01;
  # country_predictor is gone), so the correlator saw a near-monoculture and
  # degraded to "insufficient cross-analyst data" blind_spots while hundreds of
  # live unit + composition findings went uncorrelated. It now reads the eight
  # bounded UNITS + the country/region compositions + the world composition — the
  # real analytical surface it is meant to correlate across.
  other_analysts:
    - id: country_composition
      data_types: [finding]
      time_window: 24h
    - id: region_composition
      data_types: [finding]
      time_window: 24h
    - id: world_assessor
      data_types: [finding]
      time_window: 24h
    - id: energy_security
      data_types: [finding]
      time_window: 24h
    - id: escalation
      data_types: [finding]
      time_window: 24h
    - id: leadership_transition
      data_types: [finding]
      time_window: 24h
    - id: economic_coercion
      data_types: [finding]
      time_window: 24h
    - id: internal_stability
      data_types: [finding]
      time_window: 24h
    - id: military_posture
      data_types: [finding]
      time_window: 24h
    - id: narrative_coordination
      data_types: [finding]
      time_window: 24h
    - id: proliferation_watch
      data_types: [finding]
      time_window: 24h
  substrate:
    direct_queries: false        # reads via the kind's READ_SLICE, not ad-hoc SQL

mapping:
  fields: []
  schema_drift_policy: warn_and_continue

method:
  # method.kind is a constrained Literal (see meta_synthesizer note). Dispatch
  # is on identity.kind (cross_analyst_correlator); llm_planner matches the
  # single-turn chat_complete shape the kind uses.
  kind: llm_planner
  prompt_module: "legba.prompts.cross_analyst_correlator.v1"
  llm:
    primary:
      factory_kind: stack_ref
      raw: llm.primary.openai_compat
      expected_family: llm_provider
    # M16 (2026-07-06) — the MANDATORY faithfulness verify. Its PRESENCE is the
    # opt-in the actor's verify dispatch keys on (same discriminator the world /
    # per-country compositions use). Without it the correlator was the ONE active
    # LLM analyst that ESCAPED verify, so its confidence (<=0.95) was never clamped
    # to faithfulness. The correlator cites the other analyst_outputs it reasons
    # over via [[ref:N]] markers resolved into data['citations'] (ref_kind=finding),
    # so the generalized composition (sub-claim) verify grades each clause against
    # the cited output's text and folds effective_confidence = min(confidence,
    # faithfulness). Same switchable core-plane stack_ref as the compositions;
    # gated by LEGBA_VERIFY_LLM_JUDGE (soft-fails to the deterministic floor).
    verify:
      factory_kind: stack_ref
      raw: llm.primary.openai_compat
      expected_family: llm_provider
    max_tokens: 1024
  budget_tokens_per_day: 1000000
  retry:
    budget:
      strategy: pause_until_next_window

cadence:
  # Staggered OFF the synth (:30) to avoid co-fire — ":45" twice daily.
  fallback_schedule: "45 */12 * * *"
  cooldown_seconds: 39600        # 11h, below the 12h interval

outputs: []
