# lens_baserate — the base-rate-skeptic faculty (VOICES LV-1; build spec
# planning/VOICES_BUILD_DESIGN.md §4, plan planning/VOICES_PLAN_2026-07-21.md).
#
# One of FOUR function-typed faculty ids on the journal_assessor kind (DL-1/DL-3).
# The kind module maps this id → entry_kind='lens' in journal_entries — append-
# only, OFF the fact/finding/nexus chain, V1 faithfulness verify fires on every
# read (keyed on identity.kind, not id). It reads the VERIFIED tower top through
# ONE declared falsifiable prior and writes an interpretive read; it never asserts
# a new fact. NO publish edge.
#
# The declared prior LIVES in the persona module (legba.prompts.lens_baserate) —
# the descriptor content hash IS the prior version (DL-2).
#
# Cadence: WEEKLY, staggered AFTER lens_trend (§4.1). Model plane: $0 core.

identity:
  id: lens_baserate
  name: "Voices — Base-Rate-Skeptic Faculty"
  schema_uri: legba/analyst/1.0.0
  version: "0000000000000000"        # placeholder — registry stamps content hash
  kind: journal_assessor             # SAME kind module; OUTPUT_KIND = OutputKind.JOURNAL
  type_signature:
    input_type: legba.runtime.SignalList
    output_type: legba.runtime.Journal
    deps_type: legba.runtime.deps.StandardDeps
  state: active
  owner: voices_build

subscription:
  other_analysts: []
  substrate:
    direct_queries: false

mapping:
  fields: []
  schema_drift_policy: warn_and_continue

method:
  kind: llm_planner
  prompt_module: "legba.prompts.lens_baserate:LENS_SYSTEM"
  llm:
    # Model-card sampling (gpt-oss ships generation_config temperature=1.0; the vLLM
    # client always sends temperature, so the card default can never apply on its own).
    # Fleet-wide per the 2026-07-24 sampling audit + A/B (+0.055 faith at 1.0).
    temperature: 1.0
    primary:
      factory_kind: stack_ref
      raw: llm.primary.openai_compat
      expected_family: llm_provider
    verify:
      factory_kind: stack_ref
      raw: llm.primary.openai_compat
      expected_family: llm_provider
    narrate:
      factory_kind: stack_ref
      raw: llm.primary.openai_compat
      expected_family: llm_provider
    max_tokens: 12288
  budget_tokens_per_day: 600000
  gather:
    max_rounds: 6
  retry:
    budget:
      strategy: pause_until_next_window

cadence:
  fallback_schedule: "0 7 * * 1"      # weekly — Mondays 07:00 UTC (staggered, §4.1)
  cooldown_seconds: 518400            # 6d — below the 7d interval

grounding:
  enabled: false

action_packs:
  - pack_id: journal_read

outputs: []
