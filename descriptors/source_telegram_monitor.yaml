# S-2 — keyed SourceDescriptor: source.telegram.org_channels
# (kind: telegram_channel — the handler's registered kind string; the
# task-tracker shorthand "telegram" maps here).
#
# Telegram channel monitor via Telethon (MTProto user-API). Handler:
# src/legba/data/sources/telegram.py (TelegramChannelSourceHandler, config
# schema TelegramChannelSourceConfig). One Signal per channel message;
# media is described (type/mime/size) but NEVER downloaded by the handler.
#
# CHANNEL POLICY: the channels below are NEUTRAL EXAMPLES — official
# organization channels (UN agencies / WHO), chosen here by hand. They are
# NOT a curated monitoring list; never copy a third-party channel list
# into this file. Operators replace/extend the set per deployment and MUST
# verify each handle resolves to the organization's official channel
# before flipping this descriptor active (handles are claimable; an
# unverified handle ingests an impostor's content).
#
# RUNTIME IMAGE NOTE: telethon is NOT in the base runtime image
# (docker/Dockerfile.runtime drops it). Deploying this kind needs an image
# built with `pip install 'legba[telegram]'`; without it the handler's lazy
# import fails loud at configure time.
#
# KEYED — activation gating (S-2 convention):
#   * identity.state is DRAFT — bulk registration creates no live actor
#     (runtime/dapr_host.py skips draft/configured descriptors).
#   * THREE vault refs: api_id + api_hash (from https://my.telegram.org)
#     and a base64 Telethon session blob generated OUT-OF-BAND by running
#     telethon_auth.py against a real Telegram account. The handler
#     resolves all three in on_configure via SourceContext.secrets_resolve
#     → CredentialVault.resolve (src/legba/data/registry/credentials.py),
#     which raises MissingSecretError when any is absent — configure/
#     activation fails loud before any network connection.
#
# OPERATOR FLIP (to go live):
#   1. Create API credentials at https://my.telegram.org, generate the
#      session blob with telethon_auth.py, then store all three:
#        POST {registry}/api/v1/registry/vault/secrets  for each of
#             source.telegram.api_id / source.telegram.api_hash /
#             source.telegram.session
#      (or set TELEGRAM_API_ID / TELEGRAM_API_HASH / TELEGRAM_SESSION_B64
#       in .env and run scripts/bringup_vault_load.py).
#   2. Deploy a runtime image with the legba[telegram] extra installed.
#   3. Verify/replace config.channels below.
#   4. Register/refresh this descriptor, then transition:
#        POST {registry}/api/v1/registry/descriptors/source/source.telegram.org_channels/transition
#             {"to_state": "configured"}   then   {"to_state": "active"}
#
# 2026-07-29 — supply-chain domain source research
# (planning/SUPPLY_CHAIN_SOURCES_2026-07-29.md §3, §5 rank #7): added
# TankerTrackers.com (independent OSINT dark-fleet/sanctioned-tanker tracker)
# to the INDEPENDENT category below, riding this SAME session/client — no new
# vault secrets, no new Telegram account, no new rate-limit surface (the
# G-1 gap slot's explicit constraint,
# planning/SUPPLY_CHAIN_PACK_PLAN_2026-07-29.md §5.2: "must ride the existing
# telethon flood-control posture ... no new client, no new rate-limit
# surface"). Stays under this descriptor's blanket source_class: reporting —
# the SAME treatment this file already gives Bellingcat (also independent
# investigative/OSINT) under the "INDEPENDENT" comment category, not a schema
# field.
#
# 2026-07-29 — OPERATOR DECISION (reverses the earlier plan): @Almasirah_En +
# @ansarollah1 (Ansar Allah / Houthi authority media — see the STATE MEDIA
# (PER-CHANNEL OVERRIDE) category in config.channels below) ride THIS
# descriptor/account too, instead of the separate
# source_telegram_ansarallah.yaml descriptor + new Telegram account originally
# planned. A second concurrent TelegramClient on this SAME session is exactly
# Telegram's AUTH_KEY_DUPLICATED session-kill trigger (see telegram.py:124-130
# below the imports); a second account/session was also rejected. But
# source_class is otherwise a WHOLE-DESCRIPTOR field
# (SourceScope.source_class = `reporting` for this whole batch, see scope:
# below) — Almasirah/Ansar Allah need an honest `state_media` (framing-not-
# fact doctrine, the IRNA/PressTV precedent this file already documents for
# Irna_en above), which the batch default can't carry alongside Bloomberg/
# Guardian/Bellingcat. RESOLUTION: `config.classes` — a NEW optional
# per-channel source_class override map (TelegramChannelSourceConfig.classes,
# src/legba/data/sources/telegram.py) read at the S-1 signal_salience
# authority-stamping path (legba.data.analysts.signal_salience.
# _channel_class_override), which prefers the per-channel override over this
# descriptor's scope.source_class default, keyed by each signal's own
# payload.channel.username. source_telegram_ansarallah.yaml is DELETED (its
# separate-descriptor approach is retired) — its live DRAFT source_descriptors
# row (source.telegram.ansarallah_channels, never activated / no vault
# secrets ever loaded) is retired via the registry FSM by the operating
# session, NOT by this file edit (no PUTs from a worktree agent).
#
# KNOWN LIMITATION (not fixed by this change — flagged, not silently ignored):
# `pipeline.enrichment` (below) is ALSO a whole-descriptor list — there is no
# per-channel pipeline-stage override analogous to `config.classes`.
# This descriptor's `fact_extractor` stage therefore still runs against
# Almasirah_En / ansarollah1 messages, even though the doctrine ported from
# source_telegram_ansarallah.yaml (below) says state media should be
# framing/signal evidence, NOT fact-mined into the substrate. Only
# source_class (-> S-1 authority) is per-channel today; a per-channel
# pipeline override is out of scope for this change and left for the
# operator as a follow-up if the fact_extractor output on these two channels
# proves to be a real problem in practice.
#
# REGISTRATION STEP (main session) — READ BEFORE APPLYING: a live read-only
# SELECT against the production DB on 2026-07-29 shows this descriptor's HEAD
# is ALREADY `state: active` (content hash
# a5512da66700eda4a47ca48b9373296fde99b6f0ee37c3ac89b0f00c902b38fd at time of
# check), even though identity.state below still reads `draft` — a pre-
# existing drift between this repo file and the live instance (someone
# activated it via the registry API without the repo catching up), NOT
# something this edit caused or corrects. Practical consequence: applying
# THIS channel-list change is a LIVE CONFIG UPDATE to an already-running
# Telethon actor, not an inert draft bring-up like every other file in this
# commit. It is safe from the AUTH_KEY_DUPLICATED angle (same actor/session
# reconciling a new body, not a second client) but it is NOT draft-safe —
# treat it with the same care as any other production descriptor update
# (verify the new channel resolves to the real TankerTrackers account before
# flipping this live; a plain content-hash update via the registry's normal
# PUT/update path is the correct mechanism, NOT a Wave-A-style draft-batch
# registrar, which would see the file's stale `draft` claim, diff it against
# the live `active` state, and refuse with "no legal FSM path active ->
# draft" — a safe but noisy failure. Recommend correcting identity.state to
# `active` in this file as a follow-up so the repo stops drifting from the
# live instance; out of scope for this supply-chain source-research change.)

identity:
  id: source.telegram.org_channels
  name: Telegram — Curated OSINT Channels (state / media / independent / IGO)
  kind: telegram_channel
  schema_uri: legba/source/1.0.0
  version: "0000000000000000"        # placeholder — registry stamps content hash
  abstraction_level: L1
  state: draft                       # KEYED — operator flips after vault load
  owner: s2_keyed_sources
  created: "2026-06-09T00:00:00Z"

scope:
  owner_tenant: shared
  geo: []
  languages: [en]
  # 2026-07-29: added maritime/osint/supply_chain (additive only — widens
  # which source_selectors can auto-wire this shared batch; does not change
  # ingestion/processing for any existing channel) so a future supply-chain
  # lane target can discover TankerTrackers via tag match. Same additive
  # rationale for state_media/yemen/red_sea/houthi (Almasirah_En/ansarollah1,
  # per-channel-classed via config.classes below — the tag widens
  # discoverability, it does NOT itself change any channel's source_class).
  tags: [social, messaging, official, humanitarian, health, global, maritime, osint, supply_chain, state_media, yemen, red_sea, houthi]
  # S1-T8 — generic channel monitor; content depends on the operator-configured
  # channel set, so classed reporting (the conservative default) even though the
  # shipped EXAMPLE channels are official org channels.
  source_class: reporting

acquisition: poll

cadence:
  # FOOTPRINT SOFTENING (anti-bot-flag): widened */15 → */30 and bumped
  # jitter 60 → 120. Telegram bot-detection flags a user-account session that
  # polls too aggressively; the flag lever is request FREQUENCY (and retry
  # storms), so halving the poll rate + wider jitter de-correlates the request
  # bursts and stays under the threshold. (The per-channel MESSAGE limit is NOT
  # a footprint lever — Telethon's iter_messages batches ≤100 msgs per
  # getHistory request, so 25 vs 50 msgs/channel is the same one API call; it
  # was left at 50 to preserve war-beat coverage — see below.)
  #
  # Coverage on the wider cadence: the per-channel message_id cursor bounds the
  # LOWER end (already-seen messages are never re-fetched), and lookback_hours
  # bounds only the FIRST cursor-less pull. It does NOT bound the upper end — a
  # channel posting more than per_channel_message_limit messages inside a single
  # 30-min window drops the oldest-in-gap (newest-first truncation). At limit 50
  # (~100/hr headroom) that is rare; eliminating it entirely (min_id+reverse
  # bounded catch-up) is a queued follow-up, not this footprint pass.
  schedule:
    factory_kind: cron
    raw: "*/30 * * * *"
  cooldown_seconds: 120
  jitter_seconds: 120

config:
  api_id_secret:
    factory_kind: secret
    raw: "source.telegram.api_id"
  api_hash_secret:
    factory_kind: secret
    raw: "source.telegram.api_hash"
  session_secret:
    factory_kind: secret
    raw: "source.telegram.session"
  # Curated + verified 2026-06-15 (Telegram blue-check badge + each org's own
  # domain/social account confirmed the handle). GROUPED BY CATEGORY so the
  # state / media / independent / IGO split is explicit; every emitted Signal
  # also carries payload.channel.username, so the originating channel — and
  # thus its category below — is visible downstream. STATE-MESSAGING sources
  # (TASS / MFARussia / Irna) are PRIMARY-SOURCE / propaganda inputs, NOT
  # neutral fact — weight accordingly. '@' prefixes are stripped at resolve.
  channels:
    factory_kind: list
    item_kind: text
    raw:
      # --- STATE: government institutions + state-funded media ---
      - "tassagency_en"            # TASS — Russian state news agency
      - "MFARussia"                # Russian Ministry of Foreign Affairs
      - "V_Zelenskiy_official"     # President of Ukraine (Zelenskyy)
      - "IsraelMFA"                # Israel Ministry of Foreign Affairs
      - "minrexcuba"               # Cuba Ministry of Foreign Affairs
      - "shmirziyoyev"             # President of Uzbekistan
      - "France24_en"             # France 24 — French state-funded broadcaster
      - "trtworld"                 # TRT World — Turkish state broadcaster
      - "Irna_en"                  # IRNA — Iranian state news agency
      # --- MEDIA: independent commercial / mainstream ---
      - "bloomberg"                # Bloomberg
      - "guardian"                 # The Guardian
      - "hindustantimes"           # Hindustan Times
      - "KyivIndependent_official" # The Kyiv Independent
      - "TheTimesOfIsrael2022"     # The Times of Israel
      # --- IGO: intergovernmental organisations ---
      - "europeancommission"       # European Commission (EU)
      - "NATOpoRusski"             # NATO — Russian-language service
      - "UNIFIL_Lebanon"           # UNIFIL — UN peacekeeping (Lebanon)
      - "ohchr_roca"               # OHCHR — UN Human Rights (Central Asia)
      # --- INDEPENDENT: investigative / OSINT ---
      - "bellingcat_en"            # Bellingcat
      - "meduzalive"               # Meduza (Russian independent, exiled)
      - "istories_media"           # iStories — Important Stories (investigative)
      - "mediazzzona"              # Mediazona (Russian independent)
      - "dvbtvnews"                # DVB — Democratic Voice of Burma
      - "malaysiakini"             # Malaysiakini
      - "rferl"                    # Radio Free Europe / Radio Liberty
      - "TankerTrackers"           # TankerTrackers.com — independent OSINT dark-fleet/sanctioned-tanker tracking (satellite+AIS); added 2026-07-29, supply-chain domain sweep
      # --- STATE MEDIA (PER-CHANNEL OVERRIDE — see config.classes
      #     below): Ansar Allah (Houthi) authority voices, added 2026-07-29
      #     (planning/SUPPLY_CHAIN_SOURCES_2026-07-29.md §3, §5 rank #1/#9).
      #     CRITICAL — these are Yemen's de facto Houthi authority's OWN
      #     media: the exact same primary-source / official-position framing
      #     role IRNA (Iran, Irna_en above) / Press TV (Iran) / Ukrinform
      #     (Ukraine) play for their respective authorities (source_class
      #     taxonomy, docs/DATA_SOURCES.md §2.4: "State-controlled outlets —
      #     read as framing, not fact"). Classed `state_media` via
      #     config.classes (NOT this descriptor's blanket
      #     scope.source_class: reporting above) — read exactly the way
      #     source_irna_english.yaml is read, never as neutral fact. Both
      #     verified ACTIVE 2026-07-29 (same-day posts) via the public
      #     https://t.me/s/<handle> preview.
      - "Almasirah_En"             # Almasirah English — Houthi/Ansar Allah state media, English arm
      - "ansarollah1"              # official Ansar Allah site channel (Arabic)
  # 2026-07-29 Ansar Allah decision — OPTIONAL per-channel source_class
  # override (TelegramChannelSourceConfig.classes). This descriptor's
  # scope.source_class above (`reporting`) is the BATCH default for every
  # channel except the ones listed here; an override channel MUST also be
  # listed in `channels` above (config validation fails loud otherwise — see
  # TelegramChannelSourceConfig._classes_keys_must_reference_a_configured_
  # channel). Values are choice-locked to the S1-T8 source_class vocabulary
  # (legba.data.schemas.source.SourceClass) — an off-vocabulary value fails
  # loud at registration/activation, never silently at signal-write time.
  classes:
    factory_kind: dict
    key_kind: text
    value_kind: text
    raw:
      Almasirah_En: state_media
      ansarollah1: state_media
  lookback_hours:
    factory_kind: number
    # 12h stays FAR wider than the 30-min cadence gap, so no messages are
    # missed on the cursor-less first pull; steady-state pulls are bounded by
    # the per-channel message_id cursor, not this lookback.
    raw: 12
  # Bare boolean (no factory wrapper — the unwrap path passes scalars
  # through untouched): media described, never downloaded, stays off.
  include_media: false
  per_channel_message_limit:
    factory_kind: number
    # Kept at 50 (NOT lowered): the message limit is a runaway-pull safety belt,
    # not a footprint lever — Telethon fetches ≤100 msgs per getHistory request,
    # so 25 vs 50 is the same single API call. Lowering it bought ~zero anti-flag
    # benefit but would drop war-beat coverage on busy channels during active
    # events. The footprint wins live in cadence/jitter/non-retryable-auth above.
    raw: 50

pipeline:
  ingestion_filters:
    - kind: dedupe_tier_1            # channel+message_id canonical
      config: {}
    - kind: dedupe_tier_2            # SHA-256 content hash
      config: {}
  enrichment:
    - kind: language_detect
      config: {}
    - kind: ner_multilingual
      config: {}
    - kind: fact_extractor          # Piece 2 — (subject,predicate,value) facts from NER entities at ingest
      config:
        backend: relation           # reuse NER entities + /extract fallback (no 8B endpoint needed)
        emit_graph_edges: false     # facts-first; AGE nexus edges off for now
        max_facts_per_signal: 30
    - kind: geocode
      config:
        # D5: telegram messages carry their content in payload.text and the
        # in-body place is surfaced by the upstream ner_multilingual filter
        # (payload.entities) — both are in the geocode ladder's default
        # infer_from, so the message's actual subject geo is resolved from the
        # body. The publisher-origin (TLD) fallback is OFF here: the canonical
        # URL host is `t.me`, whose `.me` ccTLD is Montenegro — the source of
        # the spurious {ME} tag on every channel message. With it off, a
        # message with no resolvable in-body place stays geo-unattributed
        # (correct) rather than mis-tagged Montenegro.
        tld_fallback: false
  media: reference

deps:
  vault_secrets:
    - source.telegram.api_id
    - source.telegram.api_hash
    - source.telegram.session

output:
  retention: interest
  max_age_seconds: 86400
  delivery: lossy

subscription_policy: open
