# S1-T8 — WATCH-desk state-media SourceDescriptor: source.irna.english (Iran).
#
# IRNA (Islamic Republic News Agency) — Iran's OFFICIAL state news agency,
# English edition. Added to give the Iran watch desk (country_watch_ir) a
# first-party state-media voice: read as FRAMING / official-position evidence
# (the narrative_coordination unit weighs source_class == state_media as framing,
# LOW-tier for facts), NOT as an independent factual source.
#
# source_class: state_media (state-controlled outlet). Deliberately NO
# fact_extractor stage in the enrichment chain — we ingest IRNA as SIGNAL /
# framing material for narrative analysis, and do NOT mine (subject,predicate,
# value) facts from a state outlet into the substrate.
#
# Real RSS: https://en.irna.ir/rss — probed live 2026-07-02, HTTP 200, valid
# RSS 2.0 (channel "IRNA English", 30 items, generator "Saba Enterprise
# Newsroom"). Keyless, shared, open — same contract as source.bbc.world.

identity:
  id: source.irna.english
  name: IRNA — Islamic Republic News Agency (English)
  kind: rss
  schema_uri: legba/source/1.0.0
  version: "0000000000000000"        # placeholder — registry stamps content hash
  abstraction_level: L1
  state: active
  owner: s1_t8_source_class
  created: "2026-07-02T00:00:00Z"

scope:
  owner_tenant: shared
  # Iran-focused state outlet; geo scopes the source so an IR watch desk wires
  # it and per-target Subscription.geo narrows the geocoded signal slice.
  geo: [IR]
  languages: [en]
  tags: [news, state_media, middle_east, iran]
  source_class: state_media

acquisition: poll

cadence:
  # Hourly, stable minute offset (state wires publish steadily; be courteous).
  schedule:
    factory_kind: cron
    raw: "11 * * * *"
  cooldown_seconds: 60
  jitter_seconds: 30

config:
  url:
    factory_kind: text
    raw: "https://en.irna.ir/rss"

pipeline:
  ingestion_filters:
    - kind: dedupe_tier_1            # URL-canonical hash
      config: {}
    - kind: dedupe_tier_2            # SHA-256 content hash
      config: {}
  enrichment:
    # language_detect FIRST so ner_multilingual can use the detected language.
    # No fact_extractor: state media is framing evidence, not a fact source.
    - kind: language_detect
      config: {}
    - kind: ner_multilingual
      config: {}
    - kind: geocode
      config: {}
  media: reference

deps: {}

output:
  retention: interest
  max_age_seconds: 86400
  delivery: lossy

subscription_policy: open
