# K-2 — DSPy + GEPA optimizer for india_energy_inline.
#
# kind: optimizer.  method.kind: dspy_compile (the L-176 literal added
# by Wave-B prereq #1; exempt from the prompt_module requirement).
#
# Reads analyst_traces ⋈ analyst_critiques on run_id over a 30-day
# window; emits PromptModuleCandidatePayload to analyst_outputs with
# kind='prompt_module_candidate'.  Promotion is human_gated by default
# (operator must hit POST /api/v1/v3/optimizer/candidates/{id}/review).
#
# Runs as a Temporal workflow under the legba-temporal-worker process
# (see RUNBOOK §13.5).  Per L-103 hybrid design, this is the ONE actor
# kind whose run() dispatches to Temporal — every other kind stays on
# the Dapr actor surface.
#
# Threshold knobs (eval.optimizer):
#   * min_traces_required — how many analyst_traces rows the optimizer
#     wants before kicking off a GEPA compile.  Default 50 per the
#     bootstrap call-out in DESIGN.md §9; lowered to 10 here so the
#     first cycle fires against the current ~13 inline traces.
#   * min_critiques_required — same for analyst_critiques.  Default 25;
#     lowered to 1 here because we have 4 critic rows.
#
# Promotion gating is descriptor-set + operator-mutated.  The cadence
# is once-daily (operator pulse, no scheduled production traffic) —
# nightly compile fits the GEPA paper's multi-hour-run guidance.

identity:
  id: india_energy_inline_optimizer
  name: India Energy Inline Optimizer (DSPy + GEPA)
  schema_uri: legba/analyst/1.0.0
  version: "<content-hash stamped at register time>"
  kind: optimizer
  type_signature:
    input_type: legba.runtime.TraceCritiqueJoin
    output_type: legba.runtime.PromptModuleCandidate
  state: active
  owner: k2_optimizer_activation

subscription:
  # The optimizer's READ_SLICE walks analyst_traces ⋈ analyst_critiques
  # — it does NOT consume the signal substrate slice.  direct_queries
  # tells the dispatch path to pass options through to the kind handler.
  substrate:
    direct_queries: true

mapping:
  fields: []
  schema_drift_policy: warn_and_continue

method:
  # dspy_compile — Wave-B prereq #1 literal; exempt from prompt_module.
  kind: dspy_compile
  # budget_tokens_per_day — GEPA runs are multi-thousand-token in the
  # search loop (sampling candidates + judging variants).  Cap so a
  # runaway compile doesn't drain the global envelope; the per-day
  # bucket resets at UTC midnight.
  budget_tokens_per_day: 200000
  # The optimizer reads the analyzed analyst's parent prompt module via
  # eval.optimizer.parent_prompt_module_path (resolved at run-time).

cadence:
  # Daily — once per UTC day, around 03:00 (off-peak for the inline
  # analyst's 5-min cadence).
  fallback_schedule: "0 3 * * *"
  cooldown_seconds: 21600  # 6h floor — one compile per day max

outputs:
  - kind: nats_stream
    config:
      channel: prompt_module_candidates

eval:
  optimizer:
    # Pin to the inline analyst — that's where we have the trace+critique
    # join-window.
    analyzed_analyst_id: india_energy_inline
    parent_prompt_module_path: legba.prompts.inline_target.v1
    # Bootstrap thresholds — lowered from production defaults so the
    # first cycle fires against the small validation corpus.  Raise back
    # to 50/25 once we have a steady-state stream of traces+critiques.
    min_traces_required: 10
    min_critiques_required: 1
    promotion_policy: human_gated
