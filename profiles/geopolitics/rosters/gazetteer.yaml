#
# THE GAZETTEER of the geopolitics exemplar — the tables of names
# and codes the platform's guards, matchers and canonicalisers used to carry as
# code literals in five modules (absence_slice, world_knowledge_guards +
# writes_supersession, _polity_match + _geo_routing, _entity_canon, grounding).
# Declared by the manifest's `rosters.gazetteer` key; read through ONE loader,
# src/legba/data/gazetteer.py (closed: an unknown section is refused). The
# images carry src/ only, so the packaged copy src/legba/data/profile_gazetteer.json
# is what the runtime reads (scripts/gen_profile_gazetteer.py writes it; a
# drift test refuses a stale one).
#
# BYTE-IDENTITY. Every table below reproduces the literal it replaced at the
# pin fcbafb2e — same entries, same ORDER where order matters (the officeholder
# groups feed a regex alternation; the alias groups' first spelling is the
# probe key) — pinned per table by sha256 in tests/data_pkg/test_gazetteer.py.
#
# A SECTION LEFT OUT IS ABSENT, BY NAME. A guard whose section a profile does
# not declare answers a typed `not_applicable` (counted, logged once per
# process, bumped on the verify report's receipts counters) — never an empty
# table that silently passes. docs/PROFILES.md "The gazetteer"; SEAMS #67.

schema: legba/gazetteer/1

# ---------------------------------------------------------------------------
# Desk ids — the id convention that carries a subject's code
# ---------------------------------------------------------------------------
# A target id containing `marker` names a per-subject desk whose trailing
# `_<token>` is its ISO-2 code (country_g20_us -> us). The absence-slice and
# cross-target guards, the off-target guard and the grounding fast path read
# the code from the id through this convention; a profile that declares none
# has no id-coded desks, and those paths read the target's declared scope or
# answer not_applicable.
desk_ids:
  marker: country

