# I-5 series-kind capabilities (2026-11-14) — the World Bank's consumer-price
# inflation for the world aggregate (World Development Indicators,
# FP.CPI.TOTL.ZG, annual %), as a SERIES. Ships DRAFT; the reference host
# walks it to CONFIGURED (descriptors/LIFECYCLE.md), never active —
# activation is the owner's call. Kind: series_api.
#
# WHY: a country-baseline indicator family (the review's row 4, "add"). The
# review names ONE indicator (the one its check URL asked for), so this file
# is that one, written as the TEMPLATE for the rest: another indicator or
# country is a new output (or a new file) with its own check — which
# indicators to hold is the owner's choice (e.g. NY.GDP.MKTP.KD.ZG GDP growth,
# SP.POP.TOTL population, per country rather than WLD).
#
# THE ENDPOINT. World Bank Indicators API v2,
# /v2/country/WLD/indicator/FP.CPI.TOTL.ZG?format=json. Checked 2026-11-14 by
# the source-expansion review (generic client identity; the first try 502,
# the retry 200, application/json, 541 bytes for per_page=2): the body is a
# TOP-LEVEL ARRAY of two — [page metadata, rows] — which is why X-1 could not
# write it; I-5's `rows_path: "1"` reads the second element. Row fields as
# the API documents them (the review recorded the shape and size, not the
# field list; 541 bytes is two such rows plus the metadata object): `date`
# (the year, "2025"), `value` (number or null — null is absent, never zero),
# `countryiso3code` ("WLD"), `indicator.id`, `obs_status`, `decimal`. If the
# first poll finds other names it writes nothing and its health detail counts
# the skipped rows. per_page=100 holds the whole history of one indicator for
# one country (about 66 years) in one page; the handler keeps the rows whose
# YEAR ends inside the window (I-5: a period is re-read while its end is in the
# window), so the 1 + 400-day re-read covers the newest year and its revisions.
#
# SUBJECT. The world aggregate, subject `global` (subject_kind global), the
# row filtered on countryiso3code WLD. UNIT: percent (annual % change of the
# consumer price index). Released annually (the WDI updates a few times a
# year), so a weekly poll is ample. Under series_change this annual series has
# too few points for the count band (it is always `insufficient`, never cited);
# no rule is proposed for it.
#
# robots.txt: none (404).
# Class: official (an international financial institution's statistics).

identity:
  id: source.worldbank.wdi_cpi_inflation_world
  name: World Bank — consumer price inflation, world, annual % (WDI FP.CPI.TOTL.ZG, series)
  kind: series_api
  schema_uri: legba/source/1.0.0
  version: "0000000000000000"        # placeholder — registry stamps content hash
  abstraction_level: L1
  state: draft
  owner: i5_series_kind_capabilities
  created: "2026-11-14T00:00:00Z"

scope:
  owner_tenant: shared
  geo: []
  languages: [en]
  tags: [inflation, prices, macro, development_indicators, series, global]
  source_class: official
  license_class: cc_by                 # World Bank datasets: CC BY 4.0 by default
  attribution: "Source: World Bank, World Development Indicators (FP.CPI.TOTL.ZG), CC BY 4.0"
  access_class: public

acquisition: poll

cadence:
  schedule:
    factory_kind: cron
    raw: "41 6 * * 1"             # weekly, Monday
  cooldown_seconds: 3600
  jitter_seconds: 300

config:
  url:
    factory_kind: text
    raw: "https://api.worldbank.org/v2/country/WLD/indicator/FP.CPI.TOTL.ZG"
  params:
    factory_kind: list
    raw:
      - ["format", "json"]
      - ["per_page", "100"]
  format:
    factory_kind: text
    raw: json
  rows_path:
    factory_kind: text
    raw: "1"                      # [page metadata, rows] -> the rows
  date_field:
    factory_kind: text
    raw: date
  date_format:
    factory_kind: text
    raw: year
  provenance_fields:
    factory_kind: list
    raw: [obs_status, indicator.id]
  outputs:
    factory_kind: list
    raw:
      - series: worldbank.wdi.fp_cpi_totl_zg
        value_field: value
        subject: global
        where:
          - {field: countryiso3code, values: [WLD]}
        unit: percent
        period: year
        subject_kind: global
        methodology_version: worldbank-wdi-fp-cpi-totl-zg/1
  lag_days:
    factory_kind: number
    raw: 120
  revision_days:
    factory_kind: number
    raw: 400
  backfill_days:
    factory_kind: number
    raw: 4000                     # the first poll keeps about eleven years

sink:
  family: observation
  config:
    series:
      - id: worldbank.wdi.fp_cpi_totl_zg
        field: value
        unit: percent
        period: year
        subject_kind: global
        methodology_version: worldbank-wdi-fp-cpi-totl-zg/1
        description: "Inflation, consumer prices (annual %), world aggregate (WLD), World Development Indicators"

pipeline:
  ingestion_filters: []
  enrichment: []
  media: reference

deps: {}

subscription_policy: open
