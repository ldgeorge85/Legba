# signal_summarizer — async distillation of long signal bodies.
#
# A `deterministic`-kind META analyst over the SHARED raw signal pool. Every time
# it fires it distills the next throttled batch of un-summarized text signals:
# it writes OUR analysis-tuned summary into `signals.payload.distilled_body` so
# downstream synthesis reads a compact, faithful, quote-preserving brief instead
# of the publisher's teaser/lede. The handler is fully built at
# legba.data.analysts.deterministic_handlers.signal_summarizer.
#
# Target-agnostic + META: summarization is an observation-level property of the
# shared pool, not a per-target interpretation. The subscription declares NO
# `targets` selector, so the cadence heartbeat is a SINGLE global sweep per tick
# (not a per-target fan-out) — see dapr_actors.AnalystActor._cadence_targets. The
# handler pulls un-summarized signals directly via deps.pg_pool (it ignores the
# materialized input slice / time window).
#
# Method:
#   * kind = deterministic — the deterministic kind dispatcher module:run_method.
#   * sub_handler = signal_summarizer — injected into the run options at fire
#     time. The sweep is idempotent + forward-progressing (stamps
#     signals.summarized_at on EVERY examined row), so re-runs are safe.
#   * method.llm.primary = the CORE self-hosted vLLM plane
#     (llm.primary.openai_compat / gpt-oss-120b — $0, NEVER Anthropic/Opus). The
#     deps-builder resolves this into deps.extras["signal_summarizer_llm"] and
#     HARD-REFUSES an Anthropic component, so the summarizer can never bill Opus.
#     Bodies > 500 chars get an LLM summary; shorter rows are stamped-and-skipped
#     with no LLM call. Per-run summary cap + a sequential (no fan-out) loop keep
#     the shared CORE gateway (also used by the embed path) unbursted.
#
# The per-run summary FindingPayload (summarized / skipped_short / failures) is
# the cadence receipt — exactly how entity_resolution / fact_decay keep a summary
# while side-writing directly. signal_summarizer is marked TRACE_ONLY in
# deterministic.py (its real product is the distilled_body side-write), so the
# receipt lands in the trace, not in analyst_outputs.
#
# Registered via scripts/bringup_register_signal_summarizer.py or the registry
# REST API.

identity:
  id: signal_summarizer
  name: Signal Summarizer
  schema_uri: legba/analyst/1.0.0
  version: "0000000000000000"        # registry stamps the content hash
  kind: deterministic
  type_signature:
    input_type: legba.runtime.SignalList
    output_type: legba.runtime.Finding
    deps_type: legba.runtime.deps.StandardDeps
  state: active
  owner: signal_summarizer

subscription:
  # No `targets` block → META analyst: one global sweep per cadence tick over the
  # whole shared signal pool, directly via deps.pg_pool.
  other_analysts: []
  substrate:
    direct_queries: true

mapping:
  fields: []
  schema_drift_policy: warn_and_continue

method:
  kind: deterministic
  impl: legba.data.analysts.deterministic:run_method
  sub_handler: signal_summarizer
  # CORE plane ONLY — the self-hosted vLLM component (gpt-oss-120b, $0). The
  # deps-builder resolves this into deps.extras["signal_summarizer_llm"] and
  # HARD-REFUSES an Anthropic/Opus primary (consult/deep are the only sanctioned
  # Anthropic users). max_tokens caps each per-call summary.
  llm:
    primary:
      factory_kind: stack_ref
      raw: llm.primary.openai_compat
      expected_family: llm_provider
    max_tokens: 512

cadence:
  # ── deterministic kind → token-budget-EXEMPT ──
  #
  # method.kind=deterministic carries no budget_tokens_per_day (the CORE plane is
  # self-hosted / $0 and usage is reported zeroed). META analyst: no
  # subscription.targets, so the cadence heartbeat is a SINGLE global sweep per
  # tick, NOT a fan-out. The only cost is the bounded per-tick LLM summary batch.
  #
  # fallback_schedule = "13-59/15 * * * *" — every 15 min (fires :13/:28/:43/:58),
  # OFFSET from the other maintenance crons so they never fire on the same tick:
  #   entity_resolution "*/10"        · situation_clustering "5-59/20"
  #   hypothesis_lifecycle "10-59/20" · integrity_sweep "41 */1"
  #   fact_contention_arbiter "37 */1"· fact_decay "23 */8"
  #   signal_summarizer (this) "13-59/15"
  # At ~40 summaries/tick the sweep drains the ~4.5k body-bearing backlog in ~1–2
  # days, then idles (short rows stamp cheaply; drained rows never re-scan).
  fallback_schedule: "13-59/15 * * * *"
  # Idempotent forward-progressing sweep — a short re-fire floor is plenty.
  cooldown_seconds: 600

# No extra output sinks: the deterministic kind's default OUTPUT_KIND writes a
# per-run summary finding (suppressed to the trace via the TRACE_ONLY map). The
# distilled summaries land directly in signals.payload.distilled_body.
outputs: []
