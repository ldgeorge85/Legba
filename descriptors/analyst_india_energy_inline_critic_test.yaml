# L-175 / done-plan K-1 — analyzed inline-target analyst with eval.rubric.
#
# Mirrors india_energy_inline (same target, same LLM, same cadence) but
# adds an eval.rubric so the L-175 critic kind can grade its findings.
# Distinct descriptor_id so registering this does NOT clobber the
# production india_energy_inline head row (whose eval is null).
#
# Once Phase 9 cuts the production india_energy_inline over to carry
# its own rubric, this parallel descriptor can be retired.

identity:
  id: india_energy_inline_critic_test
  name: India Energy Inline (critic-gradable)
  schema_uri: legba/analyst/1.0.0
  version: "<content-hash stamped at register time>"
  kind: inline_target
  type_signature:
    input_type: legba.runtime.SignalList
    output_type: legba.runtime.Finding
    deps_type: legba.runtime.deps.StandardDeps
  state: active
  owner: critic_e2e_test

subscription:
  targets:
    predicate: 'target_id() == "india_energy_infra"'
    data_types: [signal]
    time_window: 24h

mapping:
  fields: []
  schema_drift_policy: warn_and_continue

method:
  kind: llm_single_turn
  prompt_module: "legba.runtime.analyst_method:_DEFAULT_SYSTEM"
  llm:
    primary:
      factory_kind: stack_ref
      raw: llm.primary.openai_compat
      expected_family: llm_provider
    max_tokens: 1024
  budget_tokens_per_day: 200000

cadence:
  fallback_schedule: "*/5 * * * *"
  cooldown_seconds: 300

outputs:
  # Retired 2026-06-01: this analyst was claiming the same skill_id as
  # india_energy_inline, which caused
  # `action_executor.a2a_skill.register_failed cannot reassign`.
  # The critic_test analyst is K-1 test scaffolding; the real
  # india_energy_inline owns the production
  # intelligence.india_energy_assessment skill route.
  - kind: nats_stream
    config:
      channel: critic_test_outputs

# L-105 §3 eval block — the critic kind reads rubric + allow_self_correlated
# from this descriptor at activation time per _resolve_critic_context.
eval:
  rubric: |
    {"dimensions": [
      {"name": "factuality",
       "weight": 0.4,
       "description": "Are named entities, dates, and quantitative claims verifiable against the cited evidence?"},
      {"name": "completeness",
       "weight": 0.3,
       "description": "Does the finding cover the rubric scope: causes, actors, time horizon, and downstream impacts?"},
      {"name": "severity_calibration",
       "weight": 0.3,
       "description": "Does the stated confidence match the strength of the evidence? Penalize both overconfidence and under-confidence."}
    ], "scale": "0.0-1.0"}
  # 2026-06-22: true — india_energy_critic now judges on the same core plane
  # as this analyst (operator: Anthropic reserved for consult/deep_consult).
  # TO REVERT: false here + india_energy_critic raw -> llm.anthropic.opus_4_7.
  allow_self_correlated: true
