# P-09 — Cross-Source Dedup analyst descriptor (PIVOT §4.3 / decision P-02).
#
# A first-class `deterministic`-kind analyst over the SHARED raw signal pool.
# It is target-agnostic: dedup is an observation-level property (same content
# via source A and B), not a per-target interpretation — so it declares NO
# `subscription.targets` block and runs as ONE global sweep per cadence tick.
# (Saying "target-agnostic" in a comment is not what makes it so; omitting the
# targets block is. See the note in `subscription` below.)
#
# Method:
#   * kind = deterministic — pure code, NO LLM, token usage always zero.
#   * impl = the deterministic kind dispatcher module:run_method. The
#     deterministic kind routes by `options.sub_handler`; the runtime supplies
#     `sub_handler: cross_source_dedup` at trigger time (per the deterministic
#     kind contract — analyst_deps_builder._build_deterministic: "sub-handler
#     selection happens at run time via options['sub_handler']").
#
# Behaviour (legba.data.analysts.deterministic_handlers.cross_source_dedup):
#   * Exact content_hash matches across distinct source_ids -> link aliases to
#     one deterministic canonical (earliest fetched_at). MANDATORY path.
#   * Semantic near-dup via Qdrant when deps.extras['qdrant'] is injected AND
#     signals carry embedding_ref. BEST-EFFORT — degrades to content_hash-only.
#   * NEVER destructive: writes signal_aliases links + sets
#     signals.canonical_signal_id; every raw row is preserved. A subscription's
#     `canonical_only` flag controls whether it receives aliases or canonicals.
#
# Cadence:
#   * fallback_schedule = "*/15 * * * *" — sweep the raw pool every 15 min.
#   * cooldown_seconds = 300 — 5-min floor between runs (the sweep is idempotent).
#
# Registered via scripts/bringup_register_cross_source_dedup.py or the registry
# REST API — NOT inline through a test fixture.

identity:
  id: cross_source_dedup
  name: Cross-Source Dedup
  schema_uri: legba/analyst/1.0.0
  version: "<content-hash stamped at register time>"
  kind: deterministic
  type_signature:
    input_type: legba.runtime.SignalList
    output_type: legba.runtime.Finding
    deps_type: legba.runtime.deps.StandardDeps
  state: active
  owner: p09_cross_source_dedup

subscription:
  # NO `targets` block → META analyst: ONE global sweep per cadence tick over the
  # whole shared raw signal pool, directly via deps.pg_pool. Same shape as
  # analyst_signal_embedder / analyst_entity_resolution, which sweep the same
  # pool for the same reason.
  #
  # This block USED to say `targets: {data_types: [signal], time_window: 24h}`
  # with no predicate — and the runtime reads "selector present, no predicate" as
  # "fan out to EVERY active target" (AnalystActor._cadence_targets). So the
  # comment above it said target-agnostic while the YAML underneath asked for 44
  # copies, each re-scanning the entire pool with an identical query: 43 of the
  # 44 were pure waste. It made this the largest analyst in the fleet — 5,496
  # runs and 61.9 of 73.6 analyst-hours per day, and the single dominant Postgres
  # load — for output that was structurally zero.
  #
  # `target_id` never narrowed anything: the handler reads it once, to suffix the
  # finding title. Dedup is an observation-level property (same content via
  # source A and B), not a per-target interpretation.
  #
  # KNOWN CONSEQUENCE: dropping `targets` also removes this analyst from the
  # REACTIVE plane (no per-target TriggerRegistration → no `coalesced_fire`), so
  # it now runs on the 15-minute cadence only. That is sufficient by measurement:
  # each run examines up to 500 content-hash groups and 500 semantic candidates,
  # i.e. ~48k of each per day against an ingest rate near 4k signals/day, and the
  # sweep is idempotent so nothing is lost by arriving a few minutes later.
  other_analysts: []
  substrate:
    direct_queries: true

mapping:
  fields: []
  schema_drift_policy: warn_and_continue

method:
  kind: deterministic
  impl: legba.data.analysts.deterministic:run_method
  # Deterministic kinds carry no LLM block and no per-day token budget — the
  # whole run is pure Python over the signals/signal_aliases substrate.

cadence:
  fallback_schedule: "*/15 * * * *"
  cooldown_seconds: 300

# No extra output sinks: the deterministic kind's default OUTPUT_KIND
# (FindingPayload -> findings table) is the substrate write. The dedup work
# itself lands directly in signal_aliases + signals.canonical_signal_id; the
# emitted finding is a run summary. A `nats_stream` sink could be added later
# so subscribers learn when canonical links change.
outputs: []
