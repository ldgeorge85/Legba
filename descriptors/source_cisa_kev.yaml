# K-1 cyber desk (2026-11-14) — draft SourceDescriptor. Ships DRAFT (operator activates).
#
# CISA Known Exploited Vulnerabilities (KEV) catalogue, read from the
# provider's own published JSON feed through the existing json_api kind.
#
# WHY NOT source.intelmq.cisa_kev (the parked adapter): that descriptor runs
# the IntelMQ HTTP collector bot one-shot in a subprocess, and the `intelmq`
# package is an opt-in extras group that docker/Dockerfile.runtime does not
# install (verified 2026-06-09; RETIRED.md lists it `parked`, never registered
# on the reference host). Activating it needs a different runtime image for a
# keyless GET of one JSON file. The json_api kind already does that GET.
#
# THE HONEST LANDING. The catalogue is a REGISTER: entries are added over time,
# each with a CVE id, vendor, product, date added, remediation due date and
# known ransomware use. A register sink family is a DECLARED SEAM, not built;
# this source lands the register as DOCUMENTS: one signal per newly added
# entry, titled "<CVE id> — <vulnerability name>", dated by `dateAdded`, with
# the description, vendor, product, dates, ransomware use and required action
# rendered into the body (`body_template`) and the whole record kept in
# `payload.item`. Deduplicated by CVE id: `id_path: cveID` is the entry
# identity the actor's look-back ledger judges once, and tier-2 content hash
# (CVE id + title + body) aliases a re-yield. What this does NOT capture: a
# later edit to an existing entry (ransomware use changing from Unknown to
# Known, a due date moving) once the entry's `dateAdded` has left the 72-hour
# look-back — that is exactly what a register sink would hold.
#
# Feed (read 2026-11-13, one GET, generic client identity): HTTP 200,
# application/json, 1.85 MB, `{title, catalogVersion, dateReleased, count,
# vulnerabilities: [...]}`, 1,781 entries, NEWEST FIRST, 15-43 entries added
# per month in 2026. Fields per entry: cveID, vendorProject, product,
# vulnerabilityName, dateAdded (YYYY-MM-DD), shortDescription, requiredAction,
# dueDate, knownRansomwareCampaignUse ("Known" / "Unknown"), forensicTriage,
# notes (URLs), cwes. No per-entry URL: `canonical_url` stays empty and the
# NVD / vendor links ride in payload.item.notes.
#
# First poll: `lookback_minutes` 30 days, so the first pull backfills about
# 30-45 entries (2026-10/11 rates), within the 180 s poll budget. Twice a day:
# CISA adds entries during the US working day; `dateAdded` is a DATE (read as
# 00:00 UTC), and the 72 h cursor look-back (W11-F151 default) keeps an entry
# added after a pull eligible on the next one.
#
# Geography: deliberately NO declared geo. The json_api handler stamps the
# declared scope.geo onto every signal that carries no ISO code, and the
# publisher's country (US) is not the subject of a vulnerability in a
# vendor's product (the UKMTO precedent).
#
# Attribution is recorded below and copied onto every row.
# robots.txt (cisa.gov, read 2026-11-13): `User-agent: *` with no rule that
# covers /sites/default/files/feeds/.
# Credibility: host cisa.gov seeded at 0.92 / gov / state-affiliated
# (scripts/bringup_register_source_batch_2026_09.py).
# Desk routing: scope.classifications `geopolitics.topic:cyber` is stamped on
# every signal (W10 TAX-2) — the cyber desk's tag arm (target_cyber.yaml).

identity:
  id: source.cisa.kev
  name: CISA — Known Exploited Vulnerabilities catalogue
  kind: json_api
  schema_uri: legba/source/1.0.0
  version: "0000000000000000"        # placeholder — registry stamps content hash
  abstraction_level: L1
  state: draft
  owner: cyber_desk_k1
  created: "2026-11-14T00:00:00Z"

scope:
  owner_tenant: shared
  geo: []
  languages: [en]
  tags: [cyber, vulnerability, kev, gov, structured, cyber_desk]
  classifications: ["geopolitics.topic:cyber"]
  source_class: official
  license_class: public_domain
  attribution: "Source: CISA Known Exploited Vulnerabilities Catalog (cisa.gov)"
  access_class: public          # free no-auth feed, no separate reuse agreement

acquisition: poll

cadence:
  schedule:
    factory_kind: cron
    raw: "23 2,14 * * *"
  cooldown_seconds: 600
  jitter_seconds: 120
  expect_quiet: true             # days with no new entry are normal

config:
  url_template:
    factory_kind: text
    raw: "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"
  items_path:
    factory_kind: text
    raw: "vulnerabilities"
  id_path:
    factory_kind: text
    raw: "cveID"
  title_path:
    factory_kind: text
    raw: "cveID"
  title_template:
    factory_kind: text
    raw: "{cveID} — {vulnerabilityName}"
  timestamp_path:
    factory_kind: text
    raw: "dateAdded"
  body_path:
    factory_kind: text
    raw: "shortDescription"
  body_template:
    factory_kind: text
    raw: "{shortDescription} Vendor: {vendorProject}. Product: {product}. Added to the CISA catalogue of known exploited vulnerabilities: {dateAdded}. Remediation due for U.S. federal agencies: {dueDate}. Known use in ransomware campaigns: {knownRansomwareCampaignUse}. Required action: {requiredAction}"
  language:
    factory_kind: text
    raw: "en"
  lookback_minutes:
    factory_kind: number
    raw: 43200                   # first poll reaches back 30 days
  max_items_per_pull:
    factory_kind: number
    raw: 200
  poll_budget_seconds:
    factory_kind: number
    raw: 180
  timeout_seconds:
    factory_kind: number
    raw: 60                      # a 1.85 MB document

pipeline:
  ingestion_filters:
    - kind: dedupe_tier_1
      config: {}
    - kind: dedupe_tier_2
      config: {}
  enrichment:
    - kind: language_detect
      config: {}
    - kind: ner_multilingual
      config: {}
  media: reference

deps: {}

output:
  retention: interest
  max_age_seconds: 604800
  delivery: lossy

subscription_policy: open
