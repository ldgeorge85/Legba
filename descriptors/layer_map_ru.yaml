apertures:
- layer: official
  declared: present
  reason: 'curated: source.kremlin.english is RU''s own government primary-source
    publisher, present in this corpus. But the layer is thin: no standalone
    RU state-wire (TASS-class) RSS/API source is registered anywhere in
    descriptors/source_*.yaml at this pin — TASS shows up only as one channel
    (tassagency_en) inside the shared source.telegram.org_channels descriptor,
    which is classed social_digest by kind/mechanism, not official. Present,
    not absent or unmeasured: one real primary-source feed exists, it is just
    narrower than "the state''s own voice" might suggest.'
- layer: domestic_press
  declared: absent
  reason: 'curated: no source in this corpus is a masthead headquartered in and
    operating inside Russia under independent editorial control. The one
    candidate, Meduza, is exile media (Riga) and is now classed foreign_press
    above. This tracks a real condition, not only a source-corpus gap: after
    Russia''s March 2022 "fake news" law and the mass "undesirable
    organization" / "foreign agent" designations that followed, outlets that
    stayed inside Russia and kept an independent editorial line (Novaya
    Gazeta suspended, TV Rain/Dozhd forced to relocate, Ekho Moskvy shut down)
    were suspended, closed, or driven into exile — genuinely domestic
    independent press in Russia is now a narrow, high-risk residual, not a
    layer this platform could realistically source and sustain today.
    Declared absent, not unmeasured, because this is a checkable state of the
    media environment, not a polling gap nobody has looked at yet.'
- layer: foreign_press
  declared: present
  reason: 'curated: abundant. Every generic international-press/wire feed with
    no country scope (BBC, Guardian, DW, Al Jazeera, Euronews, the trade/
    sector press, AP wire via rsshub) reads Russia from outside by default;
    RFE/RL (source.rferl.news — USAGM-funded, statutory editorial firewall,
    an explicit Russia/Ukraine/Central Asia beat) and Meduza (exile,
    reclassified above) add RU-focused foreign-based coverage specifically.'
- layer: social_digest
  declared: present
  reason: 'curated: source.telegram.org_channels carries real RU-adjacent
    channel-level coverage — tassagency_en (TASS) and MFARussia under STATE,
    meduzalive and rferl under INDEPENDENT (see the entry above). Regime-
    public gap: every one of those is an official-institution or professional-
    media channel — this platform has no digest of ordinary Russian public
    Telegram discourse (the grassroots RU-Telegram layer, as distinct from
    state/media/IGO accounts), so this aperture reads institutional voices,
    not the regime-public pulse. Present but narrow. source.discord.default is
    also social_digest by kind but is KEYED/unconfigured (no registered
    Discord app, no channel list) and contributes nothing RU-specific yet.'
- layer: public_data
  declared: present
  reason: 'curated: broad. ACLED and GDELT (reclassified above) both code RU/UA
    conflict events; OpenSanctions'' bulk + API catalogs carry Russian PEP/
    sanctions entities; EUvsDisinfo curates pro-Kremlin disinformation cases
    specifically; ISW''s analysis desk names an explicit RU/UA escalation
    unit; arms-control, UN, WHO, and WTO feeds apply globally, Russia
    included.'
- layer: physical
  declared: present
  reason: 'curated: source.usgs.earthquakes is a global, no-country-scope
    GeoJSON feed — it captures Russian seismic events (e.g. Kamchatka, one of
    the most seismically active regions on Earth) the same as anywhere else.
    No RU-specific gap.'
