# Piece 4 — the deep_consult analyst (actor→Dapr-Workflow bridge).
#
# kind: deep_consult. On-demand only. The kind's run_method SCHEDULES the
# deep_consult_workflow (plan→acquire→analyze→synthesize) DETACHED and returns
# a task id in <1s — the actor never blocks on the workflow result. The
# workflow's synthesize stage writes the finding (+ optional facts/hypotheses).
#
# method.llm.primary is the StackRef the workflow's plan/analyze stages resolve;
# budget_tokens_per_day caps the deep run. action_packs grants substrate_read so
# the acquire stage's substrate tools (search_signals/query_facts/inspect_entity
# /vector_search) are governed through the agency plane, same as consult.

identity:
  id: deep_consult
  name: Legba Deep Consult (staged workflow)
  schema_uri: legba/analyst/1.0.0
  version: "0000000000000000"        # placeholder — registry stamps content hash
  kind: deep_consult
  type_signature:
    input_type: legba.runtime.ConsultQuestion
    output_type: legba.runtime.Finding
  state: active
  owner: p4_deep_consult

subscription:
  substrate:
    direct_queries: true

mapping:
  fields: []
  schema_drift_policy: warn_and_continue

method:
  kind: react_loop
  prompt_module: legba.prompts.consult_on_demand.v1
  llm:
    # 2026-06-22: deep_consult runs on the Anthropic plane (operator: consult +
    # deep_consult are the ONLY Anthropic users). TO REVERT to the core plane:
    # set raw back to llm.primary.openai_compat.
    #
    # 2026-08-15: max_tokens is the OPERATIVE per-call output budget for the
    # workflow's analyze stage (the deps builder threads it into
    # max_analyze_tokens via resolve_output_budget; LEGBA_CONSULT_MAX_TOKENS
    # demoted to a loudly-logged emergency override). 32768 is enabled by the
    # Anthropic handler streaming every generation; well under the Opus
    # line's documented 128k per-request output ceiling (handler clamps +
    # logs past it).
    primary:
      factory_kind: stack_ref
      raw: llm.anthropic.opus_4_7
      expected_family: llm_provider
    max_tokens: 32768
  budget_tokens_per_day: 2000000

cadence:
  # On-demand only — no fallback_schedule. Operator/UI invoked; the daily token
  # budget caps runaway, so the per-actor cooldown floor is 0.
  cooldown_seconds: 0

# Agency grant — substrate_read (the acquire stage's tool calls are resolved +
# governed + ledgered through the agency plane, same as consult).
#
# R-3d — `web_access` is the GRANT leg only, mirroring consult. Same honest
# limit: dapr_workflow/deep_consult_workflow.py builds ONE AgencyToolBinding
# over substrate_read, so the grant is INERT until the acquire stage binds the
# web_access pack too.
action_packs:
  - pack_id: substrate_read
  - pack_id: web_access
