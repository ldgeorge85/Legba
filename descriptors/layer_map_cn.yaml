    curated channel list carries zero China-focused channels (it is Russia/Ukraine/Mideast/Yemen/OSINT-weighted)
    and source.discord.default is an unconfigured, still-draft generic webhook with no bound
    community. Channel-level social monitoring of China is not structurally impossible — there
    are China-watcher/diaspora/Hong Kong channels that could be added — it is simply not built
    today.'
- layer: public_data
  declared: present
  reason: 'curated: present — global structured/IGO feeds (OpenSanctions bulk+API, which carry
    PRC-designated entities; ReliefWeb; WHO disease outbreak news; WTO news — China is a WTO
    member; UN press/africa/middle_east/peace_security; ACLED; DFRLab; EUvsDisinfo; ISW; CISA
    KEV; Common Crawl; Firecrawl; the generic webhook) all wire to the CN desk with no single-country
    scope.'
- layer: physical
  declared: present
  reason: 'curated: present — source.usgs.earthquakes is a global, model-free GeoJSON feed
    (scope.geo intentionally empty, universal) that includes significant seismic events in
    China (Sichuan/Yunnan/Xinjiang are seismically active); structurally universal per the
    source''s own docstring.'
