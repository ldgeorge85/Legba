# Draft SourceDescriptor. Ships DRAFT;
# the reference host walks it to CONFIGURED (descriptors/LIFECYCLE.md), never
# active — activation is the operator's call per source.
#
# European Central Bank — press releases, decisions and speeches feed. The
# euro-area central bank's own publication: OFFICIAL. Fills the
# central-bank-news gap (only the Fed and the RBI before).
# Checked (one GET, generic client
# identity): HTTP 200, application/rss+xml, 15 items, newest 2026-11-13 07:20
# UTC, oldest 2026-10-29 — about one a day. Every two hours, so a rate
# decision lands the same afternoon.
#
# Language: en. Region: euro area — no declared geo (not a country code).
#
# robots.txt allows the feed path for `*`.
# Credibility: ecb.europa.eu 0.92 / gov.
#
# First poll: the default first-poll age cap (30 days).

identity:
  id: source.ecb.press
  name: European Central Bank — press
  kind: rss
  schema_uri: legba/source/1.0.0
  version: "0000000000000000"        # placeholder — registry stamps content hash
  abstraction_level: L1
  state: draft
  owner: owner@local
  created: "2026-11-14T00:00:00Z"

scope:
  owner_tenant: shared
  geo: []
  languages: [en]
  tags: [central_banks, monetary_policy, eu, gov, finance, economic]
  source_class: official
  license_class: open_gov_attribution   # free use, accurate reproduction, ECB cited
  attribution: "Source: European Central Bank (ecb.europa.eu)"
  access_class: public            # free no-auth feed, no separate reuse agreement

acquisition: poll

cadence:
  schedule:
    factory_kind: cron
    raw: "13 */2 * * *"
  cooldown_seconds: 60
  jitter_seconds: 60

config:
  url:
    factory_kind: text
    raw: "https://www.ecb.europa.eu/rss/press.html"

pipeline:
  ingestion_filters:
    - kind: dedupe_tier_1            # URL-canonical hash
      config: {}
    - kind: dedupe_tier_2            # SHA-256 content hash
      config: {}
  enrichment:
    - kind: language_detect
      config: {}
    - kind: ner_multilingual
      config: {}
    - kind: geocode
      config: {}
  media: reference

deps: {}

output:
  retention: interest
  max_age_seconds: 604800
  delivery: lossy

subscription_policy: open
