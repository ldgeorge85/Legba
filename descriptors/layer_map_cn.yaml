# CURATED — layer_map_cn (Program 6 L0 lane curate_cn, wave E).
# Started from scripts/gen_layer_map_draft.py --country CN (the generator's
# own derived output, every reason "derived:", every aperture unmeasured —
# see planning/LAYER_MAP_DRAFTS_2026-09-24/layer_map_cn.yaml for that
# baseline). Curated per docs/LAYERS.md and the wave-E curate_cn brief:
#
#   * Every entries[] reason is now either "curated: ..." (the layer/reading
#     was actively assessed for China and the reason rewritten to say why —
#     5 entries: source.cgtn.world, source.scmp.china,
#     source.rsshub.rfa.korea, source.telegram.org_channels,
#     source.discord.default) or the original "derived: ..." reason with
#     " — confirmed" appended (45 entries whose generic, country-agnostic
#     derivation — global public_data feeds, international wire/press with
#     no China-specific reading to apply — was reviewed and is correct
#     as-is for CN).
#   * All six apertures are DECLARED (present/absent/unmeasured), each with
#     a curated reason — official/domestic_press/foreign_press/public_data/
#     physical present, social_digest absent (from our sources, not
#     structurally — see the aperture reason).
#
# NOTE ON identity.state: the brief asked for `state: reviewed`, but
# `LayerMapIdentity.state` is typed `LifecycleState`
# (src/legba/data/schemas/lifecycle.py), a CLOSED enum of exactly
# draft/configured/active/paused/retired — "reviewed" is not a member and
# is REJECTED by validation (confirmed live against this model before
# writing this file). Used `state: active` instead, as the closest existing
# value for "this is the current, curated map, not the raw draft" — flagged
# for the reviewer; adding a `REVIEWED` member to `LifecycleState` (or a
# layer-map-specific state enum) is a follow-up if the literal word matters,
# not something this lane's brief authorizes touching.
#
# NO LIVE DB ACCESS. Validated via `scripts/load_layer_map.py --dry-run`
# only; the reviewer runs the real load with `--target country_g20_cn`.

