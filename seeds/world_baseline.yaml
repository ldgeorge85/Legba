#
# world_baseline.yaml — hand-curated authoritative world baseline (flavor b
# proof seed). A fresh Legba instance imports this so an analyst boots with a
# real starting knowledge base instead of a blank substrate.
#
# Mapped by src/legba/data/seed/adapters/world_baseline.py:
#   * leaders  -> facts   (subject=leader, predicate='LeaderOf', object=country)
#                 + a country-SUBJECT office fact (subject=country,
#                   predicate='head of state' by default, overridable per row
#                   via `office:`, value=leader) — the supersession-correct
#                   shape the grounding injection reads.
#   * alliances-> nexuses (subject=country, rel_type=MemberOf/AlliedWith,
#                          object=bloc/country, polarity=+1)
#   * conflicts-> nexuses (subject=country, rel_type=InActiveConflictWith,
#                          object=belligerent, polarity=-1) — the CURRENT
#                          active-conflict layer the world_assessor anchors on
#                          so a months-old event is not framed as current.
#
# All rows are source_type='seed', confidence ~0.95, with a real valid_from.
# Dates are inauguration / accession / conflict-start dates. Kept deliberately
# small but real; correct as of the curation date below. Re-import is idempotent.

meta:
  curated_at: "2026-06-19"
  note: >
    Current heads of state/government of the G20 (the office-holder a country
    analyst should assume by default) + the major bloc memberships + the active
    conflicts. A leader is modelled as the head of GOVERNMENT where that is the
    executive (PMs), else the head of STATE (presidents); a state with a
    non-executive head of state alongside an executive (Iran's Supreme Leader +
    President) carries a per-row `office:` so the two do not supersede each
    other. valid_from is the start of the current term / conflict.

