# THE JUDGE ON THE BOX — Gemma 4 behind the innoai gateway (kind: llm_provider).
#
# Cutover 2026-10-22: ai1 goes dark; every model Legba calls moves behind ONE
# OpenAI-compatible gateway (https://api.innoai.net/v1, planning/reviews/
# GATEWAY_2026-10-16.md). This component is the verify JUDGE's first rung, the
# consult judge (LEGBA_CONSULT_JUDGE_STACK_REF) and the claim_watch bearing gate
# (`bearing_gate_ref`), i.e. every job the idle in-house Llama-3.1-8B
# (`llm.verify.slm_8b`, slm.ai1) did. The models team measured Gemma 4 at 87.9
# on their calibration set (ledger 2026-10-08 21:1xZ) but it stalls on long
# queued inputs, so the chain's SECOND rung is Nemotron Lightning
# (`llm.judge.innoai_lightning_think.openai_compat`), which handles them.
# The interlock on OUR adjudicated rows (SEAMS #70) decides which leads.
#
# NAMING IS LOAD-BEARING: the id ends in `.openai_compat` so
# `infer_llm_subprovider` routes it to the vLLM handler (Chat Completions +
# Bearer, no max_tokens unless LEGBA_LLM_SEND_MAX_TOKENS or a per-call opt-in).
# FAMILY: `google_gemma`, declared where the grader fence reads it
# (`GRADER_FAMILY_BY_COMPONENT`, src/legba/runtime/external_grader_route.py);
# the schema is extra=forbid, so it cannot be declared here.
# The `gemma` alias is thinking OFF — a judge verdict is a short structured
# answer; `gemma-think` exists on the gateway and is NOT used here.
# PRICE: our own box behind the gateway — $0 per token (no list price); the
# burn gauge reports it ungauged, which is the honest posture for a $0 lane.
id: llm.verify.innoai_gemma.openai_compat
name: Gemma 4 via the innoai gateway (verify judge rung 1, consult judge, bearing gate)
schema_uri: legba/stack/llm_provider/1.0.0
version: "0000000000000000"
state: draft
owner: lewis@local
config:
  api_endpoint:
    factory_kind: text
    raw: https://api.innoai.net/v1
  # VAULT REF — the gateway token (INNOAI_API_TOKEN in the live .env) registered
  # once as this secret id by scripts/cutover_innoai.py; never the plaintext.
  api_key:
    factory_kind: secret
    raw: llm.innoai.api_key
  model_name:
    factory_kind: text
    raw: gemma
  # Sized like the judge's old rungs; NOT sent on the wire by the vLLM handler
  # unless opted in — it is the per-call ceiling the legs may ask for.
  max_tokens:
    factory_kind: number
    raw: 4096
  timeout_seconds:
    factory_kind: number
    raw: 120
  tier:
    factory_kind: dropdown_static
    raw: cheap
    options: [primary, fallback, cheap]
  # Client-side cap on in-flight calls from ONE process: the bearing gate alone
  # made ≈ 32k calls a week to the 8B; the box's queue is not ours to be.
  max_concurrent:
    factory_kind: number
    raw: 8
