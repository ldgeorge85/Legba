# K-1 cyber desk (2026-11-14) — draft SourceDescriptor. Ships DRAFT (operator activates).
#
# The Record — cybersecurity news from Recorded Future News, the newsroom
# owned by the threat-intelligence firm Recorded Future (itself owned by
# Mastercard since 2024): original reporting on state-linked intrusions,
# ransomware incidents, government cyber policy and law enforcement, with a
# record of first reports and named-official sourcing. Chosen as one of three
# trade outlets (see the lane report for the five-plus compared).
# Probed 2026-11-13 (one GET, generic client identity): HTTP 200, text/xml,
# 5 items (the feed is short — ~five hours of publishing), summaries ~190
# characters: a teaser feed. Hourly polling keeps up with a five-item window.
#
# OWNERSHIP NOTE for readers: the parent sells threat intelligence; its
# newsroom reporting on actors the parent tracks is first-hand but not
# disinterested. Read as reporting, not as official attribution.
#
# Geography: deliberately NO declared geo (the publisher is US-based; its
# stories are global). The in-body geocoder files a story that names a
# country, so it reaches that country's desk as well as the cyber desk.
#
# robots.txt returned 404 (no rules).
# Credibility: therecord.media 0.80 / wire. Hourly.
#
# Desk routing: scope.classifications `geopolitics.topic:cyber` is stamped on
# every signal (W10 TAX-2) — the cyber desk's tag arm (target_cyber.yaml).

identity:
  id: source.therecord.news
  name: The Record (Recorded Future News)
  kind: rss
  schema_uri: legba/source/1.0.0
  version: "0000000000000000"        # placeholder — registry stamps content hash
  abstraction_level: L1
  state: draft
  owner: cyber_desk_k1
  created: "2026-11-14T00:00:00Z"

scope:
  owner_tenant: shared
  geo: []
  languages: [en]
  tags: [cyber, news, trade, cyber_desk]
  classifications: ["geopolitics.topic:cyber"]
  source_class: reporting
  license_class: permissive_feed_unreviewed
  access_class: public          # free no-auth feed, no separate reuse agreement

acquisition: poll

cadence:
  schedule:
    factory_kind: cron
    raw: "7 * * * *"
  cooldown_seconds: 60
  jitter_seconds: 30

config:
  url:
    factory_kind: text
    raw: "https://therecord.media/feed"

pipeline:
  ingestion_filters:
    - kind: dedupe_tier_1            # URL-canonical hash
      config: {}
    - kind: dedupe_tier_2            # SHA-256 content hash
      config: {}
  enrichment:
    # language_detect FIRST so ner_multilingual uses the detected language.
    # No fact_extractor (the conservative default of the official-feed drafts).
    - kind: language_detect
      config: {}
    - kind: ner_multilingual
      config: {}
    - kind: geocode
      config: {}
  media: reference

deps: {}

output:
  retention: interest
  max_age_seconds: 604800
  delivery: lossy

subscription_policy: open
