# Alert Trigger Scan analyst descriptor (P1-3 — verification-gated alerting,
# trigger set v1).
#
# A first-class `deterministic`-kind META analyst that, on a ~10-minute
# cadence, scans VERIFIED substrate state for TRANSITIONS and side-writes one
# `kind='alert'` analyst_outputs row per fired trigger, fanning each outward
# through the shared P1-1 alert-sink dispatcher (ledger row per sink outcome +
# webhook when configured). Trigger classes:
#
#   1. band_crossing      — a desk×dimension scorecard band changed vs the
#                           previous scorecard row (deterioration=high,
#                           improvement / evidence transitions=medium).
#   2. verified_finding   — a NEW high-severity finding that met the verified
#                           bar (faithfulness verdict present AND
#                           effective_confidence >= 0.50; structural
#                           verify-exempt analysts excluded). high.
#   3. contention_flip    — a fact_contention group changed state / newly
#                           appeared, tied to a verified finding through its
#                           supporting facts. medium.
#   4. baseline_deviation — last-24h desk signal volume / high-sev finding
#                           count exceeded the trailing 28-day same-desk
#                           mean+2σ baseline (rising edge only). medium.
#   5. watchlist_hit      — an operator-defined standing watch (the watchlist
#                           table, mig 0105) matched a verified finding.
#   6. geo_convergence    — signals from >=3 distinct source families
#                           converged in one geographic bin (folded 07-29 from
#                           the standalone geo_convergence_scan analyst).
#   7. production_deficit — S-1: a producing loop (analyst cadence, analyst
#                           output, source signal production, declared backlog
#                           drain) has produced nothing against ITS OWN
#                           declared cadence + trailing history. The only
#                           class whose subject is this engine rather than the
#                           world. Judgment in
#                           legba.data.registry.production_gauge, shared with
#                           GET /api/v1/v3/system/production-gauge. Pages at
#                           medium+ only, once on appearance and again per
#                           escalation rung; recovery is silent. Thresholds
#                           are `gauge_*` method.options (see
#                           handler_options.HANDLER_OPTIONS) so precision is
#                           retunable with no deploy.
#   8. situation_escalation — a VERIFIED `escalates` row landed on the
#                           trajectory ledger for a frame at or above an
#                           intensity floor. First class whose subject is a
#                           FRAME. Fire-once on the ledger row id.
#   9. coverage_floor     — #82: a desk's OWN salience-scored 14-day slice
#                           keeps naming a foreign polity that NOT ONE of its
#                           open situation frames names. The class whose
#                           subject is the GAP between two of the engine's own
#                           artifacts — what the evidence carries vs what the
#                           register represents. Exists because
#                           IL_BLINDNESS_DIAGNOSIS.md proved a desk can be
#                           structurally silent about the war it is fighting
#                           when the register never opened a frame for it, and
#                           because migration 0188's mega-frame split retired
#                           that diagnosis's frame-COUNT predictor without
#                           retiring the blindness. Fires `low` (a
#                           register-quality signal, never a world event),
#                           once per newly-uncovered polity per desk, and is
#                           INTERVAL-GATED (default 6h) because the 14-day
#                           entity aggregate is ~20s and a coverage gap does
#                           not move on a 10-minute clock. Thresholds are
#                           `coverage_floor_*` method.options over
#                           LEGBA_COVERAGE_FLOOR_* env defaults.
#
# Statefulness: durable per-transition watermarks in alert_trigger_watermarks
# (migration 0091) — the same transition NEVER refires, and each class's
# first-ever scan seeds silently (no history paging). Anti-noise at this tier:
# per desk max `per_desk_cap` (3) alerts per scan, worst-first, remainder
# folded into ONE honest per-desk rollup; the dispatcher's per-sink cooldown +
# idempotency stay the downstream floor.
#
# Target-agnostic + META: the triggers read the WHOLE substrate (all desks'
# scorecards / findings / contentions) per scan. No `targets` selector → a
# SINGLE global run per cadence tick; the handler reads directly via
# deps.pg_pool and ignores the materialized input slice.
#
# Method:
#   * kind = deterministic — pure SQL, NO LLM, token usage always zero.
#   * impl = the deterministic kind dispatcher module:run_method, which routes
#     by `options.sub_handler`. Set explicitly AND id == sub-handler name so
#     either resolution path works.
#
# Cadence:
#   * fallback_schedule = "3-59/10 * * * *" — every 10 minutes at :03 offset
#     (clear of the :41 integrity sweep and the on-the-hour sweeps).
#   * cooldown_seconds = 480 — an 8-min floor below the 10-min tick, so an
#     organic tick is never swallowed by its own cooldown.
#
# State: draft in-tree — registration (scripts/bringup_register_
# alert_trigger_scan.py) and the operator's activate flip are DEPLOY steps.

identity:
  id: alert_trigger_scan
  name: Alert Trigger Scan
  schema_uri: legba/analyst/1.0.0
  version: "<content-hash stamped at register time>"
  kind: deterministic
  type_signature:
    input_type: legba.runtime.SignalList
    output_type: legba.runtime.Finding
    deps_type: legba.runtime.deps.StandardDeps
  state: draft
  owner: p1_3_triggers

subscription:
  # No `targets` block → META analyst: one global scan per cadence tick over
  # the whole substrate. The handler reads directly via deps.pg_pool.
  other_analysts: []
  substrate:
    direct_queries: true

mapping:
  fields: []
  schema_drift_policy: warn_and_continue

method:
  kind: deterministic
  options:
    # 2026-09-20 operator: the fleet-wide page budget deferred 616 of 1,319 alerts in 7 days (47 %) — the platform could not
    # tell anyone the external audit had died. 5/day -> 50/day, per-kind 3 -> 20. Declared knobs (handler_options).
    daily_page_budget: 50
    budget_per_kind_cap: 20
  impl: legba.data.analysts.deterministic:run_method
  sub_handler: alert_trigger_scan
  # Deterministic kinds carry no LLM block and no per-day token budget — the
  # whole run is pure SQL over the live substrate.

cadence:
  fallback_schedule: "3-59/10 * * * *"
  cooldown_seconds: 480

# No output bindings: the run summary is TRACE_ONLY (audited in
# analyst_traces); the REAL product — the kind='alert' rows — is side-written
# by the handler and fanned outward through the shared P1-1 dispatcher.
outputs: []
