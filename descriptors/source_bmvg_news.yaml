# Draft SourceDescriptor. Ships DRAFT (operator activates).
#
# German Federal Ministry of Defence (BMVg) — the ministry's one public RSS
# feed (all news and press items, German). It carries the "25-Millionen-Euro-
# Vorlagen" items: the Budget Committee's approvals of defence procurements,
# the decisions the loss funnel lost at S0 (SC08 g2, 04_LOSS_FUNNEL.md §4).
# Probed 2026-11-13 through the platform's guarded fetcher with the handler's
# default client identity: HTTP 200, application/rss+xml, 10 items spanning
# ~2 days, dated pubDates (+0100), no challenge.
identity:
  id: source.bmvg.news
  name: Bundesministerium der Verteidigung (BMVg) — Aktuelles
  kind: rss
  schema_uri: legba/source/1.0.0
  version: "0000000000000000"        # placeholder — registry stamps content hash
  abstraction_level: L1
  state: draft
  owner: owner@local
  created: "2026-11-13T00:00:00Z"

scope:
  owner_tenant: shared
  geo: [DE]
  languages: [de]
  tags: [gov, defense, procurement, germany, sources_2026_11_13]
  source_class: official
  access_class: public          # free no-auth feed, no separate reuse agreement

acquisition: poll

cadence:
  schedule:
    factory_kind: cron
    raw: "13 */2 * * *"
  cooldown_seconds: 60
  jitter_seconds: 30

config:
  url:
    factory_kind: text
    raw: "https://www.bmvg.de/service/rss/de/17680/feed"

pipeline:
  ingestion_filters:
    - kind: dedupe_tier_1            # URL-canonical hash
      config: {}
    - kind: dedupe_tier_2            # SHA-256 content hash
      config: {}
  enrichment:
    # language_detect FIRST so ner_multilingual uses the detected language.
    # No fact_extractor (the conservative default of the official-feed drafts).
    - kind: language_detect
      config: {}
    - kind: ner_multilingual
      config: {}
    - kind: geocode
      config: {}
  media: reference

deps: {}

output:
  retention: interest
  max_age_seconds: 604800
  delivery: lossy

subscription_policy: open
