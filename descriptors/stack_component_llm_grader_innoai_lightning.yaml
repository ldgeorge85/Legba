# THE THIRD-FAMILY GRADER ON THE BOX — Nemotron Lightning, thinking OFF
# (kind: llm_provider). It takes the slot the OpenRouter Mistral grader held
# (`llm.judge.openrouter_mistral_large.openai_compat`: correctness_grader,
# desk_reference, standing_auditor) and the Llama-3.3 audit rater — both dead
# since 2026-10-17 00:22Z with the OpenRouter credits (402 on every call).
# The grader fence needs a family distinct from the WRITER (the core, MiMo)
