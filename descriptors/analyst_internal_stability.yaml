# S1-T4 — bounded reasoning UNIT (inline_target): internal_stability.
#
# A "unit": NOT a new Python kind module and NOT a _KIND_MODULE_NAMES entry —
# just an inline_target DESCRIPTOR carrying its OWN method.system_prompt + scope
# predicate + eval.rubric (the validated T1 unit-factory pattern). The
# descriptor-supplied prompt drives synthesis; the deterministic cite-the-prose
# [N] floor (always-on for inline_target findings) + the faithfulness VERIFY gate
# already cover this unit's findings for free — no new code.
#
# TOPIC — internal stability: domestic unrest, state repression, security-force
# cohesion/loyalty, elite or regime fracture, and coup vulnerability. Assesses
# the country's INTERNAL political-stability trajectory through a classic
# coup-vulnerability lens, and is ABSENCE-HONEST: a quiet slice reads "stable /
# no signal", low confidence, severity:low — it never invents unrest.
#
# BROAD unit: runs on the blanket g20+watch predicate (every desk), so a FIXED
# scorecard dimension is safe. The banding keys the dimension on analyst_id, so
# this unit MUST be wired into scorecard_banding.DIMENSIONS +
# country_composition.other_analysts or it is INVISIBLE in the product.
#
# Cadence discipline: this unit fires 2×/day at the STAGGERED hours 02:00 / 14:00
# UTC — a FRESH slot between the existing unit fires (01/13, 04/16, 07/19, 10/22)
# so the units spread across the clock instead of stacking one budget bucket.

identity:
  id: internal_stability
  name: Internal-Stability / Coup-Risk Unit
  schema_uri: legba/analyst/1.0.0
  version: "0000000000000000"        # placeholder — registry stamps content hash
  kind: inline_target
  type_signature:
    input_type: legba.runtime.SignalList
    output_type: legba.runtime.Finding
    deps_type: legba.runtime.deps.StandardDeps
  state: active
  owner: s1_t4

subscription:
  targets:
    # Scope by the `g20`/`watch` tags — one run per country desk, mirroring the
    # other bounded units' fan-out. has_tag is valid on the subscription surface.
    predicate: 'has_tag("g20") or has_tag("watch")'
    data_types: [signal]
    # 72h: the unit integrates ~3 days of raw signals, not just today.
    time_window: 72h

mapping:
  fields: []
  schema_drift_policy: warn_and_continue

# Tier-1 knowledge-grounding, ported from the retired country_assessor monolith
# (2026-07-01). Injects the target's ACCUMULATED facts/nexuses + assessed
# situations + graph structure as a fenced "CURRENT CONTEXT" preamble so this
# unit integrates the multi-week substrate, not only the fresh signal slice.
# target_geo + slice-entity scoped; capped; analysis-derived context stays fenced
# off from ground truth (the grounding-quality provenance gate applies).
grounding:
  enabled: true
  scope: [target_geo, slice_entities]
  sources: [substrate, situations, graph_structure]
  max_facts: 30

method:
  kind: llm_planner
  # Inline, topic-scoped system prompt — the unit carries its bounded question
  # VERBATIM in the descriptor (no Python; no prompt_module set). Drives the
  # cited-prose JSON FindingPayload so the [N] markers + the verify gate work.
  system_prompt: |
    You are the INTERNAL-STABILITY unit, one bounded reasoning unit of the Legba
    intelligence oracle. You assess ONE question for ONE country target and
    nothing else.

    BOUNDED QUESTION — internal-stability / coup-risk trajectory.
    Read ONLY the target country's signals provided in context. Assess the
    country's near-term INTERNAL POLITICAL STABILITY through a coup-vulnerability
    lens, across these vectors:
      * mass protest, strikes, riots, or other popular unrest and its momentum;
      * state repression — crackdowns, mass arrests, internet/communications
        shutdowns, emergency powers, or lethal force against civilians;
      * security-force cohesion and LOYALTY — signs of splits, defections,
        mutiny, unpaid troops, or a wedge between the army and the government;
      * elite / regime fracture — resignations, purges, factional infighting,
        or a fracturing ruling coalition;
      * coup vulnerability — the classic structural indicators (a recent history
        of coups, economic crisis, a divided or aggrieved officer corps,
        contested succession) that raise the base rate of an irregular seizure.
    Identify the DOMINANT instability vector and state the MOST PLAUSIBLE
    near-term trajectory — stabilizing, steady, or destabilizing — and say which.
    ABSENCE-HONEST: if the cited signals contain little or nothing bearing on
    internal stability, say so PLAINLY, set a LOW confidence, and tag
    severity:low — do NOT manufacture unrest or a coup risk the evidence does not
    support.

    BOUNDARY — stay in your lane. This unit owns DOMESTIC regime/social stability
    and coup VULNERABILITY (the standing condition + early warning). Do NOT assess
    the specific probability, timing, or mechanism of a change in the TOP leader —
    that is the leadership_transition unit's bounded question. Do NOT assess
    inter-state escalation, external military conflict, energy, or narrative
    coordination — those belong to other units.

    PRODUCE EXACTLY ONE FINDING that answers ONLY this bounded question. Every
    key claim MUST cite the signal it rests on with a bracketed marker [N] keyed
    to that signal's index in the provided slice. Assert nothing the cited
    signals do not support; if the evidence is thin, LOWER your confidence rather
    than inventing specifics.

    Respond with STRICT JSON ONLY — no prose outside the JSON, no code fence —
    matching exactly this shape:
    {
      "title": "<concise headline naming the country + the dominant instability vector>",
      "body": "<github-markdown: a one-line '**BLUF:** <verdict>'; then a '## Key points' bullet list of the cited findings, each ending with its [N] citation(s); then a '## Assessment' paragraph naming the dominant instability vector and the most plausible near-term trajectory, reading the coup-vulnerability base rate against any acute triggers; then a '## Indicators to watch' bullet list of concrete near-term signals that would confirm destabilization or stabilization>",
      "confidence": <float 0.0-1.0 — calibrated confidence in the verdict given the cited evidence>,
      "evidence": [<the signal indices / source references you cited, as strings>],
      "tags": ["topic:internal_stability", "severity:<low|moderate|elevated|high|critical>"],
      "indicators": [
        {"id": "security-force-defection", "statement": "Confirmed defection, mutiny, or refusal-of-orders by a security-force unit", "status": "not_observed", "horizon_date": "2026-08-15", "first_seen": "2026-07-02", "citations": []},
        {"id": "nationwide-protest-wave", "statement": "Sustained multi-city protests reported for three or more consecutive days", "status": "triggered", "horizon_date": "2026-07-20", "first_seen": "2026-07-02", "citations": [3]},
        {"id": "state-of-emergency", "statement": "Declaration of a state of emergency or nationwide communications shutdown", "status": "not_observed", "horizon_date": "2026-07-30", "first_seen": "2026-07-02", "citations": []}
      ]
    }

    The "tags" array MUST contain the topic tag "topic:internal_stability" PLUS
    EXACTLY ONE severity tag drawn from {severity:low, severity:moderate,
    severity:elevated, severity:high, severity:critical}, chosen to match the
    assessed instability risk. The "indicators" array is the STRUCTURED,
    machine-checkable mirror of your '## Indicators to watch' prose. It is
    REQUIRED and MUST be NON-EMPTY: always output 3-6 entries in the EXACT SHAPE
    of the three example objects shown in the schema above (real desk-specific
    signposts — do NOT copy the example text, do NOT leave the array empty, do NOT
    omit the field). Set each "status" to "not_observed" (pre-registered, not yet
    seen), "triggered" (already firing in the slice), or "expired" (its
    horizon_date passed). A "triggered" indicator MUST name the signal(s) that
    fired it in "citations" as ASCII [N] signal indices; "not_observed" /
    "expired" carry an empty "citations". Keep each id a short stable slug so it
    can be tracked run-over-run. Output nothing but the single JSON object.
  llm:
    primary:
      factory_kind: stack_ref
      raw: llm.primary.openai_compat
      expected_family: llm_provider
    # P0: faithfulness VERIFY judge — currently the SAME core reasoning model
    # (llm.primary.openai_compat, gpt-oss-120B) that writes this unit, NOT a
    # cross-family judge (temporary: the 8B Llama-3.1-8B judge proved too weak —
    # harsh + mis-aimed — so the strong model runs the judging to prove the flow;
    # a dedicated reasoning judge is planned). KNOWN LIMITATION: same-model judging
    # shares blind spots, so this signal is weaker than an independent judge.
    # Gated by LEGBA_VERIFY_LLM_JUDGE; soft-fails to the deterministic
    # citation-presence floor if the component is unresolved.
    verify:
      factory_kind: stack_ref
      raw: llm.primary.openai_compat
      expected_family: llm_provider
    max_tokens: 4096
  # Per-day token cap for this unit's fan-out — sized for the staggered
  # twice-daily cadence (kept well under the country_assessor cap because each
  # unit answers a single bounded question, not the full situational sweep).
  budget_tokens_per_day: 300000
  # On a projected per-day cap crossing, PAUSE this unit until the next UTC
  # bucket rather than demoting to a paid fallback (the primary is the
  # self-hosted core plane; there is no cheap fallback wired here).
  retry:
    budget:
      strategy: pause_until_next_window

cadence:
  # Staggered 2×/day at 02:00 and 14:00 UTC — a FRESH slot between the existing
  # unit fires (01/13, 04/16, 07/19, 10/22) so the bounded units spread across
  # the clock instead of all firing on the same tick (flood discipline).
  fallback_schedule: "0 2,14 * * *"
  # Per-(unit, target) cooldown. 11h (39600s) sits BELOW the 12h interval between
  # the staggered fires — a cooldown == the interval lands past the next
  # scheduled fire and silently halves each country's cadence, so keep a margin.
  # Absorbs a re-trigger inside the window without a second LLM call.
  cooldown_seconds: 39600

# eval.rubric — the rubric the critic grades this unit's internal-stability
# findings against (REQUIRED for the critic→optimizer eval loop). Topic-scoped to
# the internal-stability question; dimensions weight to 1.0 on a 0.0-1.0 scale.
eval:
  rubric: |
    {"dimensions": [
      {"name": "vector_grounding",
       "weight": 0.4,
       "description": "Is the named dominant instability vector (protest/unrest, state repression, security-force cohesion/loyalty, elite or regime fracture, coup vulnerability) grounded in the cited signals, and are the actors and events concretely tied to their [N]? Penalize unsupported specifics and manufactured unrest, and penalize treating routine politics as instability."},
      {"name": "trajectory_plausibility",
       "weight": 0.3,
       "description": "Is the stated most-plausible near-term trajectory (stabilizing / steady / destabilizing) proportionate to and supported by the cited evidence, correctly reading the coup-vulnerability base rate against any acute triggers, with concrete indicators-to-watch that would actually confirm or refute it?"},
      {"name": "severity_calibration",
       "weight": 0.3,
       "description": "Do the stated confidence and the single severity tag match the strength of the cited evidence, and is the ABSENCE case handled honestly (a quiet slice reads stable / severity:low / low confidence, NOT invented risk)? Penalize both overconfidence on thin evidence and under-confidence on strong repression/coup evidence."}
    ], "scale": "0.0-1.0"}
