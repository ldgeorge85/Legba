# Draft SourceDescriptor. Ships DRAFT (operator activates).
#
# Federal Register — Bureau of Industry and Security (Commerce) documents:
# Entity List and EAR rules, denial orders, export-control notices. Covers
# the "Federal Register / BIS listings" gap.
# Federal Register agency feeds publish on business days (documents go out
# ~06:00 ET); the feed holds the last ~30 days, newest first, at most 20
# items, with the document abstract as the description (empty on some
# notices and corrections). US government work, public domain; the Federal
# Register API/RSS needs no key. Probed 2026-11-13 through the platform's
# guarded fetcher with the handler's default client identity: HTTP 200,
# application/rss+xml, no challenge.
#
# Distinct from the sanctions_export_control profile's json_api draft
# source.federalregister.bis (another instance's skeleton): this is the RSS
# form of the same agency query, registered on the geopolitics instance.
identity:
  id: source.federalregister.bis_feed
  name: Federal Register — BIS (Commerce) documents
  kind: rss
  schema_uri: legba/source/1.0.0
  version: "0000000000000000"        # placeholder — registry stamps content hash
  abstraction_level: L1
  state: draft
  owner: owner@local
  created: "2026-11-13T00:00:00Z"

scope:
  owner_tenant: shared
  geo: [US]
  languages: [en]
  tags: [gov, export_control, sanctions, trade, federal_register, sources_2026_11_13]
  source_class: official
  access_class: public          # free no-auth feed, no separate reuse agreement

acquisition: poll

cadence:
  schedule:
    factory_kind: cron
    raw: "41 1-23/6 * * *"
  cooldown_seconds: 60
  jitter_seconds: 30

config:
  url:
    factory_kind: text
    raw: "https://www.federalregister.gov/api/v1/documents.rss?conditions%5Bagencies%5D%5B%5D=industry-and-security-bureau"

pipeline:
  ingestion_filters:
    - kind: dedupe_tier_1            # URL-canonical hash
      config: {}
    - kind: dedupe_tier_2            # SHA-256 content hash
      config: {}
  enrichment:
    # language_detect FIRST so ner_multilingual uses the detected language.
    # No fact_extractor (the conservative default of the official-feed drafts).
    - kind: language_detect
      config: {}
    - kind: ner_multilingual
      config: {}
    - kind: geocode
      config: {}
  media: reference

deps: {}

output:
  retention: interest
  max_age_seconds: 604800
  delivery: lossy

subscription_policy: open
