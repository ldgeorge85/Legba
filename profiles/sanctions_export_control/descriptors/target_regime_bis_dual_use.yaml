#
# Sanctions / export-control profile SKELETON.
# One regime = one authority-and-programme pair. Ships DRAFT: registering it
# never schedules it. The predicate is a first cut for an instance to tune; no
# unit reads this subject yet (the five questions are in ../profile.yaml).

identity:
  id: regime_bis_dual_use
  name: "Regime — BIS EAR dual-use export controls"
  schema_uri: legba/target/2.0.0
  version: "0000000000000000"        # placeholder — registry stamps content hash
  abstraction_level: L1
  inherits: []
  state: draft
  owner: profile_sanctions_export_control
  created: "2026-10-04T00:00:00Z"

scope:
  domain: thematic
  themes: [export_control, dual_use]
  geo: []
  entity_classes: [country, organization, corporation, person, international_org]
  relationship_types: [SanctionsAgainst, SubsidiaryOf, PartOf, TradesWith]
  time_horizon_days: 90
  predicate: >-
    contains_any(["export administration regulations", "commerce control list", "dual-use", "export control", "export controls"])
  tags: [regime, sanctions, jurisdiction_us]

sources:
  - source_selector:
      tags: [sanctions]
      kinds: [rss, json_api, opensanctions]
      owner_tenant: shared
    subscription:
      canonical_only: true
  - source_id: source.wto.news            # reused from the exemplar tree (already live)
    subscription:
      canonical_only: true

allowed_action_packs: []

pipeline:
  ingestion_filters: []
  enrichment: []
  routing: []
