# Phase 5a spike analyst descriptor — india_energy_inline (inline_target kind).
#
# Documentation copy of the descriptor exercised by
# tests/runtime/test_spike_integration.py. The runtime's
# LLMAnalystRunner consumes this descriptor's method.llm.primary
# StackRef to pick the LLM handler.

identity:
  id: india_energy_inline
  name: India Energy Inline Analyst
  schema_uri: legba/analyst/1.0.0
  version: "<content-hash stamped at register time>"
  kind: inline_target
  type_signature:
    input_type: legba.runtime.SignalList
    output_type: legba.runtime.Finding
    deps_type: legba.runtime.deps.StandardDeps
  state: active
  owner: phase5a_spike

subscription:
  targets:
    predicate: 'target_id() == "india_energy_infra"'
    data_types: [signal]
    time_window: 24h

mapping:
  fields: []
  schema_drift_policy: warn_and_continue

method:
  kind: llm_single_turn
  # TODO(L-170, Phase 6): wrap this as a dspy.Module so the Predict step
  # carries a Signature + Eval rubric and the optimizer kind can tune it.
  prompt_module: "legba.runtime.analyst_method:_DEFAULT_SYSTEM"
  llm:
    primary:
      factory_kind: stack_ref
      raw: llm.primary.openai_compat
      expected_family: llm_provider
    max_tokens: 1024
  # S5 PILOT — this is the worked example of an AGENTIC inline_target assessor.
  # The GATHER tool-call phase engages because the read pack resolves EFFECTIVE:
  # the assessor grants `substrate_read` (action_packs below) AND its single
  # target (india_energy_infra) allows it (target.allowed_action_packs). No new
  # enable flag — engagement IS the three-way agency gate.
  gather:
    max_rounds: 1            # single round (default) — stays inside the budget.
  # Bumped from 200000 to leave headroom for the extra GATHER round's tokens
  # (the GATHER LLM rounds count against this SAME per-day cap — no new budget).
  budget_tokens_per_day: 300000

cadence:
  fallback_schedule: "*/10 * * * *"
  cooldown_seconds: 300

# S5 PILOT — grant the `substrate_read` read pack so the GATHER phase can query
# the substrate (signals/facts/nexuses/hypotheses/timeline/compare) mid-run.
# Effective capability is analyst.action_packs ∩ target.allowed_action_packs ∩
# pack.applicability — the india_energy_infra target allows it.
action_packs:
  - pack_id: substrate_read

outputs:
  - kind: a2a_skill
    config:
      skill_id: intelligence.india_energy_assessment
