# P3-6 Wave-A (A3) — draft SourceDescriptor. Ships DRAFT (operator activates).
#
# Kremlin.ru events (Atom) — the working Russian government PRIMARY source (RU MFA is bot-walled). source_class official (it is the government's own publisher, like State Dept/UN) but with a LOW credibility score: read for leadership statements + framing, not neutral facts. Verified live 2026-07-02.
#
# source_class: official. Credibility host kremlin.ru (seeded 0.35/gov, state_affiliation True by the registrar).
# state: draft — bulk registration creates NO live actor; activation
# (draft -> configured -> active) is the operator's after verifying the route live.

identity:
  id: source.kremlin.english
  name: President of Russia — Events (English)
  kind: rss
  schema_uri: legba/source/1.0.0
  version: "0000000000000000"        # placeholder — registry stamps content hash
  abstraction_level: L1
  state: draft
  owner: p3_6_wave_a
  created: "2026-07-27T00:00:00Z"

scope:
  owner_tenant: shared
  geo: [RU]
  languages: [en]
  tags: [gov, russia, leadership, wave_a]
  source_class: official

acquisition: poll

cadence:
  schedule:
    factory_kind: cron
    raw: "51 2-23/6 * * *"
  cooldown_seconds: 60
  jitter_seconds: 30

config:
  url:
    factory_kind: text
    raw: "http://en.kremlin.ru/events/all/feed"
  parser:
    factory_kind: text
    raw: "atom"

pipeline:
  ingestion_filters:
    - kind: dedupe_tier_1            # URL-canonical hash
      config: {}
    - kind: dedupe_tier_2            # SHA-256 content hash
      config: {}
  enrichment:
    # language_detect FIRST so ner_multilingual uses the detected language.
    # No fact_extractor on the draft: the operator adds it after confirming the
    # route yields full article text (mirrors the RSSHub-lane conservative default).
    - kind: language_detect
      config: {}
    - kind: ner_multilingual
      config: {}
    - kind: geocode
      config: {}
  media: reference

deps: {}

output:
  retention: interest
  max_age_seconds: 604800
  delivery: lossy

subscription_policy: open
