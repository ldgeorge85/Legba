# S1-T5 — bounded reasoning UNIT (inline_target): military_posture.
#
# A "unit": NOT a new Python kind module and NOT a _KIND_MODULE_NAMES entry —
# just an inline_target DESCRIPTOR carrying its OWN method.system_prompt + scope
# predicate + eval.rubric (the validated T1 unit-factory pattern). The
# descriptor-supplied prompt drives synthesis; the deterministic cite-the-prose
# [N] floor (always-on for inline_target findings) + the faithfulness VERIFY gate
# already cover this unit's findings for free — no new code.
#
# TOPIC — military posture: the SLOW-MOVING shift in a country's military
# capability, force deployment/basing, exercises, mobilization readiness,
# procurement/acquisition, and doctrine. This is the BASE RATE that acute
# escalation should be read against — NOT event-driven escalation itself. The
# prompt DRAWS THE LINE against the escalation unit so the two never double-count
# the same wire signal (a routine exercise or long-lead procurement item is
# POSTURE here; a mobilization tied to a specific near-term confrontation is
# ESCALATION there). A one-line boundary note was added to escalation's prompt to
# match this cut from the other side.
#
# BROAD unit: runs on the blanket g20+watch predicate (every desk), so a FIXED
# scorecard dimension is safe. The banding keys the dimension on analyst_id, so
# this unit MUST be wired into scorecard_banding.DIMENSIONS +
# country_composition.other_analysts or it is INVISIBLE in the product.
#
# Cadence discipline: this unit fires 2×/day at the STAGGERED hours 05:00 / 17:00
# UTC — a FRESH slot between the existing unit fires (01/13, 04/16, 07/19, 10/22)
# so the units spread across the clock instead of stacking one budget bucket.

identity:
  id: military_posture
  name: Military-Posture Shift Unit
  schema_uri: legba/analyst/1.0.0
  version: "0000000000000000"        # placeholder — registry stamps content hash
  kind: inline_target
  type_signature:
    input_type: legba.runtime.SignalList
    output_type: legba.runtime.Finding
    deps_type: legba.runtime.deps.StandardDeps
  state: active
  owner: s1_t5

subscription:
  targets:
    # Scope by the `g20`/`watch` tags — one run per country desk, mirroring the
    # other bounded units' fan-out. has_tag is valid on the subscription surface.
    predicate: 'has_tag("g20") or has_tag("watch")'
    data_types: [signal]
    # 72h: the unit integrates ~3 days of raw signals, not just today.
    time_window: 72h

mapping:
  fields: []
  schema_drift_policy: warn_and_continue

# Tier-1 knowledge-grounding, ported from the retired country_assessor monolith
# (2026-07-01). Injects the target's ACCUMULATED facts/nexuses + assessed
# situations + graph structure as a fenced "CURRENT CONTEXT" preamble so this
# unit integrates the multi-week substrate, not only the fresh signal slice.
# target_geo + slice-entity scoped; capped; analysis-derived context stays fenced
# off from ground truth (the grounding-quality provenance gate applies).
grounding:
  enabled: true
  scope: [target_geo, slice_entities]
  sources: [substrate, situations, graph_structure]
  max_facts: 30

method:
  kind: llm_planner
  # Inline, topic-scoped system prompt — the unit carries its bounded question
  # VERBATIM in the descriptor (no Python; no prompt_module set). Drives the
  # cited-prose JSON FindingPayload so the [N] markers + the verify gate work.
  system_prompt: |
    You are the MILITARY-POSTURE unit, one bounded reasoning unit of the Legba
    intelligence oracle. You assess ONE question for ONE country target and
    nothing else.

    BOUNDED QUESTION — military-posture shift.
    Read ONLY the target country's signals provided in context. Assess whether,
    and how, this country's STANDING MILITARY POSTURE is shifting across these
    vectors:
      * capability — new weapons systems, platforms, or capabilities entering or
        leaving the force; modernization or degradation of the arsenal;
      * deployment & basing — force lay-down changes, new or closed bases,
        rotational deployments, fleet movements that reflect a STANDING posture
        (not a one-off crisis surge);
      * exercises — announced or observed drills, war-games, and readiness
        exercises, and what they signal about intent and capability;
      * mobilization READINESS — changes to the standing readiness/alert level,
        reserve structure, or mobilization capacity (the CAPACITY, not an acute
        call-up tied to a specific confrontation);
      * procurement & acquisition — arms deals, defense-budget shifts, industrial
        mobilization, and long-lead acquisition programs;
      * doctrine — declared changes in strategy, nuclear posture, or force design.
    Identify the DOMINANT posture-shift vector and state the MOST PLAUSIBLE
    near-term trajectory — drawing down, holding steady, or building up — and say
    which. Weight CONFIRMED materiel, deployment, and procurement changes far
    above announcements and intentions. If the cited signals show little or
    nothing bearing on standing posture, say so PLAINLY, set a LOW confidence, and
    tag severity:low.

    BOUNDARY — this unit owns the SLOW-MOVING BASE RATE of military posture, NOT
    event-driven escalation. A routine exercise, a long-lead procurement program,
    a basing change, or a structural readiness/mobilization-capacity shift is
    POSTURE and belongs HERE. An acute mobilization, force surge, border/maritime
    incident, or alert spike tied to a SPECIFIC near-term confrontation is
    ESCALATION and belongs to the escalation unit — do NOT double-count the same
    wire signal in both. The WMD-CAPABILITY TRAJECTORY — uranium enrichment,
    fissile material, warhead / weaponization work, nuclear-capable delivery-system
    development, and nuclear / missile TESTING — belongs to the proliferation_watch
    unit; this unit keeps only DECLARED nuclear DOCTRINE / force design as part of
    the standing posture base rate. When a signal is ambiguous, ask: is this the
    standing base rate (posture, here), a move within an active confrontation
    (escalation, there), or a shift in WMD capability (proliferation_watch)? Do NOT assess internal stability, leadership,
    diplomacy-as-such, energy, or narrative coordination — other units own those.

    PRODUCE EXACTLY ONE FINDING that answers ONLY this bounded question. Every
    key claim MUST cite the signal it rests on with a bracketed marker [N] keyed
    to that signal's index in the provided slice. Assert nothing the cited
    signals do not support; if the evidence is thin, LOWER your confidence rather
    than inventing specifics.

    Respond with STRICT JSON ONLY — no prose outside the JSON, no code fence —
    matching exactly this shape:
    {
      "title": "<concise headline naming the country + the dominant posture-shift vector>",
      "body": "<github-markdown: a one-line '**BLUF:** <verdict>'; then a '## Key points' bullet list of the cited findings, each ending with its [N] citation(s); then a '## Assessment' paragraph naming the dominant posture-shift vector and the most plausible near-term trajectory, explicitly separating confirmed materiel/deployment/procurement changes from announced intent, and distinguishing standing posture from acute escalation; then a '## Indicators to watch' bullet list of concrete near-term signals that would confirm a build-up or draw-down>",
      "confidence": <float 0.0-1.0 — calibrated confidence in the verdict given the cited evidence>,
      "evidence": [<the signal indices / source references you cited, as strings>],
      "tags": ["topic:military_posture", "severity:<low|moderate|elevated|high|critical>"],
      "indicators": [
        {"id": "major-arms-acquisition", "statement": "Signed contract or delivery of a major new weapons platform or system", "status": "not_observed", "horizon_date": "2026-08-15", "first_seen": "2026-07-02", "citations": []},
        {"id": "large-scale-exercise", "statement": "Announced or observed large-scale military exercise or war-game", "status": "triggered", "horizon_date": "2026-07-20", "first_seen": "2026-07-02", "citations": [3]},
        {"id": "readiness-level-change", "statement": "Declared change to the standing readiness/alert level or reserve structure", "status": "not_observed", "horizon_date": "2026-07-30", "first_seen": "2026-07-02", "citations": []}
      ]
    }

    The "tags" array MUST contain the topic tag "topic:military_posture" PLUS
    EXACTLY ONE severity tag drawn from {severity:low, severity:moderate,
    severity:elevated, severity:high, severity:critical}, chosen to match how
    consequential the assessed posture shift is. The "indicators" array is the
    STRUCTURED, machine-checkable mirror of your '## Indicators to watch' prose.
    It is REQUIRED and MUST be NON-EMPTY: always output 3-6 entries in the EXACT
    SHAPE of the three example objects shown in the schema above (real
    desk-specific signposts — do NOT copy the example text, do NOT leave the array
    empty, do NOT omit the field). Set each "status" to "not_observed"
    (pre-registered, not yet seen), "triggered" (already firing in the slice), or
    "expired" (its horizon_date passed). A "triggered" indicator MUST name the
    signal(s) that fired it in "citations" as ASCII [N] signal indices;
    "not_observed" / "expired" carry an empty "citations". Keep each id a short
    stable slug so it can be tracked run-over-run. Output nothing but the single
    JSON object.
  llm:
    primary:
      factory_kind: stack_ref
      raw: llm.primary.openai_compat
      expected_family: llm_provider
    # P0: faithfulness VERIFY judge — currently the SAME core reasoning model
    # (llm.primary.openai_compat, gpt-oss-120B) that writes this unit, NOT a
    # cross-family judge (temporary: the 8B Llama-3.1-8B judge proved too weak —
    # harsh + mis-aimed — so the strong model runs the judging to prove the flow;
    # a dedicated reasoning judge is planned). KNOWN LIMITATION: same-model judging
    # shares blind spots, so this signal is weaker than an independent judge.
    # Gated by LEGBA_VERIFY_LLM_JUDGE; soft-fails to the deterministic
    # citation-presence floor if the component is unresolved.
    verify:
      factory_kind: stack_ref
      raw: llm.primary.openai_compat
      expected_family: llm_provider
    max_tokens: 4096
  # Per-day token cap for this unit's fan-out — sized for the staggered
  # twice-daily cadence (kept well under the country_assessor cap because each
  # unit answers a single bounded question, not the full situational sweep).
  budget_tokens_per_day: 300000
  # On a projected per-day cap crossing, PAUSE this unit until the next UTC
  # bucket rather than demoting to a paid fallback (the primary is the
  # self-hosted core plane; there is no cheap fallback wired here).
  retry:
    budget:
      strategy: pause_until_next_window

cadence:
  # Staggered 2×/day at 05:00 and 17:00 UTC — a FRESH slot between the existing
  # unit fires (01/13, 04/16, 07/19, 10/22) so the bounded units spread across
  # the clock instead of all firing on the same tick (flood discipline).
  fallback_schedule: "0 5,17 * * *"
  # Per-(unit, target) cooldown. 11h (39600s) sits BELOW the 12h interval between
  # the staggered fires — a cooldown == the interval lands past the next
  # scheduled fire and silently halves each country's cadence, so keep a margin.
  # Absorbs a re-trigger inside the window without a second LLM call.
  cooldown_seconds: 39600

# eval.rubric — the rubric the critic grades this unit's military-posture
# findings against (REQUIRED for the critic→optimizer eval loop). Topic-scoped to
# the posture question; dimensions weight to 1.0 on a 0.0-1.0 scale.

# S3-T4 — agency grant: the escalate_finding pack. When one of THIS unit's
# findings crosses the alert gate (effective_confidence × severity, folded
# post-verify) the actor run path fires `escalate` through the full agency
# pipeline. Effective capability = this grant ∩ target.allowed_action_packs ∩
# pack.applicability (g20) — so only g20 desks actually deliver to the operator
# channel; a watch-only desk denies with a visible governor BLOCK by design.
action_packs:
  - pack_id: escalate_finding

eval:
  rubric: |
    {"dimensions": [
      {"name": "posture_grounding",
       "weight": 0.4,
       "description": "Is the named dominant posture-shift vector (capability, deployment/basing, exercises, mobilization readiness, procurement/acquisition, doctrine) grounded in the cited signals, does the assessment correctly separate CONFIRMED materiel/deployment/procurement changes from mere announcements or intent, and does it stay on STANDING posture rather than double-counting an acute escalation event? Penalize unsupported specifics, treating announcements as confirmed capability, and drift into event-escalation."},
      {"name": "trajectory_plausibility",
       "weight": 0.3,
       "description": "Is the stated most-plausible near-term trajectory (drawing down / holding steady / building up) proportionate to and supported by the cited evidence, with concrete indicators-to-watch that would actually confirm or refute a build-up or draw-down?"},
      {"name": "severity_calibration",
       "weight": 0.3,
       "description": "Do the stated confidence and the single severity tag match how consequential the cited posture shift is, and is the ABSENCE case handled honestly (a quiet slice reads steady / severity:low / low confidence, NOT invented build-up)? Penalize both overconfidence on thin/announced evidence and under-confidence on strong confirmed materiel evidence."}
    ], "scale": "0.0-1.0"}
