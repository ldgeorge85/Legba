# K-3 — India Energy Predictor analyst descriptor.
#
# Activates the L-174 predictor kind (AutoARIMA + conformal CI, optional
# LLM narrative) against the india_energy_infra target's signal stream.
# Mirrors the spike's gate-9 wiring (test_spike_integration.py
# _build_predictor_analyst_descriptor) but ships as a production
# descriptor — registered via the registry REST API
# / the registry REST API, NOT inline through the test fixture.
#
# Method:
#   * kind = stat_forecaster (the Wave B prereq #1 literal — the predictor
#     is a deterministic stat core with an OPTIONAL LLM narrative on top).
#   * horizon_days = 7  (one operator-week ahead, predictor default).
#   * ci_level     = 90 (integer percentage; predictor's z_table accepts
#                       80/90/95/99).
#   * No method.llm.primary — first cycle runs in pure stat-only mode
#     (PredictorDeps.llm = None) so we don't burn LLM budget per tick.
#     A later revision can attach the gpt-oss-120b stack-ref to enable the
#     decorative "why this number" paragraph.
#   * prompt_module is REQUIRED by the registry's schema even for
#     stat_forecaster (Wave B prereq #4 wired it as the DSPy narrative
#     module path); we point at legba.prompts.predictor.v1 which exists
#     and is what build_prompt_module() returns.
#
# Subscription:
#   * predicate restricts to the india_energy_infra target only.
#   * time_window=336h (14 days) so the predictor sees the AutoARIMA
#     minimum-history budget when production-loop signal volume picks up.
#     NOTE (K-3 gap): _read_substrate_slice in dapr_actors today hard-codes
#     a 24h window and ignores subscription.time_window. The predictor will
#     therefore see only the last 24h of signals at first cycle; documented
#     in the K-3 report.
#
# Cadence:
#   * fallback_schedule = "*/30 * * * *" — every 30 min (predictor doesn't
#     need to be hot; once per signal-batch is enough).
#   * cooldown_seconds = 900 — 15-min floor between runs.

identity:
  id: india_energy_predictor
  name: India Energy Predictor
  schema_uri: legba/analyst/1.0.0
  version: "<content-hash stamped at register time>"
  kind: predictor
  type_signature:
    input_type: legba.runtime.SignalList
    output_type: legba.runtime.Prediction
    deps_type: legba.runtime.deps.StandardDeps
  state: active
  owner: k3_predictor_activation

subscription:
  targets:
    predicate: 'target_id() == "india_energy_infra"'
    data_types: [signal]
    time_window: 336h

mapping:
  fields: []
  schema_drift_policy: warn_and_continue

method:
  kind: stat_forecaster
  prompt_module: legba.prompts.predictor.v1
  llm:
    horizon_days: 7
    ci_level: 90
  # No budget_tokens_per_day cap — the predictor's stat core is pure
  # numeric and the optional LLM narrative is OFF on this descriptor
  # (no method.llm.primary).  Setting budget_tokens_per_day to 0 with
  # an absent LLM still trips the BudgetEnforcer's ``used >= budget``
  # gate at run-time, so we leave it None (= unbounded) instead.  When
  # a later revision attaches the LLM narrative, set a real per-day cap.

cadence:
  # ── P0-T6 SEQUENCED FREEZE (SUBTRACT) ──────────────────────────
  # fallback_schedule is NULLED to freeze this forecast-as-claim predictor: the
  # dapr_actors on-activate gate (`if schedule:`, ~L1198) registers NO reminder
  # for a null schedule. A forecast is a CLAIM that must be SCORED before it
  # ships. FREEZE, NOT deletion — RETURNS at P4 behind the Brier scoreboard
  # alongside country_predictor. Declared in docs/SEAMS.md. To restore: set
  # fallback_schedule back to "*/30 * * * *" (the prior every-30-min cadence).
  fallback_schedule: null
  cooldown_seconds: 900

outputs:
  - kind: a2a_skill
    config:
      skill_id: intelligence.india_energy_forecast
