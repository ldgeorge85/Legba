# L-175 / done-plan K-1 — critic analyst grading india_energy_inline.
#
# kind: critic → AnalystKind.CRITIC.  method.kind: critic → the L-175
# critic kind handler (legba.data.analysts.critic).
#
# Heterogeneity guard (per L-105 §3): the judge LLM (Claude Opus 4.7
# via Anthropic) MUST differ from the analyzed analyst's LLM
# (llm.primary.openai_compat).  The guard fires at actor activation
# time, not descriptor validation time — registering a same-LLM critic
# is allowed for the operator's review, but it will hard-fail on run
# unless the analyzed analyst sets eval.allow_self_correlated=true.
#
# Descriptor-pinned target: eval.optimizer.analyzed_analyst_id locks
# this critic to grade india_energy_inline_critic_test outputs only.
# The runtime's _critic_descriptor_pinned_analyst_id helper reads this
# at run-path dispatch.

identity:
  id: india_energy_critic
  name: India Energy Critic (Claude Opus 4.7)
  schema_uri: legba/analyst/1.0.0
  version: "<content-hash stamped at register time>"
  kind: critic
  type_signature:
    input_type: legba.runtime.AnalystOutputRow
    output_type: legba.runtime.Critique
  state: active
  owner: critic_e2e_test

subscription:
  # The critic's READ_SLICE reads ONE analyst-output row keyed off
  # target_filter (the row UUID) or options['analyzed_output_id'].  It
  # does NOT consume the standard substrate slice.
  substrate:
    direct_queries: true

mapping:
  fields: []
  schema_drift_policy: warn_and_continue

method:
  kind: critic
  prompt_module: "legba.prompts.critic.v1"
  llm:
    # 2026-06-22: critic on the core plane (operator: Anthropic = consult/
    # deep_consult only). Self-correlated vs the analyzed analyst — see
    # india_energy_inline_critic_test.eval.allow_self_correlated. TO REVERT:
    # raw -> llm.anthropic.opus_4_7 + allow_self_correlated=false there.
    primary:
      factory_kind: stack_ref
      raw: llm.primary.openai_compat
      expected_family: llm_provider
    max_tokens: 1536
  # X-2 cross-pillar tool whitelist.  L-211 mnemosyne_trust_query lets
  # the critic ask Mnemosyne for federation-grade trust scoring on a
  # source / actor / entity before scoring the analyst's confidence
  # axis.  Tool surface is contract-frozen to {weight, hops} per the
  # MN-3 Q13 minimum-disclosure rule; the L-211 implementation has a
  # P-007 Q5 `chain_unavailable` fallback when Mnemosyne is unreachable
  # so the critic stays operational even if Mnemosyne is offline.
  tools_whitelist:
    - mnemosyne_trust_query
  budget_tokens_per_day: 50000

cadence:
  # Match the inline analyst's cadence — every 5 minutes.  The
  # reconcile loop drives the reminder; on-demand ActorProxy.run()
  # invocations bypass the reminder entirely.
  fallback_schedule: "*/5 * * * *"
  cooldown_seconds: 60

outputs:
  - kind: nats_stream
    config:
      channel: critiques

# eval block — the optimizer dict carries the pinned analyzed target.
# allow_self_correlated default-false is explicit for operator clarity.
eval:
  optimizer:
    analyzed_analyst_id: india_energy_inline_critic_test
  allow_self_correlated: false
