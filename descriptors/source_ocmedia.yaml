# X-1 source expansion (2026-11-14) — draft SourceDescriptor. Ships DRAFT;
# the reference host walks it to CONFIGURED (descriptors/LIFECYCLE.md), never
# active — activation is the owner's call per source.
#
# OC Media — independent newsroom in Tbilisi covering the South Caucasus
# (Georgia, Armenia, Azerbaijan) and the North Caucasus. Fills the Caucasus
# gap (no outlet for the region in the tree).
# Checked 2026-11-14 by the source-expansion review (one GET, generic client
# identity): HTTP 200, application/rss+xml, 16 items, newest 2026-11-14 09:07
# UTC, oldest 2026-11-12 13:52 — about 8 items a day. Every three hours keeps
# well inside a two-day window.
#
# Class: reporting. Language: en. Region: South Caucasus — no single
# publisher-origin fallback is honest for a three-country beat, so the
# declared geo lists the three; the in-body geocoder files each story.
#
# robots.txt allows the feed path for `*`. Credibility: oc-media.org 0.75 / wire.
#
# First poll: the default first-poll age cap (30 days).

identity:
  id: source.ocmedia.news
  name: OC Media (South Caucasus)
  kind: rss
  schema_uri: legba/source/1.0.0
  version: "0000000000000000"        # placeholder — registry stamps content hash
  abstraction_level: L1
  state: draft
  owner: x1_source_expansion
  created: "2026-11-14T00:00:00Z"

scope:
  owner_tenant: shared
  geo: [GE, AM, AZ]
  languages: [en]
  tags: [news, caucasus, georgia, armenia, azerbaijan, independent]
  source_class: reporting
  license_class: cc_nc            # CC BY-NC 4.0 — non-commercial
  attribution: "OC Media (oc-media.org), CC BY-NC 4.0"
  access_class: public            # free no-auth feed, no separate reuse agreement

acquisition: poll

cadence:
  schedule:
    factory_kind: cron
    raw: "37 */3 * * *"
  cooldown_seconds: 60
  jitter_seconds: 60

config:
  url:
    factory_kind: text
    raw: "https://oc-media.org/feed/"

pipeline:
  ingestion_filters:
    - kind: dedupe_tier_1            # URL-canonical hash
      config: {}
    - kind: dedupe_tier_2            # SHA-256 content hash
      config: {}
  enrichment:
    - kind: language_detect
      config: {}
    - kind: ner_multilingual
      config: {}
    - kind: geocode
      config: {}
  media: reference

deps: {}

output:
  retention: interest
  max_age_seconds: 604800
  delivery: lossy

subscription_policy: open
