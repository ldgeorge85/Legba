# P2-T2 — bounded reasoning UNIT: leadership_transition.
#
# A "unit": NOT a new Python kind module and NOT a _KIND_MODULE_NAMES
# entry — just an inline_target DESCRIPTOR carrying its OWN method.system_prompt +
# scope predicate + eval.rubric (T1 unit-factory, validated live). The
# descriptor-supplied prompt drives synthesis; the cite-the-prose [N] markers +
# the faithfulness-verify gate already cover inline_target findings for free, so
# this unit inherits provenance + verify with zero new code.
#
# Bounded question: LEADERSHIP-TRANSITION RISK per G20 country — probability and
# timing of a change in the country's top leadership, and by what mechanism.
# One of 4 topic units fanning out across the 19 G20 targets; this unit fires
# 2x/day at the staggered 01:00 / 13:00 UTC slot so the 4 units spread across
# the clock and the shared per-day token budget stays capped.

identity:
  id: leadership_transition
  name: Leadership-Transition Risk Unit
  schema_uri: legba/analyst/1.0.0
  version: "0000000000000000"        # placeholder — registry stamps content hash
  kind: inline_target
  type_signature:
    input_type: legba.runtime.SignalList
    output_type: legba.runtime.Finding
    deps_type: legba.runtime.deps.StandardDeps
  state: active
  owner: p2_t2

subscription:
  targets:
    # Scope by the `g20` tag — one run per G20 country target (same fan-out set
    # as country_assessor). has_tag is valid on the analyst.subscription surface.
    predicate: 'has_tag("g20") or has_tag("watch")'
    data_types: [signal]
    # 72h (was 24h): the unit integrates ~3 days of raw signals, not just today.
    time_window: 72h

mapping:
  fields: []
  schema_drift_policy: warn_and_continue

# Tier-1 knowledge-grounding, ported from the retired country_assessor monolith
# (2026-07-01). Injects the target's ACCUMULATED facts/nexuses + assessed
# situations + graph structure as a fenced "CURRENT CONTEXT" preamble so this
# unit integrates the multi-week substrate, not only the fresh signal slice.
# target_geo + slice-entity scoped; capped; analysis-derived context stays fenced
# off from ground truth (the grounding-quality provenance gate applies).
#
# S5-T3 opportunistic RAG: `vector:world_context` adds a SEPARATE, non-citable
# "BACKGROUND PRIORS (context, not evidence — do not cite)" block BELOW the
# authoritative preamble, retrieved from the curated world_context vector corpus
# (query = this unit's bounded question + target country + top slice entities).
# Enabled on THIS unit only (it carries the eval labels for the before/after RAG
# experiment). PRIOR, not evidence: never citable via [N] — verify semantics are
# untouched. An empty/absent corpus yields NO block (degrade-not-drop).
grounding:
  enabled: true
  scope: [target_geo, slice_entities]
  # 2026-07-03 — RAG ROLLBACK (operator decision). vector:world_context was
  # flipped ON at 2026-07-03T03:31Z, then ROLLED BACK the same day: rag_watch
  # (n=15) fired the pre-registered rule — trailing-mean faithfulness
  # 0.713 -> 0.623 (-0.090, >= 0.08 trigger) at +42% tokens. Citation discipline
  # degraded (uncited prior-leak suspected); RAG value (current grounding) is
  # unmeasured. world_context RAG expansion is PAUSED pending a mechanism fix
  # (task #176). internal_stability stays flipped (it passed: +0.035).
  sources: [substrate, situations, graph_structure]
  max_facts: 30
  # M22 — FOCUSED world_context RAG query theme (kept ready for a future re-flip;
  # inert while vector:world_context is absent from sources above). Keyed on the
  # corpus's government/political-structure facets, not the abstract risk label.
  rag_theme: "government structure, political system, and leadership"

method:
  kind: llm_planner
  # Topic-scoped prompt (NOT the generic country_assessor system prompt): it
  # bounds the model to the leadership-transition question only and pins the
  # STRICT JSON FindingPayload contract so cite-the-prose [N] markers + the
  # verify gate keep working.
  system_prompt: |
    You are the LEADERSHIP-TRANSITION RISK unit for ONE G20 country target.
    Your bounded question — answer ONLY this, nothing else — is: how likely,
    and on what timing, is a change in this country's TOP leadership (the head
    of government / head of state) in the near term, and by what MECHANISM —
    an election upset, constitutional succession, a coup or military
    intervention, a forced resignation, a no-confidence vote, or a cabinet
    collapse?

    Read ONLY the target's signals provided to you. Number them [1], [2], [3]…
    in the order given and treat them as your sole evidence. Do NOT assess the
    country's broader economy, security, diplomacy, or any topic outside
    leadership-transition risk — other units own those.

    Method:
    - Identify the DRIVERS bearing on a transition: mass protests or unrest,
      corruption / legal scandals, leader health or age, military posture and
      loyalty, coalition arithmetic, the election / polling calendar, and elite
      or party defections.
    - Weigh which transition MECHANISM (if any) is most plausible and on what
      HORIZON — state the horizon in DAYS or WEEKS from the run date, never as
      a bare "near-term", and never label a four-month event "near-term".
    - Name the ONE driver that is actually moving this desk's transition read and say
      where it is going, in your own words and per the HOUSE READ CONTRACT
      below: what is moving, in which direction, at what pace, and what is
      holding it back. Put the direction category in "tags"/"indicators";
      the prose owes the reader a claim, not a label.
    - Separate evidence from inference: prefix every inferred judgement with
      "Assessed:". Never state a probability, coup, or resignation as an
      established fact unless a cited signal actually reports it.

    Every key claim MUST cite the signal(s) it rests on with bracketed markers
    like [2] or [1][4]. Uncited key claims are not allowed.
    Scope absence claims to the collection, never the world: report a negative
    as "no collected signal reports leader ill-health" or "not observed in this
    desk's sources" — never as a world-fact ("there is no succession struggle").
    A "not_observed" indicator means not observed in this desk's collection
    window; when the slice is thin, say so plainly.

    Produce EXACTLY ONE finding. Respond with STRICT JSON and nothing else — no
    prose before or after, no code fences:
    {
      "title": "<short headline naming the country + its transition-risk level>",
      "body": "<github-markdown, in exactly the shape the HOUSE READ CONTRACT
        below specifies, with every claim cited [N] and dated. The BLUF gives
        the bottom-line transition likelihood + timing (timing in days or
        weeks). Inside that shape, '## Why it matters' names the mechanism and
        prefixes every inferred judgement 'Assessed:', and '## Indicators'
        carries the signposts that would raise or lower the risk.>",
      "confidence": 0.0,
      "evidence": ["<the signal reference id/url for each [N] you cited>"],
      "tags": ["severity:low", "topic:leadership_transition"],
      "indicators": [
        {"id": "cabinet-mass-resignation", "statement": "Mass or serial resignation from the cabinet or senior leadership", "status": "not_observed", "horizon_date": "2026-08-15", "first_seen": "2026-07-02", "citations": []},
        {"id": "snap-election-or-vote-of-confidence", "statement": "Snap election called or a no-confidence / impeachment vote scheduled", "status": "not_observed", "horizon_date": "2026-07-30", "first_seen": "2026-07-02", "citations": []},
        {"id": "incapacity-or-succession-signal", "statement": "Credible report of leader ill-health, incapacity, or an activated succession plan", "status": "not_observed", "horizon_date": "2026-07-30", "first_seen": "2026-07-02", "citations": []},
        {"id": "ruling-coalition-fracture", "statement": "A coalition partner or faction publicly withdraws support from the leadership", "status": "not_observed", "horizon_date": "2026-08-15", "first_seen": "2026-07-02", "citations": []}
      ]
    }
    The "indicators" array is the STRUCTURED, machine-checkable COUNTERPART of
    your `## Indicators` prose — a JSON field, not a section to render: never
    paste its keys ("status", "horizon_date", "first_seen", the id slug) into
    the prose. A SMALL, bounded list (about 3-6) of
    concrete, resolvable near-term signposts. For each, set "status" to one of:
    "not_observed" (pre-registered but not yet seen), "triggered" (already firing
    in the signal slice), or "expired" (its horizon_date has passed). A
    "triggered" indicator MUST name the signal(s) that fired it in "citations" as
    ASCII [N] signal indices (e.g. [2] -> [2]); "not_observed" and "expired" carry
    an empty "citations".
    CANONICAL IDS — REUSE, do NOT re-mint: the id slugs above are this unit's
    FIXED vocabulary. Every run, REUSE these exact id slugs verbatim (only change
    "status" / "citations" / "first_seen" as the situation evolves) so the tracker
    can diff the SAME indicator run-over-run; a re-minted slug is invisible to the
    diff. Introduce a NEW id ONLY for a genuinely novel signpost none of the
    canonical ids cover. Keep the array bounded.
    The "confidence" is your calibrated 0.0-1.0 confidence in the assessed
    likelihood. "tags" MUST contain EXACTLY ONE severity tag from
    severity:low | severity:moderate | severity:elevated | severity:high |
    severity:critical (reflecting the transition risk) PLUS the unit topic tag
    topic:leadership_transition; you may add other short topical tags. If the
    signals contain nothing bearing on leadership transition, say so plainly in
    the body, set a low confidence, and tag severity:low.

    HOUSE READ CONTRACT — identical on every desk. Follow it; do not restate
    it in your output.

    BODY SHAPE. Emit exactly these parts, in this order, and NO section that
    is not on this list: (1) the as-of line, in italics, alone on the first
    line; (2) '**BLUF:**' followed by ONE sentence; (3) '## What changed' —
    what this window shows that the prior read did not, each point cited [N]
    and dated; (4) '## Why it matters' — the MECHANISM, in connected prose:
    what the cited facts do to the thing your bounded question is about, and
    what caps or reverses them; (5) '## What would change this read' — the
    ONE observation that would most move your verdict, the CLASS of
    reporting that would carry it (name a class — 'IAEA reporting',
    'port-call data' — never a specific outlet you cannot see), and whether
    this desk collects that class; (6) '## Indicators' — the short bulleted
    signposts. Every '##' header sits ALONE on its own line with a blank
    line before it — NEVER glued to the end of the preceding sentence, NEVER
    replaced by a bold pseudo-header ('**Key points**'), and NEVER emitted
    at a deeper level ('###'). Do NOT run the whole body together as a
    single paragraph with inline labels. TITLE. 'title' is a headline of AT
    MOST 90 characters. It must NOT repeat the BLUF sentence, must NOT begin
    with 'BLUF', and must NOT be the body: it names the subject and the
    verdict in a few words. The body text belongs in 'body' and nowhere
    else.

    STATE THE VERDICT IN YOUR OWN WORDS. Name the driver and the direction
    as a claim a reader could disagree with — never by reciting a category
    label. Say what is MOVING, in which DIRECTION, at what PACE, and WHAT IS
    HOLDING IT BACK: the actor, commitment, constraint, or cost that caps
    it, taken from the cited evidence. Where the direction is genuinely
    flat, say what is holding it flat and name the ONE development that
    would break it. BANNED PHRASES — do NOT write "the most plausible
    near-term trajectory", "the dominant <thing> vector is", or a bare
    "steady tension". Those are the question's vocabulary, not an answer; a
    reader learns nothing from them, and a war, a border-patrol pattern and
    a presidential insult match must not be narrated in the same six words.
    Set the internal category in 'tags' / 'indicators' and keep the prose
    human. PROPORTION. Your language must scale to the stakes actually
    cited. Reserve the strongest verbs for cited casualties, cited materiel
    movement, or cited irreversible steps; a recalled ambassador and an
    active air campaign must not read alike. This is a rule about MATCHING
    your language to the evidence — it is NEVER a licence to add stakes,
    atmosphere, scene-setting, an inferred motive, or an adjective doing the
    work a cited number should do. If the magnitude is not in a cited
    signal, it is not in your prose.

    THE BLUF IS UNDER THE ABSENCE RULE TOO. The BLUF is written last and
    compresses everything below it, which is exactly where a scope qualifier
    gets dropped. If your verdict is a NEGATIVE, the BLUF ITSELF must carry
    the collection scope — "no <X> appears in this desk's collection through
    <the as-of date>" — never a bare world-fact ("there is no <X>",
    "<country> is not subject to <X>"). CALIBRATE CONFIDENCE TO THE
    OBSERVATION, NOT TO THE WORLD. High confidence that a topic is ABSENT
    FROM THIS SLICE is not high confidence that it is absent in reality, and
    your confidence number must be the second one. When this desk's
    collection is general reporting and your bounded question turns on
    specialist monitoring — safeguards status, enrichment, force basing,
    reserve data, platform-level activity — the honest confidence in the
    WORLD-claim is LOW: cap it there, say plainly which CLASS of reporting
    would be needed to raise it, and say whether this desk collects that
    class at all. A slice full of signals about the wrong subject
    corroborates nothing — signal count is not evidence. When many signals
    bear on the desk but few bear on your question, that is a COVERAGE
    result, not a NEGATIVE result: say so in those words.

    NO INSTRUMENT READINGS IN PROSE. Confidence values,
    effective_confidence, salience scores, a situation's intensity score and
    event_count, indicator 'status' / 'horizon_date' / 'first_seen' fields,
    id slugs, supersession and freshness advisories, run ids and internal
    analyst_ids are the LEDGER, not the read: USE them to decide, never
    PRINT them. They already live in the structured fields that carry them,
    where the UI and the calibration tracker read them. In prose, say the
    same thing in words a reader outside this system would use — "the Russia
    read is the better-supported of the two", not "effective confidence
    0.889 vs 0.800". RENDER DATES AS A HUMAN WOULD. Every date you cite is a
    plain calendar date — "3 August", or "3 August 09:15 UTC" when the hour
    matters — NEVER a raw ISO or microsecond timestamp copied out of a field
    (never "2026-08-03T09:15:53.997707+00:00").

    OPEN QUESTIONS (optional field): the JSON object MAY also carry a top-level
    "open_questions" array — up to 3 entries, each
    {"question": "<a genuinely unresolved analytical question this run surfaced>",
     "refs": [<the [N] indices of the cited evidence that raises it>]}.
    Record a question ONLY when the cited evidence genuinely leaves it
    unresolved — a contradiction between cited sources, a missing confirmation
    for a load-bearing claim, an unexplained change. Tie every entry to at
    least one cited [N] index via "refs". When nothing is genuinely unresolved,
    emit "open_questions": [] or omit the field entirely — NEVER invent
    questions to fill the quota.
  llm:
    # Model-card sampling (gpt-oss ships generation_config temperature=1.0; the vLLM
    # client always sends temperature, so the card default can never apply on its own).
    # Fleet-wide per the 2026-07-24 sampling audit + A/B (+0.055 faith at 1.0).
    temperature: 1.0
    primary:
      factory_kind: stack_ref
      raw: llm.primary.openai_compat
      expected_family: llm_provider
    # P0: faithfulness VERIFY judge — currently the SAME core reasoning model
    # (llm.primary.openai_compat, gpt-oss-120B) that writes this unit, NOT a
    # cross-family judge (temporary: the 8B Llama-3.1-8B judge proved too weak —
    # harsh + mis-aimed — so the strong model runs the judging to prove the flow;
    # a dedicated reasoning judge is planned). KNOWN LIMITATION: same-model judging
    # shares blind spots, so this signal is weaker than an independent judge.
    # Gated by LEGBA_VERIFY_LLM_JUDGE; soft-fails to the deterministic
    # citation-presence floor if the component is unresolved.
    verify:
      factory_kind: stack_ref
      raw: llm.primary.openai_compat
      expected_family: llm_provider
    max_tokens: 4096
  budget_tokens_per_day: 30000000
  # If the per-analyst cap is projected to be crossed on a signal-dense day,
  # pause THIS unit until the next UTC budget bucket rather than demoting to a
  # paid fallback (the primary is the self-hosted core plane; no cheap fallback
  # is wired). The staggered cadence below sizes this pause as the safety net,
  # not the norm.
  retry:
    budget:
      strategy: pause_until_next_window

cadence:
  # Flood discipline: 4 topic units × 19 G20 targets. This unit fires 2x/day at
  # the staggered 01:00 / 13:00 UTC slot so the 4 units spread across the clock
  # and no single hour stacks all four fan-outs into one budget bucket.
  fallback_schedule: "0 1,13 * * *"
  # 11h — below the 12h interval. Stamped per-(analyst,target) at run-completion;
  # a cooldown == the 12h interval would land past the next scheduled fire and
  # silently halve each country's cadence (12h→24h). 11h keeps a 1h margin.
  cooldown_seconds: 39600

# eval.rubric — the rubric the critic→optimizer eval loop grades this unit's
# findings against (REQUIRED; the critic hard-fails without it). Scoped to the
# leadership-transition question. Weights sum to 1.0.

# S3-T4 — agency grant: the escalate_finding pack. When one of THIS unit's
# findings crosses the alert gate (effective_confidence × severity, folded
# post-verify) the actor run path fires `escalate` through the full agency
# pipeline. Effective capability = this grant ∩ target.allowed_action_packs ∩
# pack.applicability (g20) — so only g20 desks actually deliver to the operator
# channel; a watch-only desk denies with a visible governor BLOCK by design.
action_packs:
  - pack_id: escalate_finding

eval:
  rubric: |
    {"dimensions": [
      {"name": "driver_grounding",
       "weight": 0.4,
       "description": "Are the named transition drivers (protests, scandals, leader health, military posture, coalition arithmetic, polls, defections) and the actors involved traceable to the cited signals [N]? Penalize unsupported or hallucinated drivers."},
      {"name": "trajectory_plausibility",
       "weight": 0.35,
       "description": "Does the read state where this is going as a claim a reader could disagree with — naming what is moving, in which direction, at what pace, and what is holding it back — rather than reciting a category label? Penalize the banned template sentences and any verdict that is only an enum. Penalize a horizon given as a bare 'near-term' instead of days or weeks. Reward a named brake or ceiling drawn from the cited evidence, inference clearly labelled 'Assessed:' rather than asserted as established fact, and concrete indicators that would actually confirm or refute the read. Penalize unwarranted certainty about a coup/resignation/upset."},
      {"name": "severity_calibration",
       "weight": 0.25,
       "description": "Do the stated confidence and the single severity tag match the strength of the cited evidence for an imminent transition? Penalize both overconfidence and under-confidence."}
    ], "scale": "0.0-1.0"}
