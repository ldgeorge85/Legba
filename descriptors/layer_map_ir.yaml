apertures:
- layer: official
  declared: present
  reason: 'curated: source.irna.english (active) and source.presstv.english (paused) are both
    Iran''s own state outlets, geo-scoped to IR — the official layer is populated for this
    country.'
- layer: domestic_press
  declared: absent
  reason: 'curated: absent, both grounds apply and are stated separately — structurally, Iran
    has no independent domestic press able to operate (state licensing/censorship suppresses
    it) so the layer is genuinely thin inside the country; and separately, we carry zero domestic_press-class
    sources scoped to IR in descriptors/source_*.yaml (no entry in this map is domestic_press)
    — declared absent rather than unmeasured, per docs/LAYERS.md''s warning that a missing
    layer must never read as silent agreement.'
- layer: foreign_press
  declared: present
  reason: 'curated: present and dense — Al Jazeera, BBC, DW, Middle East Eye, RFE/RL, Guardian,
    Euronews, France24, plus the AP wire copy (rsshub.apnews.world) and defense/energy/maritime
    trade press all carry Iran coverage; none is IR-geo-scoped in its own descriptor (they
    are global/foreign-based outlets), which is exactly the foreign_press reading.'
- layer: social_digest
  declared: present
  reason: 'curated: present but thin — source.telegram.org_channels curates "Irna_en" (IRNA''s
    own Telegram channel), so a social_digest row exists for IR, but it echoes the state voice
    already captured under official rather than adding independent civil-discourse monitoring;
    source.discord.default is unconfigured (no real server/channel yet) and adds nothing today.
    Declared present because a curated source does exist, not because the layer is substantively
    independent — see the entry-level doubt on both sources.'
- layer: public_data
  declared: present
  reason: 'curated: present — ACLED conflict events, OpenSanctions (api+bulk), UN press/news
    (world, Middle East, peace & security desks), WHO outbreak news, ReliefWeb, WTO, ISW assessments,
    DFRLab, EU vs Disinfo, GDELT, Common Crawl, Firecrawl and the generic webhook are all
    global/structured feeds with no single-country scope, and Iran is a subject in several
    of them (ACLED events, OpenSanctions designations, UN/WHO reporting) — the layer applies
    the same way it does for every country.'
- layer: physical
  declared: present
  reason: 'curated: present — source.usgs.earthquakes is a global model-free GeoJSON hazard
    feed; Iran sits on active seismic belts (Alborz/Zagros), so this layer is not merely structurally
    included but meaningfully applies to this country.'
