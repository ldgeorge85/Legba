# sources_2026_11_13 — SourceDescriptor. RETIRED 2026-11-14 (roll 84; listed in
# descriptors/RETIRED.md): never produced a signal — the general site feed,
# keyword-gated to nothing — and a search found no procurement-specific feed.
#
# Bundeswehr — the site's one public RSS feed (bundeswehr.de, German), gated
# to procurement and equipment items. THIS IS THE GENERAL SITE FEED
# (service/rss/de/517054/feed), not a procurement feed: BAAINBw (the federal
# procurement office) publishes its news on bundeswehr.de and has no feed of
# its own, and no procurement-specific feed is known anywhere in this repo
# (lane N-R checked descriptors/, scripts/ and planning/ on 2026-11-13; the
# only other Bundeswehr-side feed is the ministry's, source_bmvg_news). The
# site feed also carries recruiting, history and shop items, so the per-feed
# keyword gate keeps only items that name procurement, contracts, equipment or
# the office (case-insensitive; a dropped item still advances the cursor once).
#
# N-R (2026-11-13): zero signals since registration — the whole-word gate
# missed German compounds ("Beschaffungsamt", "Rüstungsindustrie",
# "Haushaltsausschusses"). Terms now use the keyword gate's per-term partial
# match: a `*` at an end of a term drops the word boundary there ("*beschaff*"
# = substring, "Haushaltsausschuss*" = prefix). Terms starting with `*` are
# QUOTED (a bare *x is a YAML alias).
# Probed 2026-11-13 through the platform's guarded fetcher with the handler's
# default client identity: HTTP 200, application/rss+xml, 10 items spanning
# ~4 days, dated pubDates (+0100), no challenge.
identity:
  id: source.bundeswehr.procurement
  name: Bundeswehr — Ausrüstung und Beschaffung (BAAINBw)
  kind: rss
  schema_uri: legba/source/1.0.0
  version: "0000000000000000"        # placeholder — registry stamps content hash
  abstraction_level: L1
  state: retired
  owner: sources_2026_11_13
  created: "2026-11-13T00:00:00Z"

scope:
  owner_tenant: shared
  geo: [DE]
  languages: [de]
  tags: [gov, defense, procurement, germany, sources_2026_11_13]
  source_class: official
  access_class: public          # free no-auth feed, no separate reuse agreement

acquisition: poll

cadence:
  schedule:
    factory_kind: cron
    raw: "19 */3 * * *"
  cooldown_seconds: 60
  jitter_seconds: 30

config:
  url:
    factory_kind: text
    raw: "https://www.bundeswehr.de/service/rss/de/517054/feed"
  keyword_include:
    factory_kind: list
    item_kind: text
    raw: [BAAINBw, "*beschaff*", "*rüstung*", "*vertrag*", "*verträge*", Auftrag, Aufträge, "Auftragsvergabe*", "Haushaltsausschuss*", "25-Millionen-Euro-Vorlage*", Koblenz]

pipeline:
  ingestion_filters:
    - kind: dedupe_tier_1            # URL-canonical hash
      config: {}
    - kind: dedupe_tier_2            # SHA-256 content hash
      config: {}
  enrichment:
    # language_detect FIRST so ner_multilingual uses the detected language.
    # No fact_extractor (the conservative default of the official-feed drafts).
    - kind: language_detect
      config: {}
    - kind: ner_multilingual
      config: {}
    - kind: geocode
      config: {}
  media: reference

deps: {}

output:
  retention: interest
  max_age_seconds: 604800
  delivery: lossy

subscription_policy: open
