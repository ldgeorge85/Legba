# screen_stopwords: the geopolitics nouns of the stage-1 title screen's
# stoplist (the platform half — function words, the absence vocabulary, the
# reporting verbs — stays in absence_slice._ABSENCE_SCREEN_STOPWORDS, which is
# that half united with this one). A set.
screen_stopwords: ["country", "countries", "state", "states", "government", "governmental", "national", "international"]

# classifier_patterns: declared title classifiers. machine_structured_title is
# the GDELT/CAMEO event-coding SHAPE (was _CAMEO_TITLE_RE): an ALL-CAPS
# actor (optionally two, joined by <->), a colon, then a LOWERCASE action verb.
# Compiled with no flags.
classifier_patterns:
  machine_structured_title: |-
    ^\s*[A-Z][A-Z0-9 .,'’()&/\-]{1,}(?:<->\s*[A-Z0-9 .,'’()&/\-]+)?:\s+[a-z]

