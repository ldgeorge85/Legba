# reason "derived:" and every aperture `unmeasured`). Curation is the
# layer's bias (docs/LAYERS.md): every entries[].reason below is now either
# "curated: ..." (a per-country judgement was made and is explained) or the
# original "derived: ..." with " — confirmed" appended (the derived layer
# was checked against this country's information environment and is
# right). All six apertures are declared present/absent/unmeasured — never
# left at the generator's blanket unmeasured; an `absent` declaration
# always carries a reason (schema-enforced) so a missing layer never reads
# as silent agreement.

