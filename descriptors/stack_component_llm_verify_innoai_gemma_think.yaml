# THE BAKE-OFF GOLD DRAFTER — Gemma 4 with thinking ON behind the innoai
# gateway (kind: llm_provider). DRAFT.
#
# planning/reviews/BAKEOFF_DESIGN.md v1.1 §4.4 (2026-11-05): "Gemma 4 with
# thinking on (gateway alias `gemma-think`) drafts gold through the governed
# web pack; Gemma is the faithfulness judge, not a grader, and the operator
# verifies and signs every gold row." v1.0 named Mistral Medium 3.1 through
# OpenRouter, a route retired on 2026-10-23. The gold builder NEVER grades and
# the grader never builds gold: the primary grader is Nemotron Lightning
# (`llm.judge.innoai_lightning_think.openai_compat`), the second rater the
# operator.
#
# A MIRROR of `stack_component_llm_verify_innoai_gemma.yaml` — the same
# gateway, key, concurrency and tier — with two differences: `model_name` is
# the `gemma-think` alias (the `gemma` alias is thinking OFF, which suits a
# judge's short verdict and not a gold draft that weighs sources), and the
# output and stall allowances are the thinking judge's
# (`llm.judge.innoai_lightning_think.openai_compat`: 16384 / 240 s), because a
# thinking model spends tokens and time before its first answer token.
#
# Its own component so the verify judge's `gemma` head is untouched: the judge
# chain, the consult judge and the bearing gate keep reading the think-off
# alias. Nothing binds this id until the operator activates it for the
# bake-off's gold step (scripts/bakeoff/README.md) and retires it after.
#
# NAMING IS LOAD-BEARING: the id ends in `.openai_compat` so
# `infer_llm_subprovider` routes it to the vLLM handler (Chat Completions +
# Bearer). FAMILY `google_gemma`, declared in `GRADER_FAMILY_BY_COMPONENT`
# (src/legba/runtime/external_grader_route.py) — the fence therefore refuses it
# as a grader beside the Gemma judge, which is the design's rule.
# PRICE: our own box behind the gateway — $0 per token (no list price).
id: llm.verify.innoai_gemma_think.openai_compat
name: Gemma 4, thinking on, via the innoai gateway (bake-off gold drafter)
schema_uri: legba/stack/llm_provider/1.0.0
version: "0000000000000000"
state: draft
owner: lewis@local
config:
  api_endpoint:
    factory_kind: text
    raw: https://api.innoai.net/v1
  # VAULT REF — the gateway token, the same secret id every gateway component
  # reads; never the plaintext.
  api_key:
    factory_kind: secret
    raw: llm.innoai.api_key
  model_name:
    factory_kind: text
    raw: gemma-think
  max_tokens:
    factory_kind: number
    raw: 16384
  timeout_seconds:
    factory_kind: number
    raw: 240
  tier:
    factory_kind: dropdown_static
    raw: cheap
    options: [primary, fallback, cheap]
  max_concurrent:
    factory_kind: number
    raw: 8
