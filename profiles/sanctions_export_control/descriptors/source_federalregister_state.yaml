#
# Sanctions / export-control profile SKELETON (PROFILE-1; DEC-11; Review B §1.2 F1).
# From the source annex planning/DOMAIN_EXPANSION_SOURCES_2026-07-03.md (crime
# section), verified there 2026-07-03 and NOT re-probed since: the operator
# probes before activating. Ships DRAFT — registering it never schedules it.
# The FTO / SDGT leg (US public domain); the agency publishes far more than designations — the regime predicate narrows.

identity:
  id: source.federalregister.state
  name: "Federal Register — State Department documents"
  kind: json_api
  schema_uri: legba/source/1.0.0
  version: "0000000000000000"        # placeholder — registry stamps content hash
  abstraction_level: L1
  state: draft
  owner: profile_sanctions_export_control
  created: "2026-10-04T00:00:00Z"

scope:
  owner_tenant: shared
  geo: [US]
  languages: [en]
  tags: [sanctions, designation, gov, federal_register]
  source_class: official
  access_class: public

acquisition: poll

cadence:
  schedule:
    factory_kind: cron
    raw: "29 */6 * * *"
  cooldown_seconds: 60
  jitter_seconds: 30

config:
  # Federal Register API v1 document search: {"results": [{document_number,
  # title, html_url, publication_date, abstract, ...}]}.
  url_template:
    factory_kind: text
    raw: "https://www.federalregister.gov/api/v1/documents.json?conditions%5Bagencies%5D%5B%5D=state-department&per_page=20&order=newest"
  items_path:
    factory_kind: text
    raw: "results"
  id_path:
    factory_kind: text
    raw: "document_number"
  title_path:
    factory_kind: text
    raw: "title"
  url_path:
    factory_kind: text
    raw: "html_url"
  timestamp_path:
    factory_kind: text
    raw: "publication_date"
  body_path:
    factory_kind: text
    raw: "abstract"
  language:
    factory_kind: text
    raw: "en"
  max_items_per_pull:
    factory_kind: number
    raw: 20

pipeline:
  ingestion_filters:
    - kind: dedupe_tier_1            # URL-canonical hash
      config: {}
    - kind: dedupe_tier_2            # SHA-256 content hash
      config: {}
  enrichment:
    - kind: language_detect
      config: {}
    - kind: ner_multilingual
      config: {}
  media: reference

deps: {}

output:
  retention: interest
  max_age_seconds: 86400
  delivery: lossy

subscription_policy: open
