# Shared SourceDescriptor: source.gdelt.doc_api — keyless GDELT via the DOC
# 2.0 HTTP API (S-3 json_api kind).
#
# The no-billing GDELT alternative: the existing `gdelt_query` kind reaches
# GDELT through BigQuery (GCP service account + scan billing); this descriptor
# reaches the same corpus through the free, keyless DOC 2.0 full-text API.
#   Docs: https://blog.gdeltproject.org/gdelt-doc-2-0-api-debuts/
#
# `timespan=1h` makes the API itself window the results (matched to the */30
# cadence with overlap), so no cursor substitution is needed in the URL — the
# handler's own window filter (`seendate` via timestamp_path) plus downstream
# content-hash dedupe absorb the overlap. `seendate` arrives in GDELT's
# compact `YYYYMMDDTHHMMSSZ` form, which the handler parses natively.
#
# NOTE: `sourcecountry` in artlist responses is a country NAME (not an ISO
# code), so geo_path is deliberately NOT mapped — the geocode baseline filter
# owns geo enrichment.
#
# Example descriptor — NOT registered by any bringup script. Register
# explicitly via the registry API / DescriptorRegistry when wanted.

identity:
  id: source.gdelt.doc_api
  name: GDELT — DOC 2.0 API (keyless world news)
  kind: json_api
  schema_uri: legba/source/1.0.0
  version: "0000000000000000"        # placeholder — registry stamps content hash
  abstraction_level: L1
  state: active
  owner: source_bringup
  created: "2026-06-09T00:00:00Z"

scope:
  owner_tenant: shared
  geo: []
  languages: [en]
  tags: [news, world, geopolitical, global, conflict]
  source_class: reporting          # S1-T8 — news-derived event/full-text aggregator

acquisition: poll

cadence:
  # */30 with timespan=1h upstream → every article is seen by ~2 polls;
  # ingest dedupe collapses the overlap to one canonical signal.
  schedule:
    factory_kind: cron
    raw: "*/30 * * * *"
  cooldown_seconds: 60
  jitter_seconds: 30

config:
  url_template:
    factory_kind: text
    raw: "https://api.gdeltproject.org/api/v2/doc/doc?query=(conflict%20OR%20disaster%20OR%20protest)%20sourcelang:english&mode=artlist&format=json&maxrecords=100&timespan=1h"
  items_path:
    factory_kind: text
    raw: "articles"
  id_path:
    factory_kind: text
    raw: "url"
  title_path:
    factory_kind: text
    raw: "title"
  url_path:
    factory_kind: text
    raw: "url"
  timestamp_path:
    factory_kind: text
    raw: "seendate"
  modality:
    factory_kind: text
    raw: "text"
  max_items_per_pull:
    factory_kind: number
    raw: 100
  language:
    factory_kind: text
    raw: "en"

pipeline:
  ingestion_filters:
    - kind: dedupe_tier_1            # URL-canonical hash
      config: {}
    - kind: dedupe_tier_2            # SHA-256 content hash
      config: {}
  enrichment:
    - kind: language_detect
      config: {}
    - kind: ner_multilingual
      config: {}
    - kind: geocode
      config: {}
  media: reference

deps: {}

output:
  retention: interest
  max_age_seconds: 86400
  delivery: lossy

subscription_policy: open
