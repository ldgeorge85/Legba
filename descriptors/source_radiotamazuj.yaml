# Draft SourceDescriptor. Ships DRAFT;
# the reference host walks it to CONFIGURED (descriptors/LIFECYCLE.md), never
# active — activation is the operator's call per source.
#
# Radio Tamazuj — independent South Sudanese news outlet (English edition).
# Fills the South Sudan gap (no South Sudanese outlet in the tree).
# Checked (one GET, generic client
# identity): HTTP 200, application/rss+xml, 12 items, newest 2026-11-14 19:24
# UTC, oldest 2026-11-13 18:20 — about 10 items a day, so the feed window is
# roughly one day. Every two hours keeps inside it.
#
# Class: reporting. Language: en. Region: South Sudan — the declared SS is
# the publisher-origin FALLBACK only, applied when the in-body geocoder
# resolves no country.
#
# robots.txt allows
# the feed path for `*`. Credibility: radiotamazuj.org 0.72 / wire.
#
# First poll: the default first-poll age cap (30 days).

identity:
  id: source.radiotamazuj.news
  name: Radio Tamazuj (South Sudan)
  kind: rss
  schema_uri: legba/source/1.0.0
  version: "0000000000000000"        # placeholder — registry stamps content hash
  abstraction_level: L1
  state: draft
  owner: owner@local
  created: "2026-11-14T00:00:00Z"

scope:
  owner_tenant: shared
  geo: [SS]
  languages: [en]
  tags: [news, south_sudan, east_africa, africa, independent]
  source_class: reporting
  license_class: cc_by            # publisher grant: republication encouraged, with credit
  attribution: "Radio Tamazuj (radiotamazuj.org)"
  access_class: public            # free no-auth feed, no separate reuse agreement

acquisition: poll

cadence:
  schedule:
    factory_kind: cron
    raw: "19 */2 * * *"
  cooldown_seconds: 60
  jitter_seconds: 60

config:
  url:
    factory_kind: text
    raw: "https://www.radiotamazuj.org/en/rss"

pipeline:
  ingestion_filters:
    - kind: dedupe_tier_1            # URL-canonical hash
      config: {}
    - kind: dedupe_tier_2            # SHA-256 content hash
      config: {}
  enrichment:
    - kind: language_detect
      config: {}
    - kind: ner_multilingual
      config: {}
    - kind: geocode
      config: {}
  media: reference

deps: {}

output:
  retention: interest
  max_age_seconds: 604800
  delivery: lossy

subscription_policy: open
