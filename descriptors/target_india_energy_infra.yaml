# Phase 5a spike target descriptor — india_energy_infra.
#
# Documentation copy of the descriptor exercised by
# tests/runtime/test_spike_integration.py (built programmatically there
# so the test can stamp a placeholder version + content-hash via the
# registry). This file is the operator-readable form for review.
#
# Per legba_descriptor_schemas.md, the target descriptor is the
# "what to watch" half — sources + pipeline + inline analyst handle.

identity:
  id: india_energy_infra
  name: India Energy Infrastructure
  schema_uri: legba/target/2.0.0
  version: "<content-hash stamped at register time>"
  abstraction_level: L1
  state: active
  owner: phase5a_spike

scope:
  geo: [BR]
  languages: [pt-BR, en]
  entity_classes: [organization, corporation]
  predicate: null  # Phase 5a skips Starlark eval; subscription filters
                   # use direct WHERE clause on target_id.

sources:
  - id: epe_rss
    kind: rss
    config:
      url: { factory_kind: text, raw: "https://www.mnre.gov.in/feed" }
    schedule: { factory_kind: cron, raw: "*/15 * * * *" }
    enabled: true

  - id: gdelt_br_energy
    kind: gdelt_query
    config:
      cameo_country: { factory_kind: text, raw: "IN" }
      actor_filter: { factory_kind: text, raw: "ENERGY|UTIL" }
      bq_credentials_secret:
        { factory_kind: text, raw: "gcp.bigquery.legba_497003.service_account" }
    schedule: { factory_kind: cron, raw: "0 */1 * * *" }
    # Disabled in the spike — running it every hour burns BigQuery
    # credits. Real prod-cutover enables this.
    enabled: false

# S5 PILOT — allow the `substrate_read` read pack on this target so its inline
# assessor (india_energy_inline) can run the agentic GATHER phase. This is the
# per-target opt-in: a target opts INTO mid-run substrate investigation by
# listing the read pack here. Effective capability is the three-way intersection
# analyst.action_packs ∩ target.allowed_action_packs ∩ pack.applicability.
allowed_action_packs:
  - pack_id: substrate_read

pipeline:
  ingestion_filters:
    - kind: language_detect
      config: {}
    - kind: dedupe_tier_1   # URL-canonical hash
      config: {}
    - kind: dedupe_tier_2   # SHA-256 content hash
      config: {}

analyst:
  use: inline_target
  cadence:
    fallback_schedule: "*/10 * * * *"
  method:
    kind: llm_planner
    llm:
      primary: llm.primary.openai_compat

outputs:
  - kind: a2a_skill
    config:
      skill_id: intelligence.india_energy_assessment
