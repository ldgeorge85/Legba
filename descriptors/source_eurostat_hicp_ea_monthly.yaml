# I-5 series-kind capabilities (2026-11-14) — Eurostat's HICP all-items annual
# rate of change for the euro area (dataset prc_hicp_manr, coicop CP00,
# geo EA), monthly, as a SERIES. Ships DRAFT; the reference host walks it to
# CONFIGURED (descriptors/LIFECYCLE.md), never active — activation is the
# owner's call. Kind: series_api, `format: jsonstat`.
#
# WHY: euro-area inflation (the review's row 2, "add"). X-1 could not write
# it: the API answers in JSON-stat (a dimension/value cube), which no reader
# took; I-5's closed JSON-stat 2.0 reader turns each cell into a row whose
# fields are the dimension ids (category codes), `value` and `status`.
#
# THE ENDPOINT. Eurostat dissemination API,
# /api/dissemination/statistics/1.0/data/prc_hicp_manr with geo=EA,
# coicop=CP00 and lastTimePeriod (the review's parameters; it asked for 1 and
# 2 periods, this asks for 24). Checked 2026-11-14 by the source-expansion
# review (two GETs, generic client identity): 200, application/json, ~3.1 KB;
# the checker recorded the first eight top-level keys — version, class,
# label, source, updated, value, id, size — i.e. a JSON-stat dataset. The
# reader refuses anything but `class: dataset`, version 2.0, and refuses a
# cube over 500 cells (this query is about 24). The time dimension is read as
# `time` with codes YYYY-MM (the API's documented monthly form; a code in any
# other form is skipped, never re-read another way, and the first poll's
# health detail counts it). Only `coicop` (a query parameter, so certainly a
# dimension) is filtered on; the provider's status flag (e.g. `p`
# provisional, `e` estimated) rides as provenance.
#
# SUBJECT. The euro area as Eurostat codes it (`EA`, changing composition),
# subject_kind `entity` (a currency union is not a country). UNIT: percent
# (annual rate of change). Flash estimate ~end of month, full release
# mid-month: a daily poll re-reads 45 + 400 days, so a revised month is a new
# vintage and an unchanged re-read writes nothing. A monthly series is always
# `insufficient` under series_change's daily band; no rule is proposed for it
# (whether a new print is itself an event is the owner's call).
#
# robots.txt allows the path for `*`. Class: official (the EU statistical
# office).

identity:
  id: source.eurostat.hicp_ea_monthly
  name: Eurostat — HICP all items, annual rate of change, euro area, monthly (series)
  kind: series_api
  schema_uri: legba/source/1.0.0
  version: "0000000000000000"        # placeholder — registry stamps content hash
  abstraction_level: L1
  state: draft
  owner: i5_series_kind_capabilities
  created: "2026-11-14T00:00:00Z"

scope:
  owner_tenant: shared
  geo: []
  languages: [en]
  tags: [inflation, prices, macro, statistics, series, eu]
  source_class: official
  license_class: open_gov_attribution   # reuse authorised, source acknowledged
  attribution: "Source: Eurostat, prc_hicp_manr (HICP — monthly data, annual rate of change)"
  access_class: public

acquisition: poll

cadence:
  schedule:
    factory_kind: cron
    raw: "47 10 * * *"            # daily, after the 11:00 CET release slot
  cooldown_seconds: 3600
  jitter_seconds: 120

config:
  url:
    factory_kind: text
    raw: "https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/prc_hicp_manr"
  params:
    factory_kind: list
    raw:
      - ["geo", "EA"]
      - ["coicop", "CP00"]
      - ["lastTimePeriod", "24"]
  format:
    factory_kind: text
    raw: jsonstat
  jsonstat_max_cells:
    factory_kind: number
    raw: 500
  date_field:
    factory_kind: text
    raw: time
  date_format:
    factory_kind: text
    raw: year_month
  provenance_fields:
    factory_kind: list
    raw: [status]
  outputs:
    factory_kind: list
    raw:
      - series: eurostat.hicp.annual_rate_all_items
        value_field: value
        subject_field: geo
        where:
          - {field: coicop, values: [CP00]}
        unit: percent
        period: month
        subject_kind: entity
        methodology_version: eurostat-prc-hicp-manr-cp00/1
  lag_days:
    factory_kind: number
    raw: 45
  revision_days:
    factory_kind: number
    raw: 400
  backfill_days:
    factory_kind: number
    raw: 730

sink:
  family: observation
  config:
    series:
      - id: eurostat.hicp.annual_rate_all_items
        field: value
        unit: percent
        period: month
        subject_kind: entity
        methodology_version: eurostat-prc-hicp-manr-cp00/1
        description: "HICP all items (CP00), annual rate of change, per cent, monthly (subject = Eurostat geo code; EA = the euro area, changing composition)"

pipeline:
  ingestion_filters: []
  enrichment: []
  media: reference

deps: {}

subscription_policy: open
