# consult_bakeoff_raw: the bake-off's ARM B (DRAFT).
#
# Arm B — frontier consult over the
# RAW corpus (six source readers, nothing derived). A consult_on_demand analyst
# that grants exactly ONE read pack, substrate_read_raw, and nothing else: the
# runtime then binds the consult kind's governed read binding over that pack
# (dapr_host, via data/analysts/consult_bakeoff.consult_read_pack_for), the loop
# offers only that pack's tools, and the system prompt is the arm's own variant
# (data/analysts/consult_bakeoff_prompts.RAW_SYSTEM_PROMPT) — it does NOT order
# list_findings first.
#
# NOT the stock consult: a run of consult_default is labelled B* by the harness
# and excluded from the primary analysis.
#
# Invoked ONLY by scripts/bakeoff/run_arm.py, directly on the actor
# (analyst::consult_bakeoff_raw::<version[:16]>), never through the registry's
# consult front door (which invokes LEGBA_CONSULT_ANALYST_ID). The harness sends
# the frontier plane as the per-request llm_component_override
# (llm.anthropic.opus_4_7 — the same allowlist the front door uses) and the
# bakeoff_meter that arms the per-question hard stop. The primary below is the
# free core plane, so an invoke without the override never bills.
#
# method.options: watch candidates are NOT minted (a bake-off answer must not
# seed the platform's standing watches); the context ceiling is the 160,000-token
# figure the option catalogue names for the Anthropic planes.
#
# No outputs block: the arm is reached by its actor id only (no A2A skill, no MCP
# tool). budget_tokens_per_day 0 (house rule): the spend stop is the harness's.
#
# DRAFT. NOT in scripts/bringup_register_analysts.py. The operator registers and
# activates it for the bake-off window through the audited lifecycle and
# retires it after.

identity:
  id: consult_bakeoff_raw
  name: Bake-off arm B — consult over the raw corpus
  schema_uri: legba/analyst/1.0.0
  version: "0000000000000000"        # placeholder — registry stamps content hash
  kind: consult_on_demand
  type_signature:
    input_type: legba.runtime.ConsultQuestion
    output_type: legba.runtime.ConsultResponse
  state: draft
  owner: owner@local

subscription:
  substrate:
    direct_queries: true

mapping:
  fields: []
  schema_drift_policy: warn_and_continue

method:
  kind: react_loop
  prompt_module: legba.prompts.consult_on_demand.v1
  llm:
    primary:
      factory_kind: stack_ref
      raw: llm.primary.openai_compat
      expected_family: llm_provider
    max_tokens: 32768
  # A consult runs ONCE: the actor's default transient retry would re-run the
  # WHOLE consult from scratch on the same request id (re-spending every round
  # and tool call unasked). Its failure (or its partial answer) goes to the
  # operator, who decides whether to ask again. A paid bake-off question runs
  # once too — a re-run would bill the question twice under one hard stop the
  # harness cannot see.
  retry:
    transient:
      max_attempts: 1
  budget_tokens_per_day: 0
  options:
    mint_watch_candidates: false
    context_ceiling_tokens: 160000

cadence:
  cooldown_seconds: 0

action_packs:
  - pack_id: substrate_read_raw
