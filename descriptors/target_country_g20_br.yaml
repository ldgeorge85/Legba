# target country_g20_br — the live head, folded into the tree.
# It was registered by scripts/bringup_register_g20_country_targets.py (synthesised from iso_countries) + scripts/bringup_tag_targets.py (region/applicability tags);
# scripts/bringup_register_descriptors.py now registers this file and nothing else does.
# identity.version is the 16-zero placeholder: the registry stamps the content hash.
# The live head also carries an inline `analyst:` block (analyst_ref null). It is
# dead config: the runtime never reads it (it has been removed from every repo
# target file). This file leaves it out, so the bring-up dry-run reports this head as
# would-update with that one difference until the block is dropped live.
#
# New-model G20 country target (also the example / documentation copy of the G20 country shape).
#
# This is the operator-readable shape of ONE materialised G20 country target.
# scripts/bringup_register_g20_country_targets.py synthesises all 19 of these
# (one per G20 ISO-3166-1 alpha-2 code, read from the iso_countries seed table)
# with per-country id / scope.geo / scope.languages substituted.  Brazil (BR)
# is the worked example here.
#
# THE WHOLE POINT (PIVOT §4.4): this target owns NO inline sources.  It wires
# to the shared global-news SourceDescriptors (source.bbc.world /
# source.aljazeera.world / source.dw.world) by a PREDICATE source_selector
# (tags=[news] + kinds=[rss]), then narrows the shared raw pool to Brazil via
# a per-target Subscription.geo + predicate.  No per-target source duplication:
# 19 targets share 3 source connections, not 57.
#
# This is also the fix for the live duplicate-findings issue: ONE correctly
# geo-scoped analyst per target, via the desk-unit analyst descriptors'
# `subscription.targets` predicate (`has_tag("g20")` / `has_tag("watch")` —
# see descriptors/analyst_energy_security.yaml et al.), instead of one
# brazil-scoped analyst fanning out across every country (the old
# brazil-analyst-on-all-countries bug) plus the stray
# india_energy_inline_critic_test.
#
# Dead config: this descriptor used to ALSO carry
# an inline `analyst:` block, believed to be what ran the per-country
# assessor. It never did — the runtime never builds a running analyst from a
# target's inline `method`/`cadence`/`grounding`/`rubric` config; only
# `analyst.analyst_ref` (a pointer to a separately registered analyst
# descriptor) is ever consulted by
# legba.runtime.source_first_runtime._analyst_ids_for_target, and this block
# never set one. The actual per-country coverage was always the `g20` scope
# tag matched by the desk-unit analysts' `subscription.targets` predicate
# above, not this block. Removed; the registry now warns loudly at
# registration time if a target body still carries one
# (legba.data.registry.descriptor._validate_or_dlq).
