# THE DECISION MODEL ON THE BOX — the gateway's typed-choice model
# (kind: llm_provider, wire: POST {api_endpoint}/decide).
#
# The decision model is not a chat model: it answers TYPED questions about a
# free-text state ({"state", "questions": {id: {type: choice, instructions,
# criteria}}} → {"answers": {id: {choice, confidence, probabilities}}}), in
# ≈ 0.3 s, contract verified live. Its first job is a SHADOW: the
# claim_watch bearing gate (`bearing_shadow_ref`) asks it the same per-edge
# yes/no the gate asks its chat judge, and the pair lands in
# `decision_shadow_ledger` (migration 0238) so agreement and calibration can be
# measured before it decides anything. It moves no edge.
#
# NAMING IS LOAD-BEARING: the id contains `.decide.` so `infer_llm_subprovider`
# routes it to the decision client (src/legba/data/stack/llm/decide.py — Bearer
# auth, /v1/decide, typed errors, max_concurrent), never to the chat handler.
# FAMILY: `decision_model`, declared in GRADER_FAMILY_BY_COMPONENT
# (src/legba/runtime/external_grader_route.py); the schema is extra=forbid.
# PRICE: our own box behind the gateway — $0 per token.
id: llm.decide.gateway_typed_choice
name: Decision model via the model gateway (typed choice; bearing gate)
schema_uri: legba/stack/llm_provider/1.0.0
version: "0000000000000000"
state: draft
owner: owner@local
config:
  api_endpoint:
    factory_kind: text
    raw: "${env:LEGBA_GATEWAY_API_ENDPOINT}"
  # VAULT REF — the same gateway token every gateway component uses (registered
  # once by scripts/cutover_gateway.py); never the plaintext.
  api_key:
    factory_kind: secret
    raw: llm.gateway.api_key
  model_name:
    factory_kind: text
    raw: "${env:LEGBA_GATEWAY_DECIDE_MODEL}"
  # No output limit is declared: a decision call generates no tokens.
  timeout_seconds:
    factory_kind: number
    raw: 30
  tier:
    factory_kind: dropdown_static
    raw: cheap
    options: [primary, fallback, cheap]
  # Client-side cap on in-flight calls from ONE process — the gate's own cap,
  # since the shadow mirrors the gate's ≈ 32k calls a week.
  max_concurrent:
    factory_kind: number
    raw: 8
