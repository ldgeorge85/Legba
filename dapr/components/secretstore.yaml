apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: legba-env-secrets
spec:
  # Local environment-variable secret store (P-14). Lets other components
  # resolve credentials via `secretKeyRef` instead of carrying plaintext in
  # committed YAML. The daprd sidecar receives the backing env vars through
  # `env_file: .env` (see docker-compose.yml dapr-sidecar). The actor state
  # store (statestore.yaml) reads its full Postgres DSN — including the
  # password — from LEGBA_DAPR_PG_CONNSTRING via this store.
  #
  # `multiValued: false` keeps the simple KEY=value lookup model: a
  # secretKeyRef `name` maps directly to an environment variable name.
  type: secretstores.local.env
  version: v1
  metadata:
    - name: prefix
      value: ""
