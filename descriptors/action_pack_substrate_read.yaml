# A-3a — substrate_read action pack (review G2 close).
#
# The consult kind's four read tools used to dispatch straight at the
# SubstrateQueryPort, bypassing the agency plane entirely. This pack puts
# them under governance: every consult tool call now runs the full
# resolve ∩ allow ∩ applicability → governor → dispatch → settle pipeline
# and lands in `action_pack_invocations`.
#
# Universally applicable BY DESIGN (no applies_to_tags, no predicate): the
# global consult surface has no target in context, so the runtime binds it
# with a synthetic global scope and a self-allow for THIS pack only (see
# runtime/dapr_host.py — the consult deps resolver). The grant leg stays
# real: an analyst without `action_packs: [{pack_id: substrate_read}]`
# is denied at resolution.
#
# Read-only: the governor caps exist to bound runaway ReAct loops, not
# spend (the tools cost no tokens themselves — the LLM rounds around them
# are bounded separately by the consult round cap + token budget).
#
# Registered via scripts/bringup_register_action_packs.py.

identity:
  id: substrate_read
  name: Substrate Read Tools
  schema_uri: legba/action_pack/1.0.0
  version: "<content-hash stamped at register time>"
  abstraction_level: L1
  state: active
  owner: a3_agency
  created: "2026-06-09T00:00:00Z"

tools:
  - name: search_signals
    config: {}
  - name: query_facts
    config: {}
  - name: inspect_entity
    config: {}
  - name: vector_search
    config: {}
  # S5-T4 — RAG over the curated Lane-4 reference corpora (world_context =
  # country/topic priors + doctrine summaries; tradecraft = analytic standards /
  # SAT handbooks). Embeds the query through the port embedder (S5-T1) and
  # cosine-searches the S5-T2 collections; returns cited chunks with payload
  # metadata. Read-only; BACKGROUND/method knowledge, not live substrate.
  - name: search_context
    config: {}
  # Stage 1 — the OpenSearch full-text corpus readers (index legba_signals_corpus,
  # ~106k signal docs): search_corpus = BM25 lexical keyword search over the WHOLE
  # raw body of every ingested signal (optional keyword facet filters — geo, tags,
  # source_id, language, …); read_document = fetch one signal's full indexed doc
  # (incl full raw_body) by its doc_id. Makes the corpus AGENTIC. Read-only.
  - name: search_corpus
    config: {}
  - name: read_document
    config: {}
  # S4 (Phase 1) richer readers — the agentic assessors investigate rather than
  # one-shot: open signed/typed nexuses, ACH hypothesis rows, a facts∪signals
  # timeline, and a per-target substrate rollup.
  - name: query_nexuses
    config: {}
  - name: query_hypotheses
    config: {}
  - name: get_timeline
    config: {}
  - name: compare_targets
    config: {}
  # P5 / #99 — DB-side recursive-CTE graph traversal over the OPEN nexus graph
  # (cyclic; visited-set guard, max_hops<=3, row caps): ranked signed paths
  # A->...->B, the INDIRECT proxy chains (cut-outs), and the brokers that sit on
  # paths between two camps — so an analyst can pull "the proxy path from A to B"
  # / "the broker between two camps" on demand.
  - name: query_paths
    config: {}
  - name: find_proxy_chains
    config: {}
  - name: query_brokers
    config: {}
  # Palette expansion — the platform's OWN finished intelligence, so an agentic
  # assessor builds on (and reconciles against) prior products instead of
  # re-deriving from the raw signal firehose: recent findings/assessments
  # (effective_confidence folds in the critic), clustered situation frames, and
  # event-volume predictions. Read-only; reuses this pack's kind.
  - name: list_findings
    config: {}
  - name: list_situations
    config: {}
  - name: query_predictions
    config: {}
  # V3/P3 — the decision-time register: "what did Legba believe on date D"
  # (spec §3.4). Read-only; the findings it returns are citable by id.
  - name: belief_as_of
    config: {}
  # V3/P6 — the event surface (spec §6.1): the filtered bounded-occurrence
  # list (lifecycle / geo / entity / time-window / as_of filters) and the
  # one-event dossier (ranked signals, actors with roles, event edges,
  # tracking situations, the lifecycle ledger). Read-only; every id the
  # dossier returns is a citable ref.
  - name: query_events
    config: {}
  - name: inspect_event
    config: {}
  # Navigation readers — consult-surface only (the GATHER assessors don't offer
  # these; an assessor already has its target). They MUST be pack tools anyway:
  # the production consult loop is GOVERNED through this pack, so a tool absent
  # here is blocked as unknown_tool even on the consult path.
  - name: list_targets
    config: {}
  - name: list_sources
    config: {}
  # 7g-2 — the COLLECTION series reads. HISTORY, not now: the only tools in
  # this pack that read `observations`, the bitemporal store a curated holding
  # loads once and nothing schedules. Read-only; every row carries its valid
  # period, its record time and the sha256 of the file the number came from.
  - name: series_history
    config: {}
  - name: series_compare
    config: {}

prompt_fragments:
  - >-
    Query the substrate before answering: search_signals for full-text,
    query_facts for the fact store, inspect_entity for entity profiles,
    vector_search for semantic similarity. Cite returned UUIDs.
  - >-
    For real-world occurrences: query_events lists bounded events (filter
    by target, geo ISO2, category, lifecycle_state, actor, or time window —
    it is a thing that HAPPENED, where list_situations is a thing being
    watched); inspect_event returns one event's dossier — ranked evidence
    signals, actors with roles, event edges, tracking situations, and the
    lifecycle ledger. belief_as_of(as_of) reads what Legba believed on a
    date. Every id these tools return is citable.
  - >-
    For the PAST as numbers: series_history(series_id, subject, from, to)
    reads one curated historical series for one subject over a valid-time
    window, and series_compare(series_id, subjects, from, to) reads the same
    series across several subjects in one call. from/to are required and
    bound the period the numbers are ABOUT; the optional as_of bounds the
    provider's RECORD time (which revision had been published by then).
    These rows are HISTORY, never current reporting: a figure valid for 2016
    is never evidence about now, and citing one obliges you to state its
    valid period.

rules:
  - "Never fabricate substrate refs — cite only UUIDs the tools returned."
  - >-
    A number from series_history / series_compare is a HISTORICAL
    observation. State its valid period whenever you use it, and never
    present it as a current value.

governor:
  budget_account: substrate_read
  max_invocations_per_hour: 600
  api_rate_per_minute: 60
