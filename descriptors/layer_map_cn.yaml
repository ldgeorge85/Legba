- layer: foreign_press
  declared: present
  reason: 'curated: dense — BBC, DW, Guardian, Al Jazeera, Euronews, RFE/RL, the RFA whole-service
    feed (China/Tibet/Uyghur-tagged), GDELT, MediaCloud, the AP wire (via rsshub.apnews.world),
    defense/maritime/energy trade press, and more — clearly present.'
- layer: social_digest
