# ---------------------------------------------------------------------------
# subject_homonyms — the homonym class
# ---------------------------------------------------------------------------
# Per subject code: the surface forms that LOOK like the subject but name
# something else (`exclude`), what they actually name (`reads_as`), and forms
# that name the subject beyond the names above (`subject` — a capital, a
# leader). A signal on the desk's code whose text names an excluded form and,
# with those forms cut out, no longer names the subject never enters the desk's
# slice; a finding claim of that shape is flagged `off_subject` by the critic
# and excluded from the correctness grader by name. A form with no lowercase
# letter matches CASE-SENSITIVELY ("SA" is not "sa"). Read by
# src/legba/data/subject_homonyms.py. Every entry below is backed by live
# signals on the code (the 30-day audit in the B6 report); a code with no
# observed collision is NOT listed — a wrong entry would drop real coverage.
subject_homonyms:
  "kp":
    reads_as: ["Khyber Pakhtunkhwa, a province of Pakistan (KP / KPK / K-P in the Pakistani press)"]
    exclude: ["KP", "KPK", "K-P", "Khyber Pakhtunkhwa", "Khyber-Pakhtunkhwa", "Pakhtunkhwa", "Khyber"]
    subject: ["Pyongyang", "Kim Jong Un", "Kim Yo Jong", "KCNA", "Korea", "Korean"]
  "sa":
    reads_as: ["South Africa (SA in the South African press)", "South Australia", "a company's S.A. / SA suffix"]
    exclude: ["SA", "S.A.", "South Australia"]
    subject: ["Saudi", "Riyadh", "Jeddah", "KSA", "Aramco"]
  "gb":
    reads_as: ["Gilgit-Baltistan, a region of Pakistan (GB in the Pakistani press)", "gigabytes / chip names (512GB, GB300)"]
    exclude: ["GB", "Gilgit-Baltistan", "Gilgit Baltistan", "Gilgit", "Baltistan"]
    subject: ["British", "London", "Scotland", "Wales", "Starmer"]
  "ca":
    reads_as: ["California's postal code (NWS alert titles: 'by NWS San Diego CA')"]
    exclude: ["CA"]
    subject: ["Canadian", "Ottawa"]
  "ne":
    reads_as: ["Nebraska's postal code (NWS alert titles)", "Niger State and the Niger Delta (Nigeria)"]
    exclude: ["NE", "Nebraska", "Niger State", "Niger Delta"]
    subject: ["Niamey", "Nigerien"]
  "mx":
    reads_as: ["New Mexico, a US state"]
    exclude: ["New Mexico"]
    subject: ["Mexico City", "Sheinbaum"]
  "ua":
    reads_as: ["the African Union in French copy (l'UA, Union africaine)", "United Airlines"]
    exclude: ["UA", "Union africaine"]
    subject: ["Ukrainian", "Kyiv", "Kiev", "Zelensky", "Zelenskyy"]
  "ge":
    reads_as: ["General Electric / GE Vernova / GE Aerospace", "a general election (GE16 in the Malaysian press)", "the US state of Georgia"]
    exclude: ["GE", "GE Vernova", "GE Aerospace", "GE HealthCare", "Atlanta", "Georgia, US", "Georgia, U.S."]
    subject: ["Georgia", "Georgian", "Tbilisi"]
  "mn":
    reads_as: ["Minnesota's postal code (NWS alert titles)"]
    exclude: ["MN", "Minnesota"]
    subject: ["Mongolia", "Mongolian", "Ulaanbaatar"]
  "pa":
    reads_as: ["Pennsylvania's postal code (NWS alert titles)", "Panama City, Florida"]
    exclude: ["PA", "Pennsylvania", "Panama City, Florida", "Panama City Beach"]
    subject: ["Panama", "Panamanian"]
  "iq":
    reads_as: ["IQ, the intelligence quotient"]
    exclude: ["IQ"]
    subject: ["Iraq", "Iraqi", "Baghdad", "Kurdistan"]
  "dj":
    reads_as: ["DJ (a disc jockey; the DJ Basin in Colorado)"]
    exclude: ["DJ"]
    subject: ["Djibouti", "Djiboutian"]
