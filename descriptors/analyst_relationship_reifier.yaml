# relationship_reifier — the PIECE A reified-typed-Nexus producer (centerpiece).
#
# A META analyst kind (no subscription.targets => single global sweep per tick,
# the meta_synthesizer / situation_clustering precedent). Each tick it:
#   1. reads pending co-mentioned entity pairs from proposed_edges that are not
#      yet reified into an OPEN nexus (+ recent facts as context),
#   2. types each pair via the LLM provider plane (the D2 8B path — typed
#      rel_type + canonical POLARITY sign + intent + channel + intermediary;
#      NEVER litellm), and
#   3. side-writes a `nexus` row per typed pair via the live write_nexus path
#      (valid_from = event time, supersession on a polarity/label change).
#
# The nexus rows are the real output; the per-run FindingPayload summary is the
# cadence receipt (exactly how situation_clustering side-writes situations).
# This is what lights up the dormant structural_balance + graph_mining
# refinement consumers over a SIGNED typed graph (PIECE A light-up).

identity:
  id: relationship_reifier
  name: Reified Typed-Nexus Producer (8B-typed, signed)
  schema_uri: legba/analyst/1.0.0
  version: "0000000000000000"        # registry stamps the content hash
  kind: relationship_reifier
  type_signature:
    input_type: legba.runtime.SignalList
    output_type: legba.runtime.Finding
    deps_type: legba.runtime.deps.StandardDeps
  state: active
  owner: piece_a_nexus_activation

subscription:
  # No `targets` block => META analyst (single global sweep; _cadence_targets
  # returns None). The reifier reads proposed_edges + facts directly via
  # deps.pg_pool (the situation_clustering / hypothesis_lifecycle precedent);
  # it does NOT consume a per-target signal slice.
  other_analysts: []
  substrate:
    direct_queries: true        # reads proposed_edges + facts via deps.pg_pool

mapping:
  fields: []
  schema_drift_policy: warn_and_continue

method:
  # method.kind is a constrained Literal; runtime dispatch is on identity.kind
  # (relationship_reifier). llm_planner matches the single-turn chat_complete
  # typing shape the kind uses (same as the other LLM-bearing kinds).
  kind: llm_planner
  # K-3: this named `legba.prompts.relationship_reifier.v1`, which has never
  # existed — the kind has no DSPy module (no `build_prompt_module`), its
  # prompt is the module-level `_SYSTEM_PROMPT` constant, and
  # `_build_relationship_reifier` never sets `ReifierDeps.system_prompt`, so
  # nothing ever read the string and nothing ever complained. Repointed at the
  # constant the kind actually runs on: behaviour is unchanged (this field is
  # not consumed on this kind's path) and the reference is now true, which is
  # what the registry reference check and the descriptor drift guard require.
  prompt_module: "legba.data.analysts.relationship_reifier:_SYSTEM_PROMPT"
  llm:
    primary:
      factory_kind: stack_ref
      raw: llm.primary.openai_compat
      expected_family: llm_provider
    # ONE typer, on the $0 self-hosted core plane. No failover tier and no
    # escalation ladder: K-G2 measured that gpt-oss-120b agrees with ITSELF on
    # only 79.6% of candidates (Cohen's kappa = 0.589), so no difficulty signal
    # exists to route on and any second model would re-roll ~20% of the graph's
    # edges for nothing. See SINGLE_TYPER_RATIONALE in the kind module.
    max_tokens: 384            # the single-candidate RETRY path's budget; the
                               # batch path computes its own (280/verdict, measured)
    temperature: 0.1
  budget_tokens_per_day: 1000000

  # ── K-G2 throughput + quality dials ──────────────────────────────────────
  # Validated against handler_options.ANALYST_KIND_OPTIONS['relationship_reifier'];
  # anything rejected lands on the run trace rather than failing silently.
  #
  # THE ARITHMETIC (docs/TYPING_BAKEOFF_2026-08-03.md §5, §7.5). Cadence is
  # unchanged at twice daily, so per-run × 2 = per-day:
  #
  #   candidates typed/day   600 × 2                = 1,200
  #   LLM calls/day          1,200 ÷ 12             = 100
  #   accept rate            measured, core 120B    = 46.8%
  #   new edges/day (drain)  1,200 × 0.468          ≈ 562
  #   ai1 GPU/day            1,200 × 2.538 s/edge   ≈ 51 min
  #   tokens/day             1,200 × 557 tok/edge   ≈ 670k  (budget 1,000,000,
  #                                                          33% headroom — NO
  #                                                          budget increase)
  #
  # STEADY STATE is arrival-bound, not cap-bound. Measured qualifying arrivals
  # are ~450/day against ~9,000-12,500 raw:
  #
  #   steady edges/day       450 × 0.468            ≈ 205   ← the target
  #
  # So the cap is sized for the DRAIN and steady state falls out of it: the
  # 12,005-candidate qualifying backlog clears at (1,200 typed − 450 arriving)
  # = 750/day, i.e. ~16 days, after which throughput settles at ~205 edges/day.
  # That is 17× today's measured ~12/day, and the backlog shrinks instead of
  # growing. Today's 80 calls/day produce ZERO edges — every one lands on a dead
  # row (§1) — so the comparison is 205 against 12, not against 80.
  options:
    max_candidates: 600        # per RUN; ×2 runs/day = 1,200 candidates/day
    batch_size: 12             # measured optimum — see §7.2/§7.3
    qualification_bar: 0.42    # ~12,005 qualifying of ~176,000 pending (6.9%)
    min_independent_sources: 2 # hard floor; 92.1% of the pool rests on one
  retry:
    budget:
      strategy: pause_until_next_window

cadence:
  # Twice daily, OFFSET after entity_resolution / the assessors so a fresh
  # proposed_edges sweep is present. Reify is the next hop after resolution.
  #
  # UNCHANGED by K-G2 on purpose. The throughput deficit was never cadence — it
  # was that every run's window contained zero typeable rows (§1). With the queue
  # fixed and the cap raised, two runs a day carry 1,200 candidates on ~51 min of
  # GPU; running more often would add scheduling surface for no additional work,
  # because steady-state throughput is bounded by ~450 qualifying ARRIVALS/day,
  # not by how often the sweep looks.
  fallback_schedule: "45 */12 * * *"
  cooldown_seconds: 39600        # 11h (below the 12h interval)

outputs: []
