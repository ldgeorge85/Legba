# P3-6 Wave-A (A3) — draft SourceDescriptor. Ships DRAFT (operator activates).
#
# ISW campaign assessments via the WordPress REST API (RSS is disabled on the new site — REST is the only route). Escalation unit: RU/UA, CN/TW, Iran. Verified live 2026-07-02 (same-day assessments). Incremental poll via ?after={window_start_iso}.
#
# source_class: analysis. Credibility host understandingwar.org (seeded 0.82/thinktank by the registrar).
# state: draft — bulk registration creates NO live actor; activation
# (draft -> configured -> active) is the operator's after verifying the route live.

identity:
  id: source.isw.assessments
  name: ISW — Assessments (WordPress REST)
  kind: json_api
  schema_uri: legba/source/1.0.0
  version: "0000000000000000"        # placeholder — registry stamps content hash
  abstraction_level: L1
  state: draft
  owner: p3_6_wave_a
  created: "2026-07-27T00:00:00Z"

scope:
  owner_tenant: shared
  geo: []
  languages: [en]
  tags: [analysis, thinktank, escalation, russia, ukraine, wave_a]
  source_class: analysis

acquisition: poll

cadence:
  schedule:
    factory_kind: cron
    raw: "30 2-23/6 * * *"
  cooldown_seconds: 60
  jitter_seconds: 30

config:
  # Standard WordPress REST v2 shape: top-level array; title/excerpt are nested {rendered}. Confident paths — still confirm the live route on activation (draft gate).
  url_template:
    factory_kind: text
    raw: "https://www.understandingwar.org/wp-json/wp/v2/posts?per_page=20&_fields=id,date,link,title,excerpt&after={window_start_iso}"
  items_path:
    factory_kind: text
    raw: ""
  id_path:
    factory_kind: text
    raw: "id"
  title_path:
    factory_kind: text
    raw: "title.rendered"
  url_path:
    factory_kind: text
    raw: "link"
  timestamp_path:
    factory_kind: text
    raw: "date"
  body_path:
    factory_kind: text
    raw: "excerpt.rendered"
  language:
    factory_kind: text
    raw: "en"
  max_items_per_pull:
    factory_kind: number
    raw: 50

pipeline:
  ingestion_filters:
    - kind: dedupe_tier_1            # URL-canonical hash
      config: {}
    - kind: dedupe_tier_2            # SHA-256 content hash
      config: {}
  enrichment:
    # language_detect FIRST so ner_multilingual uses the detected language.
    # No fact_extractor on the draft: the operator adds it after confirming the
    # route yields full article text (mirrors the RSSHub-lane conservative default).
    - kind: language_detect
      config: {}
    - kind: ner_multilingual
      config: {}
    - kind: geocode
      config: {}
  media: reference

deps: {}

output:
  retention: interest
  max_age_seconds: 604800
  delivery: lossy

subscription_policy: open
