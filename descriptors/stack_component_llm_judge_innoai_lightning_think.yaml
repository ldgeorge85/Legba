# THE SECOND JUDGE FAMILY ON THE BOX — Nemotron Lightning, thinking ON
# (kind: llm_provider). Rung 2 of the verify judge chain after
# `llm.verify.innoai_gemma.openai_compat` (LEGBA_JUDGE_CHAIN_DEFAULT): the
# models team measured Lightning at 83.8 on their calibration set and it
# handles the long queued inputs Gemma stalls on (ledger 2026-10-08 21:1xZ);
# "thinking ON" is their recommendation for the judge role. The interlock on
# our adjudicated rows (SEAMS #70) may promote it to rung 1.
#
# THINK ALIAS — the standing rule: NEVER a max_tokens on a think alias. The
# vLLM handler sends none unless LEGBA_LLM_SEND_MAX_TOKENS is set (it is not)
# or a leg opts in per call; `max_tokens` below is the schema's required field
# and the per-call ceiling a leg may ask for, not a wire default.
# FAMILY: `nvidia` (GRADER_FAMILY_BY_COMPONENT). Id ends `.openai_compat` →
# the vLLM handler. $0 lane (our box).
id: llm.judge.innoai_lightning_think.openai_compat
name: Nemotron Lightning (think on) via the innoai gateway — verify judge rung 2
schema_uri: legba/stack/llm_provider/1.0.0
version: "0000000000000000"
state: draft
owner: lewis@local
config:
  api_endpoint:
    factory_kind: text
    raw: https://api.innoai.net/v1
  api_key:
    factory_kind: secret
    raw: llm.innoai.api_key
  model_name:
    factory_kind: text
    raw: lightning-think
  max_tokens:
    factory_kind: number
    raw: 16384
  timeout_seconds:
    factory_kind: number
    raw: 240
  tier:
    factory_kind: dropdown_static
    raw: cheap
    options: [primary, fallback, cheap]
  max_concurrent:
    factory_kind: number
    raw: 4
