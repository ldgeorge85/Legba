# Phase 5a multi-target validation — germany_news.
#
# Mirrors the live post-F-bundle india_energy_infra descriptor: 7-filter
# pipeline (the inline analyst block once carried here was dead config —
# see the Defect C note below; it has been removed).
#
# RSS feed swap note:
#   * Original candidate https://www.dw.com/atom/rss-en-all returns
#     HTTP 404. Swapped for https://rss.dw.com/atom/rss-en-all — DW's
#     dedicated RSS host. Probed from inside legba-legba-runtime-dapr-1
#     — HTTP 200, application/xml, valid Atom 1.0 body.

identity:
  id: germany_news
  name: Germany News
  schema_uri: legba/target/2.0.0
  version: "0000000000000000"   # placeholder — registry stamps content hash
  abstraction_level: L1
  inherits: []
  state: active
  owner: lewis@local
  created: "2026-05-28T00:00:00Z"

scope:
  geo: [DE]
  languages: [de, en]
  # 9-class taxonomy — picked from the seeded vocabulary_entries set;
  # "government" is not seeded so we use "country" as the sovereign-actor
  # node and rely on the 8 institutional/people/place classes around it.
  entity_classes:
    - organization
    - corporation
    - country
    - media_outlet
    - person
    - location
    - political_party
    - international_org
    - infrastructure
  relationship_types: []
  time_horizon_days: 90
  predicate: null
  tags: []

sources:
  - id: germany_news_rss
    kind: rss
    config:
      url:
        factory_kind: text
        raw: "https://rss.dw.com/atom/rss-en-all"
    schedule:
      factory_kind: cron
      raw: "*/15 * * * *"
    enabled: true

pipeline:
  ingestion_filters:
    - kind: language_detect
      config: {}
    - kind: ner_multilingual
      config:
        languages: [de, en]
        default_language: de
    - kind: classify
      config:
        taxonomy_schema: "iglu:legba/event_type/jsonschema/1-0-0"
        use_server_defaults: true
    - kind: source_credibility
      config: {}
    - kind: geocode
      config:
        backend: nominatim
    - kind: dedupe_tier_1
      config: {}
    - kind: dedupe_tier_2
      config: {}

# Defect C (X-1 dead-config, 2026-07-29): an inline `analyst:` block used to
# sit here. The runtime never builds a running analyst from a target's
# inline `method`/`cadence`/`grounding`/`rubric` config — only
# `analyst.analyst_ref` (a pointer to a separately registered analyst
# descriptor) is ever consulted by
# legba.runtime.source_first_runtime._analyst_ids_for_target, and this block
# never set one, so it was fully inert. Removed. Units subscribe to a target
# via a separate analyst descriptor's `subscription.targets` predicate
# instead (e.g. descriptors/analyst_energy_security.yaml's
# `has_tag("g20") or has_tag("watch")` — this target carries neither tag
# today, so it has no live analyst subscriber; that gap is pre-existing and
# out of scope here). The registry now warns loudly at registration time if
# a target body still carries this block
# (legba.data.registry.descriptor._validate_or_dlq).

outputs:
  - kind: a2a_skill
    config:
      skill_id: intelligence.germany_news_assessment
