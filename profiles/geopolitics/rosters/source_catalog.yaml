#
# THE SOURCE CATALOG of the geopolitics exemplar (ROSTER-1): the 46 verified
# no-auth rss / geojson feeds the descriptor walker registers beside the
# descriptor files, with each feed's source_credibility seed. Exemplar DATA
# (planning/PLATFORM_VS_EXEMPLAR_2026-09-29.md §1): the loader that reads it,
# the descriptor builder and the credibility seeding are platform code in
# scripts/bringup_register_source_catalog.py; profile.yaml names this file at
# rosters.source_catalog.
#
# One entry per feed. The keys are CatalogEntry's fields; a key left out takes
# the field's default:
#   language en · geo [] (global) · tier wire · state_affiliation false
#   extra_config {} · enrich_text false · fact_extract false · snapshot false
#   access_class public · cred_score 0.5 · cred_rationale "" · classifications []
#   (W10 TAX-2: <family>:<value> tags of registered families, stamped on
#   every signal the feed writes)
#   source_class (none: derived from tier — thinktank analysis, gov official,
#   else reporting; a state-CONTROLLED outlet says state_media, ROSTER-2)
# An unknown key is refused at load.
#
# License note: feed URLs are facts. Every feed below was probed live by us
# (2026-06-09/10: HTTP GET + feedparser/GeoJSON parse), and
# `python scripts/bringup_register_source_catalog.py --verify` re-probes them.
# Order: crisis/humanitarian, human rights, think tanks, defense/OSINT,
# regional wires, gov/finance, GeoJSON.
#
# tests/data_pkg/test_rosters.py pins the loaded tuple to the frozen copy of
# the code literal this replaced (tests/fixtures/bringup/
# source_catalog_frozen_2026-10-04.json): same entries, same rendered rows.

