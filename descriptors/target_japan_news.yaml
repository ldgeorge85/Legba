# Phase 5a multi-target validation — japan_news.
#
# One of five additional country target descriptors registered alongside
# india_energy_infra to exercise the runtime's multi-target ingestion +
# filter chain at scale. Body shape mirrors the live (post-F-bundle)
# india_energy_infra descriptor: 7-filter pipeline (the inline analyst block
# once carried here was dead config — see the Defect C note below; it has
# been removed).
#
# RSS feed swap note:
#   * Original candidate https://www3.nhk.or.jp/nhkworld/en/news/feeds/
#     returns HTTP 404. Swapped for https://www3.nhk.or.jp/rss/news/cat0.xml
#     (NHK domestic Japanese news, cat0 = "all categories"). Probed from
#     inside legba-legba-runtime-dapr-1 — HTTP 200, application/xml,
#     valid RSS 2.0 body. The scope still declares ja, en because NHK
#     publishes Japanese-language items.

identity:
  id: japan_news
  name: Japan News
  schema_uri: legba/target/2.0.0
  version: "0000000000000000"   # placeholder — registry stamps content hash
  abstraction_level: L1
  inherits: []
  state: active
  owner: lewis@local
  created: "2026-05-28T00:00:00Z"

scope:
  geo: [JP]
  languages: [ja, en]
  # 9-class taxonomy — picked from the seeded vocabulary_entries set;
  # "government" is not seeded so we use "country" as the sovereign-actor
  # node and rely on the 8 institutional/people/place classes around it.
  entity_classes:
    - organization
    - corporation
    - country
    - media_outlet
    - person
    - location
    - political_party
    - international_org
    - infrastructure
  relationship_types: []
  time_horizon_days: 90
  predicate: null
  tags: []

sources:
  - id: japan_news_rss
    kind: rss
    config:
      url:
        factory_kind: text
        raw: "https://www3.nhk.or.jp/rss/news/cat0.xml"
    schedule:
      factory_kind: cron
      raw: "*/15 * * * *"
    enabled: true

pipeline:
  ingestion_filters:
    - kind: language_detect
      config: {}
    - kind: ner_multilingual
      config:
        languages: [ja, en]
        default_language: ja
    - kind: classify
      config:
        taxonomy_schema: "iglu:legba/event_type/jsonschema/1-0-0"
        use_server_defaults: true
    - kind: source_credibility
      config: {}
    - kind: geocode
      config:
        backend: nominatim
    - kind: dedupe_tier_1
      config: {}
    - kind: dedupe_tier_2
      config: {}

# Defect C (X-1 dead-config, 2026-07-29): an inline `analyst:` block used to
# sit here. The runtime never builds a running analyst from a target's
# inline `method`/`cadence`/`grounding`/`rubric` config — only
# `analyst.analyst_ref` (a pointer to a separately registered analyst
# descriptor) is ever consulted by
# legba.runtime.source_first_runtime._analyst_ids_for_target, and this block
# never set one, so it was fully inert. Removed. Units subscribe to a target
# via a separate analyst descriptor's `subscription.targets` predicate
# instead (e.g. descriptors/analyst_energy_security.yaml's
# `has_tag("g20") or has_tag("watch")` — this target carries neither tag
# today, so it has no live analyst subscriber; that gap is pre-existing and
# out of scope here). The registry now warns loudly at registration time if
# a target body still carries this block
# (legba.data.registry.descriptor._validate_or_dlq).

outputs:
  - kind: a2a_skill
    config:
      skill_id: intelligence.japan_news_assessment
