# S1-T9 — shared SourceDescriptor: source.ucdp.ged (kind: ucdp).
#
# UCDP (Uppsala Conflict Data Program) Georeferenced Event Dataset (GED) —
# global organized-violence events (state-based / non-state / one-sided),
# one row per lethal event with geo (lat/long + country + admin), the two
# conflict sides, violence type, and best/high/low fatality estimates.
# Handler: src/legba/data/sources/ucdp.py (UCDPSourceHandler, config schema
# UCDPConfig). Structured records → one Signal per event. Feeds the escalation
# (U5) + military_posture (U6) bounded units.
#
# KEYED — TOKEN-GATED: UCDP now requires a free access token (introduced to
# protect the service from bot traffic). The token rides EVERY request as the
# HTTP header `x-ucdp-access-token` (per https://ucdp.uu.se/apidocs/). LICENSE:
# UCDP data is CC BY 4.0 (free reuse WITH attribution) — attribute "Uppsala
# Conflict Data Program (UCDP)" on any external re-export.
#
# PAUSED until the token lands (S-2 keyed convention):
#   * identity.state is DRAFT. Draft descriptors register fine in bulk but get
#     NO live actor (runtime/dapr_host.py: "draft/configured — no live actor
#     wanted"), so a token-less rig stays healthy with this file committed and
#     the handler never 401-spams. (The deploy-hygiene pass keeps the LIVE
#     descriptor paused until a token is loaded.)
#   * config.access_token_secret is a VAULT REF (a credential_id, never the
#     plaintext). At pull time the handler resolves it via
#     SourceContext.secrets_resolve → CredentialVault.resolve and sends it as
#     the `x-ucdp-access-token` header. With NO token configured the handler
#     degrades cleanly (skips the pull, records "ucdp: no token configured").
#
# OPERATOR FLIP (to go live once the token arrives):
#   1. Store the token (request one at https://ucdp.uu.se/apidocs/):
#        POST {registry}/api/v1/registry/vault/secrets
#             {"secret_id": "source.ucdp.access_token", "plaintext": "<token>"}
#      (or set LEGBA_UCDP_ACCESS_TOKEN in the runtime env for a quick bring-up;
#      the vault ref takes precedence over the env var).
#   2. Register/refresh this descriptor through the source registrar.
#   3. Transition draft → configured → active:
#        POST {registry}/api/v1/registry/descriptors/source/source.ucdp.ged/transition
#             {"to_state": "configured"}   then   {"to_state": "active"}
#
# REGISTER (standalone descriptor — same path ACLED/USGS use):
#   POST {registry}/api/v1/registry/descriptors/source  (body = this YAML)
# or add "source_ucdp_ged.yaml" to a descriptor-file registrar and re-run it.

identity:
  id: source.ucdp.ged
  name: UCDP — Georeferenced Event Dataset (Conflict Events)
  kind: ucdp
  schema_uri: legba/source/1.0.0
  version: "0000000000000000"        # placeholder — registry stamps content hash
  abstraction_level: L1
  state: draft                       # KEYED/TOKEN-GATED — operator flips after the token lands
  owner: s1_units_sources
  created: "2026-07-02T00:00:00Z"

scope:
  owner_tenant: shared
  # Global feed — consuming targets narrow by Subscription.geo.
  geo: []
  languages: [en]
  tags: [conflict, armed_conflict, political_violence, fatalities, events, structured, global]
  source_class: analysis           # S1-T9/S1-T8 reconcile — research/data project (coded conflict-event data), mirrors ACLED

acquisition: poll

cadence:
  # GED releases ~annually; the candidate dataset updates ~monthly. A daily
  # poll is generous and, with the StartDate high-water cursor + dedupe, cheap.
  schedule:
    factory_kind: cron
    raw: "0 4 * * *"
  cooldown_seconds: 600
  jitter_seconds: 300

config:
  # UCDP access token — VAULT REF (credential_id, never the plaintext). The
  # handler resolves it at pull time and sends it as the `x-ucdp-access-token`
  # header. Load it via the vault (source.ucdp.access_token) or set
  # LEGBA_UCDP_ACCESS_TOKEN in the runtime env before flipping to active.
  access_token_secret:
    factory_kind: secret
    raw: "source.ucdp.access_token"
  # GED dataset release version. Point at a candidate release string for the
  # most-current (monthly) UCDP Candidate Events Dataset.
  version:
    factory_kind: text
    raw: "24.1"
  # No country/region/violence-type filter — full global feed; targets narrow
  # via Subscription. Wide lookback because GED is a batch (not streaming)
  # release; the external-id + content-hash dedupe absorbs the overlap.
  lookback_days:
    factory_kind: number
    raw: 365

pipeline:
  ingestion_filters:
    - kind: dedupe_tier_1            # external_id (UCDP event id) canonical
      config: {}
    - kind: dedupe_tier_2            # SHA-256 content hash
      config: {}
  enrichment:
    # Records carry lat/long + country already; geocode refines the structured
    # geo column. No text enrichers — the source_headline field is short.
    - kind: geocode
      config: {}
  media: reference

deps:
  vault_secrets:
    - source.ucdp.access_token

output:
  retention: interest
  max_age_seconds: 2592000           # ~30d — candidate publishes monthly
  delivery: lossy

subscription_policy: open
