[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legba"
version = "0.1.0"
description = "Autonomous situational awareness platform"
license = {text = "AGPL-3.0-or-later"}
authors = [{name = "Lewis George"}]
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "redis[hiredis]>=5.0",
    "asyncpg>=0.29",
    "croniter>=2.0",
    "qdrant-client>=1.9",
    # Signal-content-depth INDEX PLANE — the OpenSearch full-text corpus client
    # (ships `opensearchpy.AsyncOpenSearch`). Async I/O runs over aiohttp (already
    # a base dep, above). The corpus_indexer deterministic sweep + backfill_corpus
    # write here; the module soft-imports so a host without the dep still boots.
    "opensearch-py[async]>=2.4",
    "pynacl>=1.5",
    "python-dotenv>=1.0",
    "nats-py>=2.7",
    "pyod>=1.1",
    "statsforecast>=1.7",
    "networkx>=3.2",
    # L-173 deterministic analyst kind — graph_mining/anomaly_detection/
    # structural_balance/calibration_tracking sub-handlers. networkx covers
    # graph_mining + structural_balance. numpy underpins the stats slice;
    # scipy was retired in L-205 (no imports landed in the descriptor-model
    # codebase; statsforecast/predictor uses its own pure-numpy quantile
    # tables — see comment in src/legba/data/analysts/predictor.py).
    "numpy>=1.26",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "feedparser>=6.0",
    # Scraper-kind body extraction AND (P2-1/S-10) the evidence_archiver's
    # main-text extraction over archived original bytes (Apache-2.0).
    "trafilatura>=1.8",
    "pycountry>=24.6",
    "geopy>=2.4",
    # L-150 language-detect filter handler. langdetect is the post-reshape
    # default (~1 MB, no model files, sub-ms per call once warmed) — used
    # by the LanguageDetectHandler's `backend="auto"` resolution. The
    # `lingua-language-detector` legacy backend retired in L-205 — descriptors
    # that wired `backend='lingua'` explicitly will need to be updated; the
    # handler degrades gracefully (the lingua import is wrapped in try/except).
    "langdetect>=1.0",
    # L-205 retired these heavy deps. Their consumers retired with the
    # in-process Phase 4 filters; the hosted-endpoint rewrite (2026-05-22)
    # routes embedding through `/v1/embeddings`, NER through `/extract`,
    # classification through `/classify`. They lived in `pyproject.toml`:
    #   - sentence-transformers / torch / transformers / huggingface_hub /
    #     tokenizers — BgeM3EmbeddingHandler stack handler (now retired).
    #   - spacy + per-language models (en_core_web_sm, xx_ent_wiki_sm, ...) —
    #     in-process NER (now retired).
    #   - lingua-language-detector — legacy language-detect backend.
    #   - scipy — no remaining consumer in the descriptor-model code.
    # L-123 proxy pool stack handler (aiohttp sessions for callers that
    # don't use httpx).
    "aiohttp>=3.9",
    # L-138 Common Crawl CC-NEWS source — WARC streaming + anonymous S3.
    "warcio>=1.7",
    "aiobotocore>=2.7",
    # L-131 GDELT BigQuery source. Lazy-imported so missing dep doesn't
    # break module import; required at runtime when the kind is registered.
    "google-cloud-bigquery>=3.20",
    # L-136 Telegram channel source. Lazy-imported as well.
    "telethon>=1.36",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # Defense-in-depth rate limiting on the expensive registry endpoints
    # (consult / deep_consult) — keyed on the bearer principal. The wiring
    # degrades to a loud-warn passthrough if the dep is somehow absent at
    # runtime (legba.data.registry.rate_limit), so it never hard-breaks boot.
    "slowapi>=0.1.9",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "mcp>=1.0",
    "pyyaml>=6.0",
    # L-104 / L-242 Starlark predicate DSL. starlark-pyo3 wraps the Rust
    # `starlark-rust` evaluator (the same one used by Buck2). Settled choice
    # over the dead Python-only ports; binding maintained, fast, no CGO.
    "starlark-pyo3>=2026.1",
    # L-002a Phase 5a runtime — Dapr Python SDK. Used by `legba-runtime` to
    # register actor types + state store + pubsub when a daprd sidecar is
    # available. The runtime itself works without Dapr (embedded mode) so
    # the dep is base-deps, not optional, to keep the host import clean.
    "dapr>=1.13",
    # dapr-ext-fastapi exposes the FastAPI router daprd hits to dispatch
    # actor methods + reminders into the legba-runtime-dapr process.
    "dapr-ext-fastapi>=1.13",
    # P-16 — Dapr Workflow extension (durabletask-backed). Hosts the
    # optimizer kind's GEPA loop as a Dapr Workflow on the same daprd
    # sidecar (placement+scheduler+actor-state) the rest of the runtime
    # already uses — the source-first-pivot replacement for temporalio.
    # Version-locked to the dapr SDK (1.17.x ⇒ dapr-ext-workflow 1.17.x).
    "dapr-ext-workflow>=1.17",
    # L-170 inline_target uses dspy.Module per L-105 eval-loop spec.
    # The kind handler imports the prompt module from `legba.prompts`;
    # the L-176 optimizer compiles candidates via dspy + GEPA (the GEPA
    # teleprompter landed in dspy 3.0, so the optimizer requires >=3.0).
    # HARD RULE: dspy/litellm ship ONLY in the worker image
    # (docker/Dockerfile.worker) — NEVER the runtime image or the analyst
    # inference hot path. The runtime lazy-imports build_prompt_module and
    # degrades to direct chat_complete when dspy is absent.
    "dspy-ai>=3.0",
    # L-195 STIX 2.1 bundle output kind. The OASIS reference library; we
    # use it to construct + serialise SDOs (report / incident / indicator
    # / identity / location / relationship) and TLP marking-definitions.
    # Pulls antlr4-python3-runtime + simplejson + stix2-patterns
    # transitively (~5 MB).
    "stix2>=3.0",
    # (L-205 / P-16) temporalio REMOVED — the optimizer's durable GEPA loop
    # runs as a Dapr Workflow (dapr-ext-workflow, above); its in-process GEPA
    # fallback (legba.runtime.dapr_workflow.gepa) is temporalio-free. No
    # Temporal server/worker is deployed; the runtime/temporal package was
    # deleted (P-CUT/C-3).
]

[project.urls]
Repository = "https://github.com/ldgeorge85/legba"

[project.scripts]
legba-mcp = "legba.ui.mcp_server:main"
legba-registry = "legba.data.registry.server:main"
# L-002a Phase 5a daprd-host entry point — FastAPI app + Dapr Actor wiring.
# Runs the actor types through the real daprd sidecar (see compose `--profile dapr`).
# Replaces the retired embedded `legba-runtime` (was `legba.runtime.host:main`,
# retired under L-205 along with `runtime/actors.py` + `runtime/host.py`).
legba-runtime-dapr = "legba.runtime.dapr_host:main"
# P-16 — Dapr-Workflow worker for the optimizer kind. Replaced the retired
# legba-temporal-worker (L-205): a long-running WorkflowRuntime that registers the
# GEPA optimizer workflow + activities against the daprd sidecar's gRPC
# channel. Can also be embedded in legba-runtime-dapr via
# legba.runtime.dapr_workflow.worker.build_workflow_runtime.
legba-dapr-workflow-worker = "legba.runtime.dapr_workflow.worker:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
data = [
    "asyncpg>=0.29",
    "qdrant-client>=1.9",
    "opensearch-py[async]>=2.4",
    "redis[hiredis]>=5.0",
    "nats-py>=2.7",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]
# L-140 — IntelMQ collector bridge. Heavy (~50 transitive packages: parsers
# for dozens of feed formats, GeoIP libs, etc.). Opt-in only.
intelmq = [
    "intelmq>=3.2",
]
# L-197 — XMPP sink for the alert output kind. slixmpp is the async-native
# XMPP client (asyncio event loop, no fork from sleekxmpp). Light dep
# (~3 MB) but pulls aiodns; gated behind an extra so minimal installs
# without operator-paging don't carry it.
xmpp = [
    "slixmpp>=1.8",
]
# L-197 — Matrix sink for the alert output kind. matrix-nio is the async
# pure-Python Matrix client. Heavier than slixmpp (~10 MB transitive,
# pulls cryptography + olm bindings) so it's also opt-in. Operators who
# only need Pushover + XMPP skip this; descriptors that route to Matrix
# at high/critical severity install ``legba[matrix]``.
matrix = [
    "matrix-nio>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["src/legba"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that require external services (Redis, Postgres, Qdrant)",
    "slow: tests that exercise multi-stage substrate paths and shouldn't run in the fast suite",
]
