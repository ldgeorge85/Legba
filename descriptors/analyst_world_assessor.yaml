# world_assessor — the GLOBAL COMPOSITION (P3-T5; S2-T3 repointed to REGIONS).
#
# The crown of the tower: ONE world-picture second-order Finding per cadence
# tick that COMPOSES the per-REGION reads (region_composition) — NOT the ~24
# per-country reads directly, and NOT a raw 24h signal one-pager. S2-T3 inserted
# the region floor between the country reads and the world read
# (unit sub-claim → country read → REGION read → world read), so the world read
# now fuses the FIVE region heads (5-6 inputs) — structurally removing the
# MAX_WORLD_INPUT_FINDINGS cap pressure (the P4-C2 "Global without the United
# States" failure class). Every factual clause is cited [[ref:N]] to a CITED
# region-read finding_id; the composition then gets the MANDATORY faithfulness
# verify (the generalized pass recognizes the [[ref:N]]->read bridge) and the T7
# hedge/double-count cap folds effective_confidence = min(confidence, overall_score).
#
# ── DEGRADE-NOT-DROP + absence-honest (S2-T3) ───────────────────────────────
# READ_SLICE's world branch (_assemble_world_region_slice) reads the region
# roster and, per region: feeds a present region head (mode 'region'); DEGRADES a
# region with no region head to that region's member country_composition heads
# (mode 'country_fallback' — never silently dropped); NAMES a region with neither
# as an unassessed GAP (mode 'gap') in the world prose via an appended REGION
# COVERAGE block. The per-region MODE that ran is stamped in data.region_coverage
# so the provenance is honest about which floor grounded each region.
#
# ── why kind = meta_findings_synthesizer (repointed from inline_target) ──────
# P0-T7 already DEMOTED this analyst's old role as a raw-signal executive
# one-pager (SEAMS #34): the world read is no longer a first-order LLM pass
# over the tenant-wide signal slice. It is now a COMPOSITION — an
# analysis-of-analysis over the verified country reads — so the correct
# archetype is `meta_findings_synthesizer` (reads OTHER analysts' findings via
# `subscription.other_analysts`, not raw signals). The same kind runs
# per-country under analyst_country_composition.yaml (a `targets` block ⇒
# per-target fan-out) and GLOBALLY here (NO `targets` block ⇒ one global run
# with target_filter=None). No code fork: the kind selects the WORLD
# composition prompt in-kind off the `composition` option the actor stamps for
# a verify-declaring global meta run, and READ_SLICE honors the global-
# composition branch (include_meta=True + verify-floor) so it reads the
# verified, meta-marked country_composition findings.
#
# ── single GLOBAL run (justified from _cadence_targets) ─────────────────────
# What makes a run global vs. per-target is the PRESENCE of a
# `subscription.targets` selector. This descriptor declares NONE — so
# `AnalystActor._cadence_targets()` returns None (the META case) and the
# cadence reminder fires exactly ONE global run with target_filter=None.
# Mirrors analyst_meta_synthesizer.yaml's global shape.
#
# ── verify OPT-IN ───────────────────────────────────────────────────────────
# `method.llm.verify` is the discriminator the whole verify dispatch keys on:
# the actor fires the faithfulness verify for a meta_findings_synthesizer
# finding IFF the descriptor DECLARES method.llm.verify (both compositions do;
# the old global analyst_meta_synthesizer.yaml does NOT → it stays excluded).

identity:
  id: world_assessor
  name: World Situational-Awareness Composition
  schema_uri: legba/analyst/1.0.0
  version: "0000000000000000"        # placeholder — registry stamps content hash
  kind: meta_findings_synthesizer
  type_signature:
    input_type: legba.runtime.SignalList
    output_type: legba.runtime.Finding
    deps_type: legba.runtime.deps.StandardDeps
  state: active
  owner: world_assessor

subscription:
  # No `targets` block → META analyst: ONE global run per cadence tick over the
  # per-REGION reads (see _cadence_targets → None → single global run). The
  # composition reads the OUTPUTS of region_composition, not raw signals —
  # resolved by the kind's READ_SLICE from other_analysts[].id. Because the run
  # is a verify-declaring GLOBAL meta, READ_SLICE takes the S2-T3 world branch:
  # it reads the region_composition HEADS (meta=True, so include_meta) verify-
  # floored, DEGRADES a region with no head to that region's country reads, and
  # NAMES a region with no read at all as a gap.
  other_analysts:
    - id: region_composition
      data_types: [finding]
      time_window: 24h
  substrate:
    direct_queries: false        # reads via the kind's READ_SLICE, not ad-hoc SQL

# ── DQ P6 DECISION: situations as a grounding source (2026-07-03) ────────────
# world_assessor grounds ['substrate'] only — it does NOT declare 'situations',
# so the P3 world composition never reads the situations frames. This omission is
# now DELIBERATE, not accidental: the global situations surface was polluted (P6)
# by ~35 NULL-target composition/snapshot report-receipts and status-quo
# non-event frames that headed the intensity ranking. Wiring situations into the
# world read BEFORE that surface is clean would inject those receipts into the
# crown composition. DECISION: DEFER declaring 'situations' here until (a) the P6
# grounding-read regex + clustering steady-state tag are live and (b) the
# migrations that CLOSE the NULL-target snapshot rows + retag steady-state frames
# have run and the global top-8 situations read is verified clean — THEN add
# 'situations' as a measured follow-up (A/B the world composition faithfulness).
# The P6 dapr_actors fix (world_assessor target_id stays GLOBAL, not a stray
# inputs[0] region) and the finding_supersession/clustering gate (world_assessor
# findings no longer MINT situations) are the prerequisites landed now.
mapping:
  fields: []
  schema_drift_policy: warn_and_continue

method:
  # Runtime dispatch is on identity.kind (meta_findings_synthesizer); method.kind
  # only needs to be a valid enum. llm_planner matches the single-turn
  # chat_complete shape the kind uses (same as analyst_country_composition.yaml).
  kind: llm_planner
  prompt_module: "legba.prompts.meta_findings_synthesizer.v1"
  llm:
    # MODEL POLICY (operator): composition on the CORE plane via a stack_ref
    # ($0). NEVER hardcode a model — a stack_ref keeps a later switch a one-line
    # descriptor PUT.
    primary:
      factory_kind: stack_ref
      raw: llm.primary.openai_compat
      expected_family: llm_provider
    # P3-T5: faithfulness VERIFY judge over the WORLD composition itself.
    # Currently the SAME core reasoning model (llm.primary.openai_compat,
    # gpt-oss-120B) that writes the units + the per-country + world compositions —
    # NOT a cross-family judge. Temporary: the 8B Llama-3.1-8B judge proved too
    # weak (harsh + mis-aimed); a dedicated reasoning judge is planned. KNOWN
    # LIMITATION: same-model judging shares blind spots, so the faithfulness signal
    # is weaker than an independent cross-family judge. This verify block's
    # PRESENCE (not target_id) is the OPT-IN the dispatch keys on — it makes the
    # actor run the faithfulness pass for this global meta finding, while the old
    # analyst_meta_synthesizer.yaml (no verify block) stays excluded. The
    # generalized verify pass recognizes the composition's [[ref:<uuid>]] →
    # country-read bridge and hands the judge each cited country read's text as
    # the evidence for each composed clause. Gated by LEGBA_VERIFY_LLM_JUDGE;
    # soft-fails to the deterministic floor (which still enforces the T7
    # anti-double-counting + hedge-laundering cap). Model stays a switchable
    # stack_ref.
    verify:
      factory_kind: stack_ref
      raw: llm.primary.openai_compat
      expected_family: llm_provider
    max_tokens: 768            # the kind's DEFAULT_MAX_TOKENS (narrower context)
  budget_tokens_per_day: 1000000
  # Composition budget: a global compose over ≤N country reads + 768 output. The
  # budget retry policy stays at the default `pause_until_next_window`: if the
  # cap is ever projected to be crossed, the actor pauses THIS analyst until the
  # next UTC bucket rather than demoting to a (non-wired) paid fallback.
  retry:
    budget:
      strategy: pause_until_next_window

cadence:
  # Run AFTER region_composition lands. The region compose fires at :45 past
  # 11 / 23 UTC (itself staggered after country_composition's :30); the world
  # composition runs at 00:00 / 12:00 UTC (~15m later) so the freshest full set
  # of region reads is present (a headless region degrades to its country reads,
  # which composed at :30, still well inside the 24h window).
  fallback_schedule: "0 0,12 * * *"
  # 11h — below the 12h interval, stamped at run-completion. A cooldown == the
  # 12h interval would land past the next fire and silently HALVE the cadence
  # (12h→24h; see cefd8ca). 11h keeps a 1h margin (matches country_composition).
  cooldown_seconds: 39600

# Surface the composition as an A2A skill, mirroring the prior world_assessment
# output binding (the FindingPayload still lands in analyst_outputs via the
# kind's default OUTPUT_KIND.FINDING regardless).
outputs:
  - kind: a2a_skill
    config:
      skill_id: intelligence.world_assessment
