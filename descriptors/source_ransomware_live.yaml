# Draft SourceDescriptor. Ships DRAFT.
# A claim source cannot go `active` until `scope.claim.sign_off` (who, when,
# note) is recorded; the lifecycle route refuses the flip without it.
#
# ransomware.live — a leak-site claim AGGREGATOR: an individual researcher's
# project that monitors ransomware data-leak sites several times a day and
# records, per post, the victim name, the group, the date, country and sector.
# It states that it does not host or distribute leaked data. What it publishes
# is therefore a LISTING OF CLAIMS: "group G posted victim V on its leak site".
# The gangs exaggerate, recycle and invent; the tracker inherits that.
#
# THE CLASS. `source_class: claim` — a row from here can ground only
# "ransomware.live listed ..." (attributed, dated); never that V was
# breached, never a corroboration of anything, never a credibility input
# (legba.data.claim_support; docs/DATA_SOURCES.md "Claim sources").
#
# Endpoint: the site's RSS feed, https://www.ransomware.live/rss.xml (the
# research shortlist, which also names a JSON API on data.ransomware.live
# without a path; the RSS address is the one machine-readable endpoint it
# gives in full). Not fetched from this host: the item structure is
# UNVERIFIED, so no `claim.claimant_path` is declared and every row is
# attributed to the declared claimant (the tracker). Once an operator has read
# the feed, a structured group field (e.g. the item's author or category)
# can be declared as `claimant_path` to attribute rows to the group itself.
#
# Text only. No media (screenshots of leak posts are exactly what the
# shortlist says to drop): `pipeline.media: reference`, no object store, no
# follow policy, and the document sink strips any media reference from a
# claim row. Links in a row are never followed (the intake refuses a request
# whose parent is a claim row unless the target host is an ordinary
# registered source). No fact_extractor (refused at save for this class);
# no geocode (a victim's country in a listing is not an event location).
#
# Access: `public` — a free no-auth feed (rule 1 of the access-class
# taxonomy); the claim class, not the access class, is what limits its use.
# Credibility: no seeded host row; the claim class keeps it out of every
# corroboration count regardless.

identity:
  id: source.ransomware_live.claims
  name: ransomware.live — leak-site claim listings
  kind: rss
  schema_uri: legba/source/1.0.0
  version: "0000000000000000"        # placeholder — registry stamps content hash
  abstraction_level: L1
  state: draft
  owner: owner@local
  created: "2026-11-14T00:00:00Z"

scope:
  owner_tenant: shared
  geo: []
  languages: [en]
  tags: [cyber, ransomware, claim, tracker]
  classifications: ["geopolitics.topic:cyber"]
  source_class: claim
  claim:
    claimant: "ransomware.live (leak-site tracker)"
    verb: listed
    sign_off:
      by: owner
      at: "2026-11-16T01:40:00Z"
      note: "Collected as claims only: the tracker listed X as a victim of Y; never as a confirmed incident."
  license_class: permissive_feed_unreviewed
  access_class: public          # free no-auth feed, no separate reuse agreement

acquisition: poll

cadence:
  schedule:
    factory_kind: cron
    raw: "17 */3 * * *"
  cooldown_seconds: 300
  jitter_seconds: 120

config:
  url:
    factory_kind: text
    raw: "https://www.ransomware.live/rss.xml"

pipeline:
  ingestion_filters:
    - kind: dedupe_tier_1            # URL-canonical hash
      config: {}
    - kind: dedupe_tier_2            # SHA-256 content hash
      config: {}
  enrichment:
    - kind: language_detect
      config: {}
    - kind: ner_multilingual
      config: {}
  media: reference

deps: {}

output:
  retention: interest
  max_age_seconds: 604800
  delivery: lossy

subscription_policy: open
