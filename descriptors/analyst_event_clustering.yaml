# Event Clustering analyst descriptor — DATA MODEL V3 / P1.
#
# A `deterministic`-kind META analyst over the shared canonical signal pool and
# the bounded tower candidate set. Per tick it clusters the new signal slice,
# matches candidates against existing event identities, promotes only the
# corroboration bar, upserts through `provenance.write_event`, and recomputes
# lifecycle transitions over the open event set.
#
# Two deliberate gates keep this dark:
#   * identity.state = draft — the runtime never schedules it until promoted;
#   * LEGBA_EVENTS stays off — the writer refuses structurally even if the
#     descriptor is accidentally activated before the orchestrator's rollout.
#
# Cadence:
#   * fallback_schedule = "14-54/20 * * * *" — every 20 min, clear of
#     situation_clustering ("5-59/20") and situation_tracker ("41 * * * *").
#   * cooldown_seconds = 900 — the upserts and links are idempotent, but the
#     signal + open-event scans are deliberately rate-bounded.

identity:
  id: event_clustering
  name: Event Clustering
  schema_uri: legba/analyst/1.0.0
  version: "0000000000000000"        # registry stamps the content hash
  kind: deterministic
  type_signature:
    input_type: legba.runtime.SignalList
    output_type: legba.runtime.Finding
    deps_type: legba.runtime.deps.StandardDeps
  state: draft
  owner: data_model_v3_p1

subscription:
  # No `targets` block -> META analyst: one global sweep per cadence tick. The
  # handler reads the canonical signals slice, open events and bounded tower
  # candidates directly through deps.pg_pool; it does not consume a per-target
  # materialized slice.
  other_analysts: []
  substrate:
    direct_queries: true

mapping:
  fields: []
  schema_drift_policy: warn_and_continue

method:
  kind: deterministic
  impl: legba.data.analysts.deterministic:run_method
  sub_handler: event_clustering
  budget_tokens_per_day: 0
  options:
    lookback_hours: 24
    # P1b (2026-09-23): the first live run held its actor turn ~60 min — the
    # caps are lowered for the first ticks so a bounded pass drains the backlog
    # in slices the pass budget can finish; widen by PUT once the cadence
    # proves out. The pass budget itself is LEGBA_EVENT_CLUSTERING_PASS_BUDGET_
    # SECONDS (default 120); pass_budget_seconds is the descriptor-side mirror.
    max_signals: 300
    max_open_events: 2000
    match_threshold: 0.5
    embedding_cosine_min: 0.97
    qdrant_collection: legba_signals
    include_tower: true
    tower_window_days: 30
    tower_floor: 0.5
    max_tower_candidates: 50
    max_lifecycle_events: 5000

cadence:
  fallback_schedule: "14-54/20 * * * *"
  cooldown_seconds: 900

# No extra output sinks: event rows, links, entity links and lifecycle rows are
# side-written transactionally. The deterministic kind's summary is TRACE_ONLY.
outputs: []
