# P3-6 Wave-A (A1) — draft SourceDescriptor. Ships DRAFT (operator activates).
#
# US EIA 'Today in Energy' — the daily, analytically useful EIA feed (a NET-NEW source alongside the already-registered source.eia.press; the 2026-07-02 sweep said register BOTH).
# Verified live 2026-06-30. Keyless. Host eia.gov already credibility-seeded (S-1).
#
# source_class: official. Credibility host eia.gov (seeded 0.90/gov, state_affiliation True by the registrar).
# state: draft — bulk registration creates NO live actor; activation
# (draft -> configured -> active) is the operator's after verifying the route live.

identity:
  id: source.eia.today_in_energy
  name: US EIA — Today in Energy
  kind: rss
  schema_uri: legba/source/1.0.0
  version: "0000000000000000"        # placeholder — registry stamps content hash
  abstraction_level: L1
  state: draft
  owner: p3_6_wave_a
  created: "2026-07-27T00:00:00Z"

scope:
  owner_tenant: shared
  geo: [US]
  languages: [en]
  tags: [gov, energy, energy_security, economic, wave_a]
  source_class: official

acquisition: poll

cadence:
  schedule:
    factory_kind: cron
    raw: "10 2-23/6 * * *"
  cooldown_seconds: 60
  jitter_seconds: 30

config:
  url:
    factory_kind: text
    raw: "https://www.eia.gov/rss/todayinenergy.xml"

pipeline:
  ingestion_filters:
    - kind: dedupe_tier_1            # URL-canonical hash
      config: {}
    - kind: dedupe_tier_2            # SHA-256 content hash
      config: {}
  enrichment:
    # language_detect FIRST so ner_multilingual uses the detected language.
    # No fact_extractor on the draft: the operator adds it after confirming the
    # route yields full article text (mirrors the RSSHub-lane conservative default).
    - kind: language_detect
      config: {}
    - kind: ner_multilingual
      config: {}
    - kind: geocode
      config: {}
  media: reference

deps: {}

output:
  retention: interest
  max_age_seconds: 604800
  delivery: lossy

subscription_policy: open
