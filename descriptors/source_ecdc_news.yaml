# X-1 source expansion (2026-11-14) — draft SourceDescriptor. Ships DRAFT;
# the reference host walks it to CONFIGURED (descriptors/LIFECYCLE.md), never
# active — activation is the owner's call per source.
#
# European Centre for Disease Prevention and Control (ECDC, an EU agency) —
# news items (risk assessments, epidemiological updates, announcements).
# OFFICIAL. Companion to source.ecdc.threats_report.
# Checked 2026-11-14 by the source-expansion review (one GET, generic client
# identity): HTTP 200, application/rss+xml, 10 items, newest 2026-11-11 12:47
# UTC, oldest 2026-10-19 — about three a week. Every six hours is ample.
#
# Language: en. Region: Europe — no declared geo (EU/EEA-wide).
#
# robots.txt allows the feed path for `*`. Credibility: ecdc.europa.eu 0.90 / gov.
#
# First poll: the default first-poll age cap (30 days).

identity:
  id: source.ecdc.news
  name: ECDC — news
  kind: rss
  schema_uri: legba/source/1.0.0
  version: "0000000000000000"        # placeholder — registry stamps content hash
  abstraction_level: L1
  state: draft
  owner: x1_source_expansion
  created: "2026-11-14T00:00:00Z"

scope:
  owner_tenant: shared
  geo: []
  languages: [en]
  tags: [health, disease, outbreak, eu, gov]
  source_class: official
  license_class: cc_by            # ECDC copyright notice: CC BY 4.0
  attribution: "Source: European Centre for Disease Prevention and Control (ECDC), CC BY 4.0"
  access_class: public            # free no-auth feed, no separate reuse agreement

acquisition: poll

cadence:
  schedule:
    factory_kind: cron
    raw: "17 */6 * * *"
  cooldown_seconds: 300
  jitter_seconds: 120

config:
  url:
    factory_kind: text
    raw: "https://www.ecdc.europa.eu/en/taxonomy/term/1307/feed"

pipeline:
  ingestion_filters:
    - kind: dedupe_tier_1            # URL-canonical hash
      config: {}
    - kind: dedupe_tier_2            # SHA-256 content hash
      config: {}
  enrichment:
    - kind: language_detect
      config: {}
    - kind: ner_multilingual
      config: {}
    - kind: geocode
      config: {}
  media: reference

deps: {}

output:
  retention: interest
  max_age_seconds: 604800
  delivery: lossy

subscription_policy: open
