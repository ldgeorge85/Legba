# Legba — NATS JetStream store limits (infra memory/resource tuning).
#
# The nats:2-alpine image's nats-server CLI exposes only `-js/--jetstream`
# and `-sd/--store_dir` under JetStream Options — there is NO
# `--max_memory_store` / `--max_file_store` command-line flag. Left at the
# CLI defaults, JetStream auto-derives huge limits (~75% of host RAM for the
# memory store, most of the available disk for the file store), which can grow
# until it pressures the box. This file bounds both stores.
#
# Wiring: the nats service still passes the existing flags on the CLI
# (`nats-server --jetstream --store_dir /data -m 8222` [+ optional `--auth`]);
# this file is added via `-c /etc/nats/nats.conf`. It intentionally sets ONLY
# the two store caps (no store_dir here — the CLI `--store_dir /data` remains
# the single source for the storage path, unchanged).
jetstream {
  max_memory_store: 2GB
  max_file_store: 10GB
}
