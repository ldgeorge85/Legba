# X-1 source expansion (2026-11-14) — draft SourceDescriptor. Ships DRAFT;
# the reference host walks it to CONFIGURED (descriptors/LIFECYCLE.md), never
# active — activation is the owner's call per source.
#
# UK Office of Financial Sanctions Implementation (OFSI, HM Treasury) — the
# office's GOV.UK activity feed: sanctions notices, enforcement and guidance.
# The UK government's own sanctions-implementation voice: OFFICIAL.
# (The UK Sanctions List itself, as an instrument, is a separate binding in
# the sanctions profile; this is the notices feed.)
# Checked 2026-11-14 by the source-expansion review (one GET, generic client
# identity): HTTP 200, application/atom+xml, 20 items, newest 2026-11-12
# 15:53 UTC, oldest 2026-07-24 — roughly weekly. Every six hours is ample.
#
# Language: en. Region: United Kingdom — the declared GB is the
# publisher-origin FALLBACK only.
#
# robots.txt allows the feed path for `*`.
# Credibility: gov.uk already seeded by the profile's source catalog.
#
# First poll: the default first-poll age cap (30 days) — the older items of
# this slow feed are not wanted whole.

identity:
  id: source.ukofsi.govuk
  name: UK OFSI (HM Treasury) — GOV.UK activity
  kind: rss
  schema_uri: legba/source/1.0.0
  version: "0000000000000000"        # placeholder — registry stamps content hash
  abstraction_level: L1
  state: draft
  owner: x1_source_expansion
  created: "2026-11-14T00:00:00Z"

scope:
  owner_tenant: shared
  geo: [GB]
  languages: [en]
  tags: [sanctions, finance, gov, gb, regulator]
  source_class: official
  license_class: open_gov_attribution
  attribution: "Contains public sector information licensed under the Open Government Licence v3.0 (OFSI, HM Treasury, gov.uk)"
  access_class: public            # free no-auth feed, no separate reuse agreement

acquisition: poll

cadence:
  schedule:
    factory_kind: cron
    raw: "47 */6 * * *"
  cooldown_seconds: 300
  jitter_seconds: 120

config:
  url:
    factory_kind: text
    raw: "https://www.gov.uk/government/organisations/office-of-financial-sanctions-implementation.atom"

pipeline:
  ingestion_filters:
    - kind: dedupe_tier_1            # URL-canonical hash
      config: {}
    - kind: dedupe_tier_2            # SHA-256 content hash
      config: {}
  enrichment:
    - kind: language_detect
      config: {}
    - kind: ner_multilingual
      config: {}
    - kind: geocode
      config: {}
  media: reference

deps: {}

output:
  retention: interest
  max_age_seconds: 604800
  delivery: lossy

subscription_policy: open
