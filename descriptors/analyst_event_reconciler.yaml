# Event Reconciler analyst descriptor — DATA MODEL V3 / P1.
#
# A `deterministic`-kind META analyst that writes the two relation classes the
# substrate can infer without adjudication:
#   * correlated_with between same-signature events produced under different
#     analyst ids;
#   * evolves_from between temporally adjacent events sharing the configured
#     number of resolved actors.
#
# caused_by and contradicts are deliberately not inferred here; the writer
# refuses them with SEAMS #56 until an attribution/contradiction lane exists.
#
# Like event_clustering, this descriptor is state: draft and the handler still
# no-ops while LEGBA_EVENTS is off.

identity:
  id: event_reconciler
  name: Event Reconciler
  schema_uri: legba/analyst/1.0.0
  version: "0000000000000000"        # registry stamps the content hash
  kind: deterministic
  type_signature:
    input_type: legba.runtime.SignalList
    output_type: legba.runtime.Finding
    deps_type: legba.runtime.deps.StandardDeps
  state: draft
  owner: data_model_v3_p1

subscription:
  # META sweep: the handler reads the bounded event population directly through
  # deps.pg_pool and does not consume a per-target materialized slice.
  other_analysts: []
  substrate:
    direct_queries: true

mapping:
  fields: []
  schema_drift_policy: warn_and_continue

method:
  kind: deterministic
  impl: legba.data.analysts.deterministic:run_method
  sub_handler: event_reconciler
  budget_tokens_per_day: 0
  options:
    max_events: 5000
    evolves_min_actors: 2
    evolves_max_gap_hours: 168
    # P1b (2026-09-23): the same turn-budget discipline as event_clustering —
    # LEGBA_EVENT_RECONCILER_PASS_BUDGET_SECONDS defaults 120 s; this option is
    # the descriptor-side mirror and 0 disables the bound.
    pass_budget_seconds: 120

cadence:
  # Every 20 min at :19/:39/:59 — after the :14/:34/:54 clustering tick and
  # still clear of situation_tracker at :41.
  fallback_schedule: "19-59/20 * * * *"
  cooldown_seconds: 900

# Event edges are side-written transactionally; the run summary is TRACE_ONLY.
outputs: []
