# X-1 source expansion (2026-11-14) — draft SourceDescriptor. Ships DRAFT;
# the reference host walks it to CONFIGURED (descriptors/LIFECYCLE.md), never
# active — activation is the owner's call per source.
#
# UK Ministry of Defence — the department's GOV.UK activity feed (news,
# announcements, statements, publications). The UK government's own
# defence-ministry voice: OFFICIAL (the UK government's position, a primary
# source — not independent confirmation).
# Checked 2026-11-14 by the source-expansion review (one GET, generic client
# identity): HTTP 200, application/atom+xml (Atom — the rss kind's feedparser
# reads Atom), 20 items, newest 2026-11-13 16:47 UTC, oldest 2026-11-11 —
# about 9 items a day. Every two hours keeps inside a two-day window.
#
# Language: en. Region: United Kingdom — the declared GB is the
# publisher-origin FALLBACK only.
#
# robots.txt allows the feed path for `*`.
# Credibility: gov.uk is already seeded by the profile's source catalog
# (0.90 / gov) — no new row.
#
# First poll: the default first-poll age cap (30 days).

identity:
  id: source.ukmod.govuk
  name: UK Ministry of Defence — GOV.UK activity
  kind: rss
  schema_uri: legba/source/1.0.0
  version: "0000000000000000"        # placeholder — registry stamps content hash
  abstraction_level: L1
  state: draft
  owner: x1_source_expansion
  created: "2026-11-14T00:00:00Z"

scope:
  owner_tenant: shared
  geo: [GB]
  languages: [en]
  tags: [defence, military, gov, gb, ministry]
  source_class: official
  license_class: open_gov_attribution
  attribution: "Contains public sector information licensed under the Open Government Licence v3.0 (UK Ministry of Defence, gov.uk)"
  access_class: public            # free no-auth feed, no separate reuse agreement

acquisition: poll

cadence:
  schedule:
    factory_kind: cron
    raw: "43 */2 * * *"
  cooldown_seconds: 60
  jitter_seconds: 60

config:
  url:
    factory_kind: text
    raw: "https://www.gov.uk/government/organisations/ministry-of-defence.atom"

pipeline:
  ingestion_filters:
    - kind: dedupe_tier_1            # URL-canonical hash
      config: {}
    - kind: dedupe_tier_2            # SHA-256 content hash
      config: {}
  enrichment:
    # No fact_extractor (the conservative default of the official-feed drafts).
    - kind: language_detect
      config: {}
    - kind: ner_multilingual
      config: {}
    - kind: geocode
      config: {}
  media: reference

deps: {}

output:
  retention: interest
  max_age_seconds: 604800
  delivery: lossy

subscription_policy: open
