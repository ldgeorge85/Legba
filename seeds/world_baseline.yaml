  # --- Iran (the temporal-collapse fix; web-verified ground truth) ----------
  # Iran's head of STATE is the Supreme Leader (the real executive authority),
  # NOT the President. The prior Supreme Leader Ali Khamenei was killed in the
  # US-Israel strike; his office fact is CLOSED (valid_until 2026-02-28) and the
  # adapter's auto-supersession points it at the successor. Mojtaba Khamenei is
  # the CURRENT (open) head of state since 2026-03-08. The executive President
  # is carried separately under `office: "head of government"` so it does NOT
  # supersede the Supreme Leader on the (Iran, 'head of state') key.
  - leader: "Ali Khamenei"
    country: "Iran"
    valid_from: "1989-06-04"
    valid_until: "2026-02-28"
  - leader: "Mojtaba Khamenei"
    country: "Iran"
    valid_from: "2026-03-08"
  - leader: "Masoud Pezeshkian"
    country: "Iran"
    office: "head of government"
    valid_from: "2024-07-28"

# --- Alliance memberships -> signed nexuses --------------------------------
# Each membership becomes a typed signed nexus
#   (subject=country, rel_type='MemberOf', object=bloc, polarity=+1)
# valid_from is the country's accession date to the bloc.
alliances:
  - bloc: "NATO"
    rel_type: "MemberOf"
    polarity: 1
    members:
      - { country: "United States",  valid_from: "1949-04-04" }
      - { country: "United Kingdom", valid_from: "1949-04-04" }
      - { country: "France",         valid_from: "1949-04-04" }
      - { country: "Canada",         valid_from: "1949-04-04" }
      - { country: "Italy",          valid_from: "1949-04-04" }
      - { country: "Germany",        valid_from: "1955-05-06" }
      - { country: "Turkey",         valid_from: "1952-02-18" }
  - bloc: "European Union"
    rel_type: "MemberOf"
    polarity: 1
    members:
      - { country: "France",  valid_from: "1958-01-01" }
      - { country: "Germany", valid_from: "1958-01-01" }
      - { country: "Italy",   valid_from: "1958-01-01" }
  - bloc: "BRICS"
    rel_type: "MemberOf"
    polarity: 1
    members:
      - { country: "Brazil",       valid_from: "2009-06-16" }
      - { country: "Russia",       valid_from: "2009-06-16" }
      - { country: "India",        valid_from: "2009-06-16" }
      - { country: "China",        valid_from: "2009-06-16" }
      - { country: "South Africa", valid_from: "2010-12-24" }
      - { country: "Saudi Arabia", valid_from: "2024-01-01" }
  - bloc: "Gulf Cooperation Council"
    rel_type: "MemberOf"
    polarity: 1
    members:
      - { country: "Saudi Arabia", valid_from: "1981-05-25" }

# --- Active conflicts -> signed -1 nexuses ---------------------------------
# The CURRENT active-conflict layer (the piece that was missing). Each conflict
# lists its belligerents; the adapter emits one signed -1 nexus per ORDERED
# pair (subject=country, rel_type='InActiveConflictWith', object=belligerent)
# so the grounding resolver — which matches on nexuses.subject — surfaces the
# war whichever side a country analyst is scoped to. Distinct belligerent pairs
# are distinct typed triples, so a country in several wars keeps one open edge
# per opponent (no self-supersession). Adding a conflict (e.g. Russia-Ukraine)
# is a one-line entry below. valid_from is the conflict-onset date; set
# valid_until when a conflict ends (the edge then closes, dropping out of the
# current-state grounding).
conflicts:
  - name: "US-Israel-Iran war"
    belligerents: ["Iran", "United States", "Israel"]
    valid_from: "2026-02-28"
