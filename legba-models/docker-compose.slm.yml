# SLM (Small Language Model) — Llama 3.1 8B Instruct via llama.cpp
#
# Runs on T4 GPU using llama.cpp server with CUDA offload.
# Uses Q5_K_M GGUF quantization for best speed/quality balance.
#
# Usage (from the legba-models directory):
#   docker compose -f docker-compose.yml -f docker-compose.slm.yml up -d legba-slm
#
# The SLM serves the subconscious service on the main host.
# Default port: 8701 (mapped from llama.cpp's internal 8080).

services:
  legba-slm:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: legba-slm
    command:
      - -m
      - /models/Meta-Llama-3.1-8B-Instruct-Q5_K_M.gguf
      - --host
      - "0.0.0.0"
      - --port
      - "8080"
      - -ngl
      - "99"
      - -c
      - "4096"
      - -np
      - "4"
      - --flash-attn
      - "on"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${SLM_GPU_DEVICE:-1}']
              capabilities: [gpu]
    volumes:
      - /mnt/data/models/hfcache/llama-3.1-8b-instruct-gguf:/models:ro
    ports:
      # B-1: loopback-only — published model-serving ports must not bypass
      # the TLS perimeter. Same-host consumers use 127.0.0.1:8701 or the
      # fastchat docker network (legba-slm:8080); remote consumers go through
      # the TLS reverse proxy.
      - "127.0.0.1:8701:8080"
    networks:
      fastchat:
        aliases:
          - legba-slm
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

networks:
  fastchat:
    external: true
